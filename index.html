<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>文興遊戲群島</title>
<meta name="description" content="國一・國二跑班資訊科技・個人遊戲作品展：由六角空中島拼成的 3D 玩具城市，點島嶼就能直接玩。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#3b3550; --ink-2:#6b6480; --cream:#fff8ec; --paper:#fffdf8;
  --tomato:#ef6f53; --tomato-d:#c9533b; --mustard:#f4c35a; --mustard-d:#d39f32;
  --mint:#7cc3a0; --mint-d:#559c7a; --sky:#8fcbeb; --line:rgba(59,53,80,.14);
  --shadow:0 10px 30px rgba(59,40,30,.18), 0 2px 0 rgba(59,40,30,.08);
  --r:18px;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --round:"Fredoka","Noto Sans TC",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#f3dcc0;color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
body.hovering #c{cursor:pointer}

/* ---------- 玩具感面板 ---------- */
.panel{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);border:2px solid #fff}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--cream);font-size:12px;font-weight:700;color:var(--ink-2)}
.toybtn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:14px;
  background:var(--paper);font-weight:700;font-size:15px;box-shadow:0 4px 0 #d9c8ad,0 8px 18px rgba(59,40,30,.16);transition:transform .12s,box-shadow .12s;white-space:nowrap}
.toybtn:hover{transform:translateY(-2px);box-shadow:0 6px 0 #d9c8ad,0 12px 22px rgba(59,40,30,.18)}
.toybtn:active{transform:translateY(3px);box-shadow:0 1px 0 #d9c8ad,0 4px 10px rgba(59,40,30,.16)}
.toybtn.red{background:var(--tomato);color:#fff;box-shadow:0 4px 0 var(--tomato-d),0 8px 18px rgba(201,83,59,.3)}
.toybtn.red:hover{box-shadow:0 6px 0 var(--tomato-d),0 12px 22px rgba(201,83,59,.32)}
.toybtn.red:active{box-shadow:0 1px 0 var(--tomato-d)}
.toybtn.yellow{background:var(--mustard);box-shadow:0 4px 0 var(--mustard-d),0 8px 18px rgba(211,159,50,.3)}
.toybtn.yellow:active{box-shadow:0 1px 0 var(--mustard-d)}
.toybtn svg{width:20px;height:20px;flex:none}
.toybtn.icon{width:46px;padding:0}
.toybtn.muted{opacity:.7}

/* ---------- 品牌 ---------- */
.brand{position:fixed;left:20px;top:18px;display:flex;align-items:center;gap:12px;padding:10px 18px 10px 12px;z-index:5}
.brand .mark{width:46px;height:46px;flex:none}
.brand h1{font-size:24px;font-weight:900;letter-spacing:.06em;line-height:1.1}
.brand h1 em{font-style:normal;color:var(--tomato)}
.brand p{font-size:12px;color:var(--ink-2);font-weight:700;letter-spacing:.04em;margin-top:2px}

/* ---------- 即時資訊 ---------- */
.live{position:fixed;right:20px;top:18px;z-index:5;padding:12px 16px;min-width:230px}
.live .row{display:flex;align-items:center;justify-content:space-between;gap:14px}
.live .clock{font-family:var(--round);font-size:30px;font-weight:600;letter-spacing:.02em;font-variant-numeric:tabular-nums;line-height:1}
.live .phase{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px}
.live .phase i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:15px;background:var(--cream)}
.live .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.live .stat{background:var(--cream);border-radius:12px;padding:6px 4px;text-align:center}
.live .stat b{display:block;font-family:var(--round);font-size:20px;font-weight:600;line-height:1.1}
.live .stat span{font-size:11px;color:var(--ink-2);font-weight:700}
.live .bar{height:8px;border-radius:99px;background:var(--cream);margin-top:10px;overflow:hidden}
.live .bar div{height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--mustard));border-radius:99px;transition:width .6s}
.live .feed{margin-top:8px;font-size:12px;color:var(--ink-2);font-weight:700;height:18px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

/* ---------- 底部操作 ---------- */
.dock{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:10px;z-index:5;align-items:center}
.hint{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);font-size:12px;font-weight:700;color:rgba(59,53,80,.7);background:rgba(255,253,248,.7);
  padding:5px 12px;border-radius:99px;z-index:4;backdrop-filter:blur(6px);white-space:nowrap;transition:opacity .6s}
body.night .hint{color:#e9e4ff;background:rgba(30,30,60,.5)}

/* ---------- 島名標籤 ---------- */
#labels{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);white-space:nowrap;font-size:12px;font-weight:700;
  padding:3px 9px 3px 7px;border-radius:99px;background:rgba(255,253,248,.92);box-shadow:0 2px 6px rgba(59,40,30,.15);display:flex;gap:5px;align-items:center;will-change:transform,opacity}
.lbl .no{font-family:var(--round);font-size:11px;font-weight:600;color:#fff;background:var(--ink);border-radius:99px;padding:0 6px;line-height:16px}
.lbl.done .no{background:var(--mint-d)}
.lbl.hot{background:var(--tomato);color:#fff}
.lbl.hot .no{background:#fff;color:var(--tomato)}

/* ---------- 懸停卡 ---------- */
.tip{position:fixed;left:0;top:0;z-index:6;pointer-events:none;width:250px;padding:10px;display:flex;gap:10px;opacity:0;transform:translate(-50%,calc(-100% - 18px)) scale(.92);transition:opacity .15s,transform .15s}
.tip.show{opacity:1;transform:translate(-50%,calc(-100% - 18px)) scale(1)}
.tip img{width:66px;height:96px;object-fit:cover;border-radius:10px;flex:none;background:var(--cream)}
.tip .t{font-weight:900;font-size:15px;line-height:1.3}
.tip .s{font-size:11px;color:var(--ink-2);font-weight:700;margin-top:2px}
.tip .a{margin-top:6px;font-size:12px;font-weight:700}
.tip .go{margin-top:8px;display:inline-block;background:var(--tomato);color:#fff;font-size:12px;font-weight:700;border-radius:8px;padding:3px 8px}

/* ---------- 目錄抽屜 ---------- */
.drawer{position:fixed;left:20px;top:100px;bottom:96px;width:340px;z-index:7;display:flex;flex-direction:column;padding:14px;transform:translateX(calc(-100% - 30px));transition:transform .35s cubic-bezier(.3,1.3,.5,1)}
.drawer.open{transform:none}
.drawer h2{font-size:17px;font-weight:900;display:flex;align-items:center;justify-content:space-between}
.search{margin-top:10px;display:flex;align-items:center;gap:8px;background:var(--cream);border-radius:12px;padding:0 12px;height:42px}
.search input{flex:1;border:0;background:none;font:inherit;font-size:14px;font-weight:700;color:var(--ink);outline:none;min-width:0}
.filters{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.filters button{padding:4px 10px;border-radius:99px;background:var(--cream);font-size:12px;font-weight:700;color:var(--ink-2)}
.filters button.on{background:var(--ink);color:#fff}
.list{margin-top:10px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:6px;padding-right:4px;overscroll-behavior:contain}
.list::-webkit-scrollbar{width:6px}.list::-webkit-scrollbar-thumb{background:#e4d6c0;border-radius:9px}
.item{display:flex;gap:10px;align-items:center;padding:6px;border-radius:12px;text-align:left;width:100%;transition:background .15s}
.item:hover{background:var(--cream)}
.item img{width:40px;height:56px;border-radius:8px;object-fit:cover;background:var(--cream);flex:none}
.item .ph{width:40px;height:56px;border-radius:8px;background:var(--cream);flex:none;display:grid;place-items:center;font-size:18px}
.item .n{font-size:14px;font-weight:900;display:flex;gap:6px;align-items:center}
.item .n small{font-family:var(--round);font-size:11px;font-weight:600;color:var(--ink-2)}
.item .g{font-size:12px;color:var(--ink-2);font-weight:700;margin-top:2px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .n .cchip{font-style:normal;font-size:10px;color:#fff;border-radius:6px;padding:1px 5px;font-weight:700}
.item .ok{margin-left:auto;font-size:11px;font-weight:700;color:var(--mint-d);flex:none}
.empty{padding:20px;text-align:center;color:var(--ink-2);font-size:13px;font-weight:700}

/* ---------- 遊戲視窗 ---------- */
.modal{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:rgba(40,30,40,.55);backdrop-filter:blur(6px);padding:16px;opacity:0;pointer-events:none;transition:opacity .25s}
.modal.open{opacity:1;pointer-events:auto}
.mwin{flex:1;display:flex;flex-direction:column;overflow:hidden;transform:scale(.94) translateY(20px);transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.modal.open .mwin{transform:none}
.mbar{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:2px solid var(--line);flex-wrap:wrap}
.mbar img{width:38px;height:52px;object-fit:cover;border-radius:8px;flex:none}
.mbar .t{font-size:18px;font-weight:900;line-height:1.2}
.mbar .s{font-size:12px;font-weight:700;color:var(--ink-2)}
.mtabs{display:flex;gap:6px;flex-wrap:wrap;margin-left:8px}
.mtabs button{padding:6px 12px;border-radius:10px;background:var(--cream);font-size:13px;font-weight:700}
.mtabs button.on{background:var(--ink);color:#fff}
.mact{margin-left:auto;display:flex;gap:8px}
.mact .toybtn{height:40px;font-size:14px;padding:0 14px}
.stage{flex:1;position:relative;background:#111}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#111}
.ext{position:absolute;inset:0;display:none;align-items:center;justify-content:center;gap:28px;padding:24px;background:radial-gradient(circle at 30% 30%,#fff3dd,#f2d6b4);flex-wrap:wrap}
.ext img{max-height:70%;max-width:46%;border-radius:16px;box-shadow:var(--shadow)}
.ext .box{max-width:340px}
.ext h3{font-size:26px;font-weight:900;line-height:1.25}
.ext p{margin:10px 0 18px;color:var(--ink-2);font-weight:700;font-size:14px;line-height:1.6}
.stage.external .ext{display:flex}

/* ---------- 載入畫面 ---------- */
.loader{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#fff6e6,#f3d6b3);transition:opacity .8s,visibility .8s}
.loader.done{opacity:0;visibility:hidden}
.loader .in{text-align:center}
.loader svg{width:92px;height:92px;animation:float 2.2s ease-in-out infinite}
.loader h2{font-size:28px;font-weight:900;letter-spacing:.1em;margin-top:10px}
.loader p{font-size:13px;color:var(--ink-2);font-weight:700;margin-top:6px}
.loader .pb{width:200px;height:10px;border-radius:99px;background:#fff;margin:16px auto 0;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.08)}
.loader .pb div{height:100%;width:0;background:linear-gradient(90deg,var(--tomato),var(--mustard));border-radius:99px;transition:width .3s}
.loader .err{display:none;max-width:360px;margin:14px auto 0;font-size:13px;font-weight:700;color:var(--tomato-d);line-height:1.6}
@keyframes float{50%{transform:translateY(-10px) rotate(4deg)}}

.toast{position:fixed;left:50%;top:22px;transform:translate(-50%,-140%);z-index:30;padding:10px 16px;font-weight:700;font-size:14px;transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.toast.show{transform:translate(-50%,0)}

@media (max-width:760px){
  .brand{left:12px;top:12px;padding:8px 12px 8px 8px}
  .brand .mark{width:36px;height:36px}
  .brand h1{font-size:19px}.brand p{font-size:10px}
  .live{right:12px;top:auto;bottom:86px;min-width:0;padding:8px 12px}
  .live .stats,.live .feed{display:none}
  .live .clock{font-size:20px}
  .live .bar{margin-top:6px}
  .hint{display:none}
  .dock{bottom:14px;gap:8px;width:calc(100% - 24px);justify-content:center}
  .dock .toybtn .tx{display:none}
  .dock .toybtn{padding:0 14px}
  .drawer{left:12px;right:12px;width:auto;top:auto;bottom:76px;height:62vh;transform:translateY(calc(100% + 90px))}
  .modal{padding:0}
  .mwin{border-radius:0}
  .mbar{padding:8px}
  .mbar .t{font-size:15px}
  .mact .toybtn .tx{display:none}
  .mtabs{order:5;margin-left:0;width:100%}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>

<header class="brand panel">
  <svg class="mark" viewBox="0 0 48 48" aria-hidden="true">
    <path d="M24 3 42 13.5v21L24 45 6 34.5v-21Z" fill="#7cc3a0"/>
    <path d="M24 3 42 13.5 24 24 6 13.5Z" fill="#a7dcbd"/>
    <path d="M24 24 42 13.5v21L24 45Z" fill="#559c7a"/>
    <rect x="17" y="10" width="14" height="10" rx="2" fill="#ef6f53"/>
    <path d="M15 11 24 4l9 7Z" fill="#c9533b"/>
    <circle cx="24" cy="15" r="2.4" fill="#fff8ec"/>
  </svg>
  <div>
    <h1>文興<em>遊戲群島</em></h1>
    <p id="brandSub">國一・國二跑班資訊科技・個人遊戲作品展</p>
  </div>
</header>

<aside class="live panel" aria-live="polite">
  <div class="row">
    <div class="clock" id="clock">--:--</div>
    <div class="phase"><i id="phaseIcon">☀️</i><span id="phaseText">白天</span></div>
  </div>
  <div class="stats">
    <div class="stat"><b id="sIsland">0</b><span>座島嶼</span></div>
    <div class="stat"><b id="sGame">0</b><span>款遊戲</span></div>
    <div class="stat"><b id="sDone">0</b><span>我玩過</span></div>
  </div>
  <div class="bar" title="探索進度"><div id="progress"></div></div>
  <div class="feed" id="feed">歡迎登島！</div>
</aside>

<div class="tip panel" id="tip"></div>
<div class="hint" id="hint">拖曳旋轉・滾輪縮放・右鍵平移・點一下島嶼直接開玩・🔊 可開關背景音</div>

<nav class="dock">
  <button class="toybtn" id="btnList" title="島嶼目錄"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span class="tx">島嶼目錄</span></button>
  <button class="toybtn red" id="btnRandom" title="隨機登島"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="9" cy="9" r="1.3" fill="currentColor"/><circle cx="15" cy="15" r="1.3" fill="currentColor"/><circle cx="15" cy="9" r="1.3" fill="currentColor"/><circle cx="9" cy="15" r="1.3" fill="currentColor"/></svg><span class="tx">隨機登島</span></button>
  <button class="toybtn yellow" id="btnTime" title="切換時段"><span id="timeIco">🕒</span><span class="tx" id="timeTx">即時天色</span></button>
  <button class="toybtn icon" id="btnSound" title="背景聲音" style="font-size:20px">🔊</button>
  <button class="toybtn icon" id="btnHome" title="回到全景"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4Z"/></svg></button>
</nav>

<section class="drawer panel" id="drawer" aria-label="島嶼目錄">
  <h2>島嶼目錄 <button class="chip" id="closeList">收起 ✕</button></h2>
  <label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6b6480" stroke-width="2.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input id="q" placeholder="搜尋同學、遊戲名稱、學號…" autocomplete="off"></label>
  <div class="filters" id="clsFilters"></div>
  <div class="filters" id="filters"></div>
  <div class="list" id="list"></div>
</section>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="mwin panel">
    <div class="mbar">
      <img id="mThumb" alt="">
      <div><div class="t" id="mTitle"></div><div class="s" id="mSub"></div></div>
      <div class="mtabs" id="mTabs"></div>
      <div class="mact">
        <button class="toybtn" id="mFull" title="全螢幕"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span class="tx">全螢幕</span></button>
        <a class="toybtn" id="mNew" target="_blank" rel="noopener" title="新分頁開啟"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></svg><span class="tx">新分頁</span></a>
        <button class="toybtn red" id="mClose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg><span class="tx">回到島上</span></button>
      </div>
    </div>
    <div class="stage" id="stage">
      <iframe id="mFrame" title="遊戲畫面" allow="fullscreen; autoplay; gamepad; accelerometer; gyroscope"></iframe>
      <div class="ext" id="ext"></div>
    </div>
  </div>
</div>

<div class="toast panel" id="toast"></div>

<div class="loader" id="loader">
  <div class="in">
    <svg viewBox="0 0 48 48"><path d="M24 3 42 13.5v21L24 45 6 34.5v-21Z" fill="#7cc3a0"/><path d="M24 3 42 13.5 24 24 6 13.5Z" fill="#a7dcbd"/><path d="M24 24 42 13.5v21L24 45Z" fill="#559c7a"/><rect x="17" y="10" width="14" height="10" rx="2" fill="#ef6f53"/><path d="M15 11 24 4l9 7Z" fill="#c9533b"/></svg>
    <h2>文興遊戲群島</h2>
    <p id="loadTx">島嶼升空中…</p>
    <div class="pb"><div id="loadBar"></div></div>
    <div class="err" id="loadErr"></div>
  </div>
</div>

<script src="_island/data.js"></script>
<script type="importmap">

  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

}}
</script>
<script>
  // 若 3D 引擎載入失敗（例如沒有網路），顯示提示
  window.__bootTimer = setTimeout(function(){
    var e=document.getElementById('loadErr');
    if(!window.__booted && e){ e.style.display='block';
      e.textContent='3D 引擎還沒載入完成。請確認電腦有連上網路（需要從 CDN 下載 three.js），然後重新整理頁面。'; }
  }, 15000);
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { HorizontalTiltShiftShader } from 'three/addons/shaders/HorizontalTiltShiftShader.js';
import { VerticalTiltShiftShader } from 'three/addons/shaders/VerticalTiltShiftShader.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
window.__booted = true;

/* =========================================================
   資料
   ========================================================= */
const CLASSES = (window.CLASSES && window.CLASSES.length) ? window.CLASSES : [{ key: 'pao2', name: '跑二', course: '國二跑班資訊科技', color: '#3b3550' }];
const CLS = Object.fromEntries(CLASSES.map((c, i) => [c.key, { ...c, i }]));
const DATA = (window.ISLANDS || []).map(d => ({ ...d, cls: CLS[d.cls] ? d.cls : CLASSES[0].key }))
  .sort((a, b) => (CLS[a.cls].i - CLS[b.cls].i) || a.id.localeCompare(b.id));
const $ = s => document.querySelector(s);

function genreOf(isl){
  const t = isl.games.map(g => g.title + ' ' + g.sub).join(' ');
  if (!isl.games.length) return 'build';
  if (/節奏|Rhythm|Beat|音樂|PULSE|CYBERBEAT|ビート/i.test(t)) return 'stage';

  if (/車|Hypercar|Road/i.test(t)) return 'road';
  if (/跑酷|跳躍|Jump|逃離|追緝|Parkour|Run/i.test(t)) return 'track';

function hexShape(r){ const s = new THREE.Shape(); for (let i = 0; i < 6; i++){ const a = i*Math.PI/3; const x = Math.cos(a)*r, y = Math.sin(a)*r; i ? s.lineTo(x,y) : s.moveTo(x,y); } s.closePath(); return s; }
function hexSlab(r, depth, bevel){
  const g = new THREE.ExtrudeGeometry(hexShape(r - bevel), { depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 2, curveSegments: 1 });
  g.rotateX(-Math.PI/2); g.translate(0, bevel, 0); g.computeVertexNormals(); return g;
}

function rockGeo(seed){
  const g = new THREE.CylinderGeometry(0.92, 0.12, 1.25, 6, 4);
  const p = g.attributes.position; const rnd = mulberry(seed);
  for (let i = 0; i < p.count; i++){ const y = p.getY(i); if (y > 0.6) continue;
    const k = 1 + (rnd() - 0.5) * 0.35; p.setX(i, p.getX(i)*k); p.setZ(i, p.getZ(i)*k); p.setY(i, y + (rnd()-0.5)*0.12); }
  g.rotateY(Math.PI/6); g.translate(0, -0.62, 0); g.computeVertexNormals(); return g;
}
function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* 幫手：在群組中放一個方塊/圓柱… */
function put(group, geo, mat, x, y, z, sx, sy, sz, ry = 0, rx = 0, rz = 0){
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.scale.set(sx, sy ?? sx, sz ?? sx); m.rotation.set(rx, ry, rz);
  group.add(m); return m;
}
/* 把裝飾依材質合併，減少 draw call */
function bake(group){
  group.updateMatrixWorld(true);
  const buckets = new Map();
  group.traverse(o => {
    if (!o.isMesh) return;
    let g = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone();
    for (const k of Object.keys(g.attributes)) if (k !== 'position' && k !== 'normal') g.deleteAttribute(k);
    g.applyMatrix4(o.matrixWorld);
    if (!buckets.has(o.material)) buckets.set(o.material, []);
    buckets.get(o.material).push(g);
  });
  const out = new THREE.Group();
  for (const [mat, list] of buckets){
    const m = new THREE.Mesh(mergeGeometries(list), mat); m.castShadow = true; m.receiveShadow = true; out.add(m);
  }
  return out;
}

const SHAPES = ['hex', 'blob', 'round', 'pent', 'blob', 'oct', 'hept', 'blob', 'hex', 'round'];
function outline(kind, rnd){
  const n = { hex: 6, pent: 5, hept: 7, oct: 8, round: 30, blob: 9 }[kind];
  const off = rnd() * Math.PI * 2, pts = [];
  for (let i = 0; i < n; i++){
    const a = off + i / n * Math.PI * 2 + (kind === 'blob' ? (rnd() - 0.5) * 0.4 : 0);
    const r = kind === 'blob' ? 0.74 + rnd() * 0.28 : 1;
    pts.push(new THREE.Vector2(Math.cos(a) * r, Math.sin(a) * r));
  }

const waveH = (x, z, t) => Math.sin(x * 0.16 + t * 0.7) * 0.45 + Math.cos(-z * 0.2 + t * 0.55) * 0.4;
function updateSea(t, dt){
  updateSplashes(dt);
  // 鯨魚：大部分時間在水面游、偶爾噴水，每個週期躍出一次
  seaWhales.forEach(o => {
    o.a += o.dir * dt * 1.6 / o.R;
    const x = Math.cos(o.a) * o.R, z = Math.sin(o.a) * o.R, c = (t + o.t0) % o.cyc;
    const heading = -o.a + (o.dir > 0 ? 0 : Math.PI);
    let y = OCEAN_Y - 0.55 + waveH(x, z, t) * 0.6, pitch = 0, roll = 0;
    o.spout.visible = (c > 4 && c < 6.5) || (c > 12 && c < 13.5);
    if (o.spout.visible) o.spout.scale.setScalar(0.6 + Math.sin(t * 10) * 0.1 + Math.min(1, (c % 4)) * 0.6);
    const jS = o.cyc - 4, jD = 2.4;
    if (c > jS && c < jS + jD){ const k = (c - jS) / jD; y = OCEAN_Y - 1 + Math.sin(k * Math.PI) * 6.5; pitch = -Math.cos(k * Math.PI) * 0.9; roll = k * 1.2;
      if (!o.up){ o.up = true; splash(x, z, 2.2); } }
    else if (o.up){ o.up = false; splash(x, z, 3); }
    else if (c > jS - 1.5 && c <= jS) y = OCEAN_Y - 2.5;           // 先潛下去蓄力
    o.w.position.set(x, y, z); o.w.rotation.set(0, heading, 0); o.w.userData.body.rotation.set(pitch, 0, roll);
    o.w.userData.tail.rotation.x = Math.sin(t * 1.5) * 0.3;
  });
  // 海豚：一群三隻，輪流跳出水面
  dolphinPods.forEach(p => {
    p.a += p.dir * dt * 3.2 / p.R;
    p.members.forEach(m => {
      const a = p.a - p.dir * m.lag * 0.06, r = p.R + m.side;
      const x = Math.cos(a) * r, z = Math.sin(a) * r;
      const heading = -a + (p.dir > 0 ? 0 : Math.PI);
      const c = (t + m.phase) % m.period, jD = 1.3;
      let y = OCEAN_Y - 2.2, pitch = 0;
      if (c < jD){ const k = c / jD; y = OCEAN_Y - 0.4 + Math.sin(k * Math.PI) * 3.2; pitch = -Math.cos(k * Math.PI) * 1.0;
        if (!m.wasUp){ m.wasUp = true; splash(x, z, 0.9); } }
      else if (m.wasUp){ m.wasUp = false; splash(x, z, 1.1); }
      m.d.position.set(x, y, z); m.d.rotation.set(0, heading, 0); m.d.userData.body.rotation.x = pitch;
    });
  });
}
function updateOcean(t, dt){
  oceanU.uTime.value = t;

  boats.forEach(b => { const u = b.userData; u.a += u.w * dt;
    const x = Math.cos(u.a) * u.R, z = Math.sin(u.a) * u.R;
    const w = Math.sin(x * 0.16 + t * 0.7) * 0.45 + Math.cos(-z * 0.2 + t * 0.55) * 0.4;

}

const BZ = [new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()];
function landingPoint(node){
  if (node.pad != null) return hubPads[node.pad].clone();
  const o = islands[node.i], a = Math.random()*Math.PI*2, r = o.R * (0.35 + Math.random()*0.25);
  return new THREE.Vector3(o.group.position.x + Math.cos(a)*r, o.baseY + o.groundY + 0.25, o.group.position.z + Math.sin(a)*r);

function randomNode(except){
  if (Math.random() < 0.3) return { pad: (Math.random()*hubPads.length)|0 };
  let i; do { i = (Math.random()*islands.length)|0; } while (except && except.i === i);

}
function planTrip(v){
  const from = v.at ? v.pos.clone() : landingPoint(randomNode());
  v.dest = randomNode(v.node);
  const to = landingPoint(v.dest);
  const T = AIR_TYPES[v.type], dist = from.distanceTo(to);
  let h = T.h[0] + Math.random()*(T.h[1]-T.h[0]) + Math.min(6, dist * 0.06);
  const side = new THREE.Vector3(to.z - from.z, 0, from.x - to.x).normalize().multiplyScalar((Math.random()-0.5) * dist * 0.35);
  v.p = [from, from.clone().add(side), to.clone().add(side), to];
  // 航線經過遊樂園上空時拉高，避開雲霄飛車、自由落體塔與招牌
  const q = new THREE.Vector3(); let overHub = false;
  for (let k = 0; k <= 20 && !overHub; k++){ bez(v.p, k/20, q); if (Math.hypot(q.x, q.z) < HUB_R * HUB_RMAX + 4) overHub = true; }
  if (overHub) h = Math.max(h, HUB_Y + (HUB_TOP + 9.8) * HUB_SCALE - Math.min(from.y, to.y) + T.h[0] * 0.3);

    scene.add(obj);

const _tan = new THREE.Vector3(), _look = new THREE.Vector3();
function updateVehicles(dt, t){
  for (const v of vehicles){
    const T = AIR_TYPES[v.type], u = v.obj.userData;
    if (u.anim) u.anim(t + v.phase);
    if (v.at){                                             // 停靠中

  const d = islands[i].data, g = d.games[0];
  const c = coverOf(d, g);
  tip.innerHTML = `${c ? `<img src="${enc(c)}" alt="">` : ''}<div><div class="t">${g ? g.title : '遊戲施工中'}</div>
    <div class="s">${g && g.sub ? g.sub : GENRE_NAME[islands[i].genre]}</div>
    <div class="a">🧑‍🎨 ${d.name}・${d.id}${d.games.length > 1 ? `<br>🎮 共 ${d.games.length} 款遊戲` : ''}</div>
    <span class="go">${d.games.length ? (played.has(d.id) ? '再玩一次 ▶' : '點一下開玩 ▶') : '查看封面'}</span></div>`;
  tip.classList.add('show');
}

const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2;
function flyTo(pos, tgt, dur = 1000, done){
  flying = { p0: camera.position.clone(), t0: controls.target.clone(), p1: pos.clone(), t1: tgt.clone(), start: performance.now(), dur, done };
}
function visit(i){
  const o = islands[i]; const p = o.group.position;
  const tgt = new THREE.Vector3(p.x, p.y + 1.6, p.z);
  // 從目前方向靠近
  const dir = camera.position.clone().sub(controls.target).setY(0).normalize();
  if (!isFinite(dir.x)) dir.set(0, 0, 1);
  const pos = tgt.clone().add(dir.multiplyScalar(6.4)).add(new THREE.Vector3(0, 3.6, 0));
  controls.autoRotate = false;
  o.pulse = 1; Sound.pop();
  flyTo(pos, tgt, 900, () => openGame(i, 0));
}
$('#btnRandom').onclick = () => {
  const pool = islands.map((o, i) => i).filter(i => islands[i].data.games.length && !played.has(islands[i].data.id));
  const arr = pool.length ? pool : islands.map((o, i) => i).filter(i => islands[i].data.games.length);
  const i = arr[(Math.random() * arr.length) | 0]; toast(`🎲 傳送到 ${islands[i].data.name} 的島！`); visit(i);
};
$('#btnHome').onclick = () => { closeGame(); flyTo(HOME_POS, HOME_TGT, 1100); };
$('#btnTime').onclick = () => { modeIdx = (modeIdx + 1) % MODES.length; const m = MODES[modeIdx]; $('#timeIco').textContent = m.ico; $('#timeTx').textContent = m.tx; toast(m.k === 'auto' ? '🕒 天色跟著台北現在時間變化' : `${m.ico} 切換為${m.tx}`); };

/* ---------- 遊戲視窗 ---------- */
let current = null;
function openGame(i, gi){
  const o = islands[i], d = o.data; current = { i, gi };
  Sound.duck(true);
  modalOpen = true;
  $('#modal').classList.add('open');
  $('#mTabs').innerHTML = d.games.length > 1 ? d.games.map((g, k) => `<button data-k="${k}" class="${k===gi?'on':''}">${g.title}</button>`).join('') : '';
  const g = d.games[gi];
  const c = coverOf(d, g);
  $('#mThumb').src = c ? enc(c) : ''; $('#mThumb').style.display = c ? '' : 'none';
  $('#mTitle').textContent = g ? g.title : `${d.name} 的島`;
  $('#mSub').textContent = `${d.name}・${d.id}${g && g.sub ? '・' + g.sub : ''}`;
  const stage = $('#stage'), frame = $('#mFrame');
  if (!g || g.external){
    stage.classList.add('external'); frame.src = 'about:blank';
    $('#ext').innerHTML = `${c ? `<img src="${enc(c)}" alt="">` : ''}<div class="box">
      <span class="chip">${g ? '🌐 線上遊戲' : '🚧 施工中'}</span>
      <h3>${g ? g.title : '這座島的遊戲還在施工中'}</h3>
      <p>${g ? '這款遊戲放在 Gemini 分享頁面上，基於對方網站的安全設定，需要在新分頁開啟遊玩。' : `${d.name} 已經交了封面，遊戲程式還沒上島，先欣賞封面吧！`}</p>
      ${g ? `<a class="toybtn red" href="${g.href}" target="_blank" rel="noopener" id="extGo">▶ 開啟遊戲</a>` : ''}</div>`;
    $('#mNew').style.display = g ? '' : 'none'; if (g) $('#mNew').href = g.href;
    $('#mFull').style.display = 'none';
    const go = $('#extGo'); if (go) go.onclick = () => markPlayed(d.id);
  } else {
    stage.classList.remove('external');
    frame.src = enc(g.href);
    $('#mNew').style.display = ''; $('#mNew').href = enc(g.href);
    $('#mFull').style.display = '';
    frame.onload = () => { try { frame.focus(); } catch(e){} };
    markPlayed(d.id);
  }
}
function markPlayed(id){ if (!played.has(id)){ played.add(id); store.set('pao2.played', [...played]); refreshStats(); if (played.size === DATA.length) toast('🏆 你已經玩遍整座遊戲群島！'); } }
function closeGame(){ if (!modalOpen) return; modalOpen = false; Sound.duck(false); $('#modal').classList.remove('open'); setTimeout(() => { if (!modalOpen) $('#mFrame').src = 'about:blank'; }, 260); renderList(); }
$('#mTabs').onclick = e => { const b = e.target.closest('button'); if (b && current) openGame(current.i, +b.dataset.k); };
$('#mClose').onclick = closeGame;
$('#mFull').onclick = () => { const f = $('#stage'); (f.requestFullscreen || f.webkitRequestFullscreen || (()=>{})).call(f); setTimeout(() => { try { $('#mFrame').focus(); } catch(e){} }, 300); };
addEventListener('keydown', e => {
  if (e.key === 'Escape'){ if (modalOpen) closeGame(); else toggleDrawer(false); }
  if (modalOpen || document.activeElement === $('#q')) return;
  if (e.key === 'r' || e.key === 'R') $('#btnRandom').click();
  if (e.key === '/' ){ e.preventDefault(); toggleDrawer(true); $('#q').focus(); }
});

/* =========================================================
   背景聲音（Web Audio 即時合成，不需要音檔）
   風聲 ＋ 柔和和弦 ＋ 音樂盒旋律 ＋ 白天鳥叫 / 夜晚蟲鳴
   ========================================================= */
let nightLevel = 0;
const Sound = (() => {
  let ctx = null, master, music, sfx, started = false, ducked = false;
  let on = store.get('pao2.sound', true);
  const SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21];          // 大調五聲音階
  const CHORDS = [[0, 4, 7, 11], [-3, 0, 4, 7], [-7, -3, 0, 4], [-5, -1, 2, 7]]; // C△7 Am7 F△ G
  const BASE = 261.63;
  const hz = st => BASE * Math.pow(2, st / 12);
  let chordIdx = 0, nextNote = 0, nextChord = 0, nextCritter = 0, padVoices = [];

  function build(){
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
    // 回音
    const delay = ctx.createDelay(1); delay.delayTime.value = 0.42;
    const fb = ctx.createGain(); fb.gain.value = 0.32; const dl = ctx.createBiquadFilter(); dl.type = 'lowpass'; dl.frequency.value = 2400;
    delay.connect(dl); dl.connect(fb); fb.connect(delay); dl.connect(master);
    music = ctx.createGain(); music.gain.value = 0.9; music.connect(master); music.connect(delay);
    sfx = ctx.createGain(); sfx.gain.value = 0.7; sfx.connect(master);
    // 風：粉紅雜訊 → 低通（慢慢起伏）
    const len = ctx.sampleRate * 4, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    let b0 = 0, b1 = 0, b2 = 0;
    for (let i = 0; i < len; i++){ const w = Math.random()*2 - 1; b0 = 0.997*b0 + w*0.03; b1 = 0.985*b1 + w*0.03; b2 = 0.95*b2 + w*0.05; d[i] = (b0 + b1 + b2) * 0.9; }
    const noise = ctx.createBufferSource(); noise.buffer = buf; noise.loop = true;
    const wf = ctx.createBiquadFilter(); wf.type = 'lowpass'; wf.frequency.value = 500; wf.Q.value = 0.7;
    const wg = ctx.createGain(); wg.gain.value = 0.12;
    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.07; const lg = ctx.createGain(); lg.gain.value = 260; lfo.connect(lg); lg.connect(wf.frequency);
    const lfo2 = ctx.createOscillator(); lfo2.frequency.value = 0.11; const lg2 = ctx.createGain(); lg2.gain.value = 0.05; lfo2.connect(lg2); lg2.connect(wg.gain);
    noise.connect(wf); wf.connect(wg); wg.connect(master); noise.start(); lfo.start(); lfo2.start();
    // 和弦墊音
    const padBus = ctx.createBiquadFilter(); padBus.type = 'lowpass'; padBus.frequency.value = 900;
    const padG = ctx.createGain(); padG.gain.value = 0.035; padBus.connect(padG); padG.connect(music);
    for (let v = 0; v < 4; v++){
      const o1 = ctx.createOscillator(), o2 = ctx.createOscillator(); o1.type = 'triangle'; o2.type = 'sine'; o2.detune.value = 7;
      const g = ctx.createGain(); g.gain.value = 0.5; o1.connect(g); o2.connect(g); g.connect(padBus); o1.start(); o2.start();
      padVoices.push([o1, o2]);
    }
    setChord(0, ctx.currentTime);
  }
  function setChord(i, t){
    CHORDS[i].forEach((st, v) => padVoices[v].forEach(o => o.frequency.setTargetAtTime(hz(st - 12), t, 0.8)));
  }
  function note(freq, t, vol = 0.12, dur = 1.6, type = 'sine'){
    const o = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = freq; o2.type = 'sine'; o2.frequency.value = freq * 3.01;   // 音樂盒的金屬泛音
    const g2 = ctx.createGain(); g2.gain.value = 0.18;
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(music);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.start(t); o2.start(t); o.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
  }
  function chirp(t){                       // 鳥叫
    const n = 2 + (Math.random()*4|0), f0 = 2600 + Math.random()*1800;
    for (let k = 0; k < n; k++){ const o = ctx.createOscillator(), g = ctx.createGain(); const s = t + k * (0.09 + Math.random()*0.05);
      o.frequency.setValueAtTime(f0, s); o.frequency.exponentialRampToValueAtTime(f0 * (1.25 + Math.random()*0.4), s + 0.06);
      g.gain.setValueAtTime(0, s); g.gain.linearRampToValueAtTime(0.025, s + 0.01); g.gain.exponentialRampToValueAtTime(0.0005, s + 0.08);
      o.connect(g); g.connect(sfx); o.start(s); o.stop(s + 0.1); }
  }
  function cricket(t){                     // 蟲鳴
    const f = 4300 + Math.random()*500;
    for (let k = 0; k < 6; k++){ const o = ctx.createOscillator(), g = ctx.createGain(); const s = t + k * 0.045;
      o.frequency.value = f; g.gain.setValueAtTime(0, s); g.gain.linearRampToValueAtTime(0.012, s + 0.005); g.gain.exponentialRampToValueAtTime(0.0003, s + 0.035);
      o.connect(g); g.connect(sfx); o.start(s); o.stop(s + 0.04); }
  }
  function update(){                       // 每幀呼叫：排程旋律與環境音
    if (!ctx || !started || ctx.state !== 'running') return;
    const t = ctx.currentTime;
    if (t > nextChord){ chordIdx = (chordIdx + 1) % CHORDS.length; setChord(chordIdx, t); nextChord = t + 6.4; }
    if (t > nextNote){
      const chord = CHORDS[chordIdx];
      const st = Math.random() < 0.55 ? chord[(Math.random()*chord.length)|0] + 12 : SCALE[(Math.random()*SCALE.length)|0];
      const vol = (0.06 + Math.random()*0.05) * (1 - nightLevel * 0.35);
      note(hz(st), t + 0.02, vol, 1.8);
      if (Math.random() < 0.18) note(hz(st + 7), t + 0.24, vol * 0.6, 1.4);
      nextNote = t + [0.4, 0.8, 0.8, 1.2, 1.6, 2.4][(Math.random()*6)|0] * (1 + nightLevel * 0.5);
    }
    if (t > nextCritter){
      if (nightLevel > 0.5) { cricket(t); nextCritter = t + 0.6 + Math.random()*1.2; }
      else { if (Math.random() < 0.7) chirp(t); nextCritter = t + 2.5 + Math.random()*5; }
    }
  }
  function level(){ return on && !ducked ? 0.55 : 0; }
  function apply(){ if (!ctx) return; master.gain.cancelScheduledValues(ctx.currentTime); master.gain.setTargetAtTime(level(), ctx.currentTime, 0.4); renderBtn(); }
  function start(){                        // 需要使用者手勢才能開始
    if (!on) return;
    if (!ctx) build();
    if (ctx.state !== 'running') ctx.resume();
    if (!started){ started = true; nextNote = ctx.currentTime + 0.5; nextChord = ctx.currentTime + 6.4; }
    apply();
  }
  function toggle(){ on = !on; store.set('pao2.sound', on); if (on) start(); else apply(); renderBtn(); toast(on ? '🔊 背景聲音已開啟' : '🔇 背景聲音已關閉'); }
  function duck(v){ ducked = v; apply(); }
  function pop(){                          // 點擊島嶼的小音效
    if (!ctx || !on) return; const t = ctx.currentTime;
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'sine';
    o.frequency.setValueAtTime(520, t); o.frequency.exponentialRampToValueAtTime(1040, t + 0.12);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
    o.connect(g); g.connect(sfx); o.start(t); o.stop(t + 0.32);
    [0, 4, 7, 12].forEach((st, k) => note(hz(st + 12), t + 0.12 + k * 0.07, 0.07, 0.9));
  }
  function renderBtn(){ const b = $('#btnSound'); if (!b) return; b.innerHTML = on ? '🔊' : '🔇'; b.title = on ? '關閉背景聲音' : '開啟背景聲音'; b.classList.toggle('muted', !on); }
  return { start, toggle, duck, pop, update, renderBtn, get on(){ return on; } };
})();
Sound.renderBtn();
$('#btnSound').onclick = e => { e.stopPropagation(); Sound.toggle(); };
['pointerdown', 'keydown', 'touchstart'].forEach(ev => addEventListener(ev, () => Sound.start(), { passive: true }));

/* =========================================================
   主迴圈
   ========================================================= */
const clock = new THREE.Clock();
const v3 = new THREE.Vector3();
let lastSky = -1, lastClock = '';
function frame(){
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime, now = performance.now();

  // 鏡頭飛行
  if (flying){
    const p = Math.min(1, (now - flying.start) / flying.dur), k = ease(p);
    camera.position.lerpVectors(flying.p0, flying.p1, k);
    controls.target.lerpVectors(flying.t0, flying.t1, k);
    if (p >= 1){ const d = flying.done; flying = null; d && d(); }
  }
  if (!modalOpen && !flying && now - lastInteract > 18000) controls.autoRotate = true;
  controls.update();
  Sound.update();

  // 懸停
  if (!flying && !modalOpen){
    const h = mouse.x > -2 ? pick() : -1;
    if (h !== hovered){ hovered = h; document.body.classList.toggle('hovering', h >= 0); showTip(h); }
    if (h >= 0){ const tip = $('#tip'); tip.style.left = mouseScreen.x + 'px'; tip.style.top = mouseScreen.y + 'px'; }
  } else if (hovered >= 0){ hovered = -1; showTip(-1); document.body.classList.remove('hovering'); }

  // 島嶼浮動
  const W = innerWidth, H = innerHeight;
  islands.forEach((o, i) => {
    o.hover += ((i === hovered ? 1 : 0) - o.hover) * Math.min(1, dt * 10);
    if (o.pulse){ o.pulse = Math.max(0, o.pulse - dt * 0.8); }
    const y = o.baseY + Math.sin(t * 0.8 + o.phase) * 0.08 + o.hover * 0.28 + Math.sin((o.pulse||0) * Math.PI) * 0.35;
    o.group.position.y = y;
    const s = 1 + o.hover * 0.04; o.group.scale.setScalar(s);
    // 看板面向鏡頭（只轉水平）
    o.board.rotation.y = Math.atan2(camera.position.x - o.group.position.x, camera.position.z - o.group.position.z);
    o.board.rotation.z = Math.sin(t * 1.3 + o.phase) * 0.015;
    // 標籤
    v3.set(o.group.position.x, y + o.topY * s, o.group.position.z).project(camera);
    const dist = camera.position.distanceTo(o.group.position);
    const vis = v3.z < 1 && v3.x > -1.1 && v3.x < 1.1 && v3.y > -1.1 && v3.y < 1.2;
    const op = vis ? THREE.MathUtils.clamp((LABEL_FADE - dist) / 10, 0, 1) : 0;
    const sx = (v3.x * 0.5 + 0.5) * W, sy = (-v3.y * 0.5 + 0.5) * H;
    if (op > 0.01 || o._op > 0.01){
      o.lbl.style.transform = `translate(${sx}px,${sy}px) translate(-50%,-100%) scale(${0.85 + op*0.15})`;
      o.lbl.style.opacity = i === hovered ? 1 : op;
      o.lbl.classList.toggle('hot', i === hovered);
    }
    o._op = op;
  });

  // 鐘塔指針、雲、熱氣球、鳥
  const hr = taipeiHour();
  hubSign.userData.hands.h.rotation.z = -(hr % 12) / 12 * Math.PI * 2;
  hubSign.userData.hands.m.rotation.z = -(hr % 1) * Math.PI * 2;
  hubSign.position.y = HUB_Y; if (ferris){ ferris.userData.wheel.rotation.z = t * 0.12; ferris.userData.cabins.forEach(c => c.rotation.z = -t * 0.12); }
  parkAnims.forEach(f => f(t, dt));
  if (signMesh) signMesh.rotation.y = Math.atan2(camera.position.x, camera.position.z);
  classBanners.forEach(b => { b.g.rotation.y = Math.atan2(camera.position.x - b.g.position.x, camera.position.z - b.g.position.z); b.g.position.y = b.y + Math.sin(t * 0.7 + b.ph) * 0.4; });
  updateVehicles(dt, t);
  updateOcean(t, dt);
  clouds.forEach(c => { c.position.x += c.userData.speed * dt; if (c.position.x > WORLD_R * 1.4) c.position.x = -WORLD_R * 1.4; });
  balloon.position.set(Math.cos(t * 0.05) * WORLD_R * 0.8, 6 + Math.sin(t * 0.4) * 0.4, Math.sin(t * 0.05) * WORLD_R * 0.7);
  birds.forEach((b, k) => { const a = t * 0.18 + b.userData.off; b.position.set(Math.cos(a) * (WORLD_R * 0.55 + k), 5.5 + Math.sin(t + k) * 0.5, Math.sin(a) * (WORLD_R * 0.5 + k));
    b.rotation.y = -a; const f = Math.sin(t * 9 + k) * 0.5; b.userData.wl.rotation.z = f; b.userData.wr.rotation.z = -f; });

  // 即時天色（每秒更新一次；手動模式平滑過渡）
  const target = MODES[modeIdx].k === 'auto' ? hr : MODES[modeIdx].k;
  if (shownHour === null) shownHour = target;
  let diff = target - shownHour; if (diff > 12) diff -= 24; if (diff < -12) diff += 24;
  shownHour = (shownHour + diff * Math.min(1, dt * 2.5) + 24) % 24;
  if (Math.abs(shownHour - lastSky) > 0.003){ applySky(shownHour); lastSky = shownHour; }
  const d = new Date(Date.now() + 8*3600e3); const cs = d.toISOString().slice(11, 19);
  if (cs !== lastClock){ $('#clock').textContent = cs.slice(0, 5); $('#clock').title = '台北時間 ' + cs; lastClock = cs; }

  // 陰影相機跟著鏡頭焦點
  sun.target.position.copy(controls.target); sun.position.add(controls.target);
  composer.render();
  sun.position.sub(controls.target);
}

/* =========================================================
   啟動
   ========================================================= */
function onResize(){
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); setTilt();
}
addEventListener('resize', onResize);
$('#brandSub').textContent = CLASSES.map(c => c.course.replace('跑班資訊科技', '')).join('・') + '跑班資訊科技・個人遊戲作品展';
countUp($('#sIsland'), DATA.length); countUp($('#sGame'), gameCount);
refreshStats(); buildClsFilters(); buildFilters(); renderList(); feedRotate();
applySky(taipeiHour());
frame();
setTimeout(() => {
  clearTimeout(window.__bootTimer);
  $('#loader').classList.add('done');
  flyTo(HOME_POS, HOME_TGT, 2600);
  setTimeout(() => { $('#hint').style.opacity = 0; }, 14000);
}, 600);
// 從網址 #114049 直接打開某座島
if (location.hash.length > 1){ const id = decodeURIComponent(location.hash.slice(1)); const i = islands.findIndex(o => o.data.id === id || o.data.name === id); if (i >= 0) setTimeout(() => visit(i), 3400); }
</script>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金庸武俠知識王 - 終極全集版</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 'serif': ['"Noto Serif TC"', 'serif'] },
                    colors: { parchment: '#f4e4bc', ink: '#1a1a1a', crimson: '#8b0000', gold: '#b8860b' }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Noto Serif TC', serif;
            background-color: #1a1a1a;
            background-image: url('data:image/svg+xml,%3Csvg width="100" height="100" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noise"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100" height="100" filter="url(%23noise)" opacity="0.05"/%3E%3C/svg%3E');
            color: #f4e4bc;
            overflow-x: hidden;
        }
        
        .parchment-bg {
            background-color: #f4e4bc;
            background-image: url('data:image/svg+xml,%3Csvg width="200" height="200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noise"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.01" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="200" height="200" filter="url(%23noise)" opacity="0.1"/%3E%3C/svg%3E');
            box-shadow: inset 0 0 50px rgba(139, 69, 19, 0.3), 0 10px 30px rgba(0, 0, 0, 0.8);
            color: #1a1a1a;
        }

        .btn-style {
            transition: all 0.2s ease-in-out;
            position: relative;
            overflow: hidden;
        }
        .btn-style::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: all 0.4s ease-in-out;
        }
        .btn-style:hover::before { left: 100%; }

        .location-card {
            border: 2px solid #8b0000;
            background: rgba(244, 228, 188, 0.9);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .location-card:hover {
            transform: scale(1.03);
            background: #8b0000;
            color: #f4e4bc;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .location-card:hover .text-gray-800 { color: #ffcccb; }

        .boss-card {
            background: rgba(255,255,255,0.5);
            border: 2px solid #b8860b;
            transition: transform 0.2s;
        }
        .boss-card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px rgba(0,0,0,0.2); }

        .option-btn { background-color: transparent; border: 2px solid #8b0000; color: #1a1a1a; }
        .option-btn:hover:not(:disabled) { background-color: #8b0000; color: #f4e4bc; transform: translateY(-2px); }
        .option-correct { background-color: #22c55e !important; border-color: #16a34a !important; color: white !important; }
        .option-wrong { background-color: #ef4444 !important; border-color: #dc2626 !important; color: white !important; }

        .hidden-screen { display: none !important; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px) rotate(-2deg); }
            40%, 80% { transform: translateX(10px) rotate(2deg); }
        }
        .shake-animation { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        
        .damage-flash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(239, 68, 68, 0.5);
            pointer-events: none; opacity: 0; z-index: 9999;
            transition: opacity 0.2s;
        }

        .heart { display: inline-block; width: 20px; height: 20px; background-size: contain; background-repeat: no-repeat; margin-right: 2px;}
        .heart-full { background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23ef4444"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>'); }
        .heart-empty { background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%239ca3af" stroke-width="2"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>'); }

        .avatar-img { object-fit: cover; border: 3px solid; background-color: #f4e4bc; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .boss-img-style { border-color: #8b0000; }
        .player-img-style { border-color: #b8860b; }
        
        .badge-img { width: 100px; height: 100px; object-fit: contain; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.4)); margin: 0 auto; }
        .badge-earned { animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popIn { 0% { transform: scale(0) rotate(-180deg); opacity: 0; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f4e4bc; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #8b0000; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-2 md:p-6 relative">
    <div id="damage-overlay" class="damage-flash"></div>

    <div id="main-container" class="parchment-bg w-full max-w-[1000px] rounded-lg p-6 md:p-10 relative overflow-hidden flex flex-col max-h-[95vh]">
        <!-- 邊角裝飾 -->
        <div class="absolute top-3 left-3 text-crimson text-3xl opacity-50 pointer-events-none">⌜</div>
        <div class="absolute top-3 right-3 text-crimson text-3xl opacity-50 pointer-events-none">⌝</div>
        <div class="absolute bottom-3 left-3 text-crimson text-3xl opacity-50 pointer-events-none">⌞</div>
        <div class="absolute bottom-3 right-3 text-crimson text-3xl opacity-50 pointer-events-none">⌟</div>

        <!-- ================= 0. 首頁模式選擇 ================= -->
        <div id="screen-home" class="flex flex-col items-center justify-center w-full flex-grow my-auto">
            <p class="text-sm text-crimson tracking-widest mb-2 border-b border-crimson inline-block pb-1 font-bold">武林大會</p>
            <h1 class="text-4xl md:text-6xl font-black text-ink mb-6 tracking-wider drop-shadow-md text-center leading-tight">金庸武俠知識王<br><span class="text-3xl md:text-4xl text-crimson">十五部全集海量題庫</span></h1>
            <p class="text-gray-700 font-bold mb-10 text-lg">請選擇你的江湖歷練方式</p>
            
            <div class="flex flex-col md:flex-row gap-6 w-full max-w-md">
                <button onclick="selectMode('single')" class="btn-style flex-1 bg-crimson text-parchment py-4 px-6 rounded-xl font-bold text-2xl shadow-lg border-2 border-red-950 flex flex-col items-center hover:scale-105 transform transition">
                    <span>單人闖關</span>
                    <span class="text-sm font-normal mt-1 opacity-80">經典問答，考驗己身</span>
                </button>
                <button onclick="selectMode('ai')" class="btn-style flex-1 bg-ink text-parchment py-4 px-6 rounded-xl font-bold text-2xl shadow-lg border-2 border-gray-900 flex flex-col items-center hover:scale-105 transform transition">
                    <span>AI 對戰</span>
                    <span class="text-sm font-normal mt-1 opacity-80">與 Boss 鬥智拼速</span>
                </button>
            </div>
        </div>

        <!-- ================= 1. 場景選擇畫面 ================= -->
        <div id="screen-location" class="hidden-screen flex flex-col w-full h-full">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-3xl font-black text-ink drop-shadow-md">江湖地圖</h2>
                <button onclick="changeScreen('home')" class="text-crimson font-bold hover:underline">返回首頁</button>
            </div>
            <p class="text-sm text-gray-700 mb-4 font-bold border-l-4 border-crimson pl-2">請選擇你要挑戰的武林聖地（飛雪連天射白鹿，笑書神俠倚碧鴛）</p>
            
            <div id="locations-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 w-full overflow-y-auto pr-2 pb-4" style="max-height: 60vh;">
                <!-- 由 JS 動態生成 -->
            </div>
        </div>

        <!-- ================= 2. Boss 選擇畫面 ================= -->
        <div id="screen-boss" class="hidden-screen flex flex-col items-center w-full">
            <div class="w-full flex justify-between items-center mb-6">
                <h2 id="selected-location-title" class="text-3xl md:text-4xl font-black text-ink drop-shadow-md">場景名稱</h2>
                <button onclick="changeScreen('location')" class="text-crimson font-bold border border-crimson px-4 py-1 rounded hover:bg-crimson hover:text-parchment transition">返回地圖</button>
            </div>
            
            <p class="text-gray-700 mb-6 font-bold">此處危機四伏，請選擇你要挑戰的強敵：</p>
            
            <div id="bosses-container" class="grid grid-cols-1 md:grid-cols-3 gap-6 w-full max-w-4xl">
                <!-- 由 JS 動態生成 -->
            </div>
        </div>

        <!-- ================= 3. 戰鬥(答題)畫面 ================= -->
        <div id="screen-battle" class="hidden-screen flex flex-col w-full h-full flex-grow">
            <div class="flex justify-between items-center mb-6 bg-white/40 p-3 md:p-4 rounded-lg border-2 border-gray-400 shadow-inner">
                <!-- 玩家狀態 -->
                <div class="flex items-center gap-3 w-1/3">
                    <img src="https://placehold.co/150x150/b8860b/FFF?text=大俠" alt="Player" class="w-12 h-12 md:w-16 md:h-16 rounded-full avatar-img player-img-style">
                    <div class="flex flex-col">
                        <span class="text-md md:text-lg font-black text-ink">大俠 (你)</span>
                        <div id="player-hp-bar" class="flex mt-1 flex-wrap"></div>
                    </div>
                </div>
                
                <!-- 戰鬥提示 / VS -->
                <div class="flex flex-col items-center w-1/3">
                    <span class="text-2xl md:text-3xl font-black text-crimson italic drop-shadow-md mb-2">VS</span>
                    <div class="w-full h-2 md:h-3 bg-gray-300 rounded-full overflow-hidden border border-gray-400">
                        <div id="timer-bar" class="h-full bg-crimson transition-all duration-100 ease-linear w-full"></div>
                    </div>
                </div>
                
                <!-- Boss 狀態 -->
                <div class="flex items-center justify-end gap-3 w-1/3 text-right">
                    <div class="flex flex-col items-end">
                        <span id="battle-boss-name" class="text-md md:text-lg font-black text-ink">Boss名稱</span>
                        <div id="boss-hp-bar" class="flex mt-1 justify-end flex-wrap"></div>
                    </div>
                    <img id="battle-boss-img" src="" alt="Boss" class="w-12 h-12 md:w-16 md:h-16 rounded-full avatar-img boss-img-style">
                </div>
            </div>

            <div id="question-box" class="flex-grow flex flex-col items-center justify-center relative bg-white/50 p-4 md:p-6 rounded-lg border border-gray-300 shadow-md my-auto">
                <div id="round-announcement" class="text-center font-bold text-lg md:text-xl mb-4 min-h-[2rem]"></div>
                <h3 id="question-text" class="text-xl md:text-2xl font-bold text-center mb-6 leading-snug text-ink">
                    題目載入中...
                </h3>
                <div id="options-container" class="grid grid-cols-1 md:grid-cols-2 gap-3 md:gap-4 w-full">
                    <button class="option-btn btn-style w-full py-3 md:py-4 px-4 rounded-lg font-bold text-md md:text-lg text-left shadow" onclick="handleAnswer(0)"></button>
                    <button class="option-btn btn-style w-full py-3 md:py-4 px-4 rounded-lg font-bold text-md md:text-lg text-left shadow" onclick="handleAnswer(1)"></button>
                    <button class="option-btn btn-style w-full py-3 md:py-4 px-4 rounded-lg font-bold text-md md:text-lg text-left shadow" onclick="handleAnswer(2)"></button>
                    <button class="option-btn btn-style w-full py-3 md:py-4 px-4 rounded-lg font-bold text-md md:text-lg text-left shadow" onclick="handleAnswer(3)"></button>
                </div>
            </div>
        </div>

        <!-- ================= 4. 結算畫面 ================= -->
        <div id="screen-result" class="hidden-screen flex flex-col items-center justify-center w-full flex-grow my-auto">
            <h2 id="result-title" class="text-4xl md:text-5xl font-black text-ink mb-2 drop-shadow-md text-center">挑戰結果</h2>
            <p id="result-desc" class="text-lg md:text-xl text-gray-700 mb-8 font-bold text-center">描述</p>
            
            <div id="reward-section" class="flex flex-col items-center bg-white/50 p-6 md:p-8 rounded-xl border-2 border-gold mb-8 hidden">
                <p class="text-lg font-bold text-ink mb-4">獲得榮譽徽章</p>
                <img id="result-badge-img" src="" class="badge-img badge-earned mb-4">
                <p id="result-badge-name" class="text-2xl font-black text-gold drop-shadow-sm text-center">徽章名稱</p>
            </div>

            <div class="flex gap-4">
                <button onclick="changeScreen('location')" class="btn-style bg-crimson text-parchment py-3 px-8 rounded-full font-bold text-xl shadow-lg border-2 border-red-950">
                    重返江湖
                </button>
            </div>
        </div>
    </div>

    <script>
        /**
         * ==========================================

                    { q: '少林寺藏經閣掃地僧化解並點化了哪兩位血海深仇宿敵？', options: ['喬峰與慕容復', '蕭遠山與慕容博', '鳩摩智與段延慶', '玄慈與葉二娘'], answer: 1 },
                    { q: '金庸先生武俠小說創作的封筆之作是？', options: ['《鹿鼎記》', '《笑傲江湖》', '《越女劍》', '《天龍八部》'], answer: 0 },
                    { q: '「飛雪連天射白鹿，笑書神俠倚碧鴛」十四字對聯未包含的短篇小說是？', options: ['《越女劍》', '《鴛鴦刀》', '《白馬嘯西風》', '《連城訣》'], answer: 0 },
                    { q: '金庸小說中「天下第一劍客」獨孤求敗一生敗過幾次？', options: ['零次(求一敗而不可得)', '一次', '兩次', '三次'], answer: 0 },
                    { q: '《九陰真經》據傳是由宋朝哪位歷史人物閱讀三千大藏經後創出的？', options: ['黃裳', '斗酒僧', '王重陽', '張三丰'], answer: 0 },
                    { q: '《九陽真經》創始人在少林寺藏經閣將經書寫在什麼書的縫隙中？', options: ['《楞伽經》', '《金剛經》', '《華嚴經》', '《法華經》'], answer: 0 },
                    { q: '「東邪、西毒、南帝、北丐、中神通」中，「南帝」段智興出家後的法號是？', options: ['一燈大師', '枯木大師', '本因', '渡劫'], answer: 0 }
                ]
            }
        };

        let gameMode = 'single'; 
        let currentLocationKey = '';
        let currentBoss = null;
        
        let activeQuestionQueue = [];
        let currentQObj = null; 
        let playerHp = 0;
        let playerMaxHp = 0;
        let bossHp = 0;
        let bossMaxHp = 0;
        let timeRemaining = 10000;
        let timerInterval;
        let canAnswer = false;

        const usedQuestionIndexesMap = {};

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type, duration, vol=0.1) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }
        const sfx = {
            click: () => playTone(600, 'sine', 0.1),
            correct: () => { playTone(523.25, 'sine', 0.1); setTimeout(() => playTone(659.25, 'sine', 0.2), 100); },
            wrong: () => { playTone(150, 'sawtooth', 0.3, 0.2); setTimeout(() => playTone(100, 'sawtooth', 0.4, 0.2), 150); }
        };

        const screens = {
            home: document.getElementById('screen-home'),
            location: document.getElementById('screen-location'),
            boss: document.getElementById('screen-boss'),
            battle: document.getElementById('screen-battle'),
            result: document.getElementById('screen-result')
        };

        function selectMode(mode) {
            sfx.click();
            gameMode = mode;
            initLocations();
            changeScreen('location');
        }

        function initLocations() {
            const grid = document.getElementById('locations-grid');
            grid.innerHTML = '';
            for (const key in gameData) {
                const loc = gameData[key];
                
                let isUltimate = key === 'ultimate';
                let bgClass = isUltimate ? 'bg-gray-900 border-gold' : 'bg-white/70 border-crimson';
                let titleColor = isUltimate ? 'text-gold' : 'text-ink';
                let tagColor = isUltimate ? 'bg-gold text-ink' : 'bg-crimson text-parchment';

                const card = document.createElement('div');
                card.className = `location-card p-4 md:p-6 rounded-lg text-center flex flex-col ${isUltimate ? 'border-4 shadow-lg' : ''}`;
                card.onclick = () => { sfx.click(); selectLocation(key); };
                card.innerHTML = `
                    <h3 class="text-xl md:text-2xl font-black mb-1 ${titleColor}">${loc.name}</h3>
                    <p class="text-xs md:text-sm font-bold text-gray-800 mb-2">${loc.novel}</p>
                    <span class="mt-auto text-xs font-bold px-2 py-1 rounded-full w-max mx-auto ${tagColor}">${loc.type}</span>
                `;
                grid.appendChild(card);
            }
        }

        function changeScreen(screenName) {
            Object.values(screens).forEach(s => s.classList.add('hidden-screen'));
            screens[screenName].classList.remove('hidden-screen');
        }

        function selectLocation(key) {
            currentLocationKey = key;
            const loc = gameData[key];
            document.getElementById('selected-location-title').innerText = `${loc.name} (${loc.novel})`;
            
            const bossGrid = document.getElementById('bosses-container');
            bossGrid.innerHTML = '';
            
            let gridColClass = loc.bosses.length === 1 ? 'md:grid-cols-1 max-w-sm mx-auto' : 'md:grid-cols-3';
            bossGrid.className = `grid grid-cols-1 ${gridColClass} gap-6 w-full max-w-4xl`;

            loc.bosses.forEach(boss => {
                let diffColor = boss.diff === '簡單' ? 'text-green-700' : boss.diff === '普通' ? 'text-yellow-700' : boss.diff === '地獄' ? 'text-purple-700 font-black' : 'text-red-700';
                let borderClass = boss.diff === '地獄' ? 'border-purple-800' : 'border-crimson';

                const card = document.createElement('div');
                card.className = 'boss-card p-4 md:p-6 rounded-lg flex flex-col items-center relative overflow-hidden bg-white/80';
                card.innerHTML = `
                    <div class="absolute top-2 right-2 text-xs font-bold px-2 py-1 bg-white/90 rounded border shadow ${diffColor}">${boss.diff}</div>
                    <img src="${boss.img}" class="w-20 h-20 md:w-24 md:h-24 rounded-full object-cover border-4 ${borderClass} mb-3 shadow-md">
                    <h3 class="text-xl md:text-2xl font-black text-ink mb-1">${boss.name}</h3>
                    <p class="text-xs font-bold text-gray-700 mb-2">通關榮譽：</p>
                    <img src="${boss.badgeImg}" class="w-12 h-12 md:w-16 md:h-16 object-contain filter drop-shadow-md mb-4">
                    <button onclick="startBattle('${boss.id}')" class="btn-style w-full py-2 bg-crimson text-parchment font-bold rounded-lg mt-auto text-sm md:text-base">
                        拔劍挑戰
                    </button>
                `;
                bossGrid.appendChild(card);
            });
            
            changeScreen('boss');
        }

        function startBattle(bossId) {
            sfx.click();
            const loc = gameData[currentLocationKey];
            currentBoss = loc.bosses.find(b => b.id === bossId);
            
            playerMaxHp = currentBoss.playerHp;
            playerHp = playerMaxHp;
            bossMaxHp = currentBoss.bossHp;
            bossHp = bossMaxHp;
            
            prepareQuestionQueue(currentLocationKey);

            document.getElementById('battle-boss-name').innerText = currentBoss.name;
            document.getElementById('battle-boss-img').src = currentBoss.img;
            
            updateHpUI();
            changeScreen('battle');
            loadQuestion();
        }

        function prepareQuestionQueue(locKey) {
            const allQ = gameData[locKey].questions;
            if (!usedQuestionIndexesMap[locKey]) {
                usedQuestionIndexesMap[locKey] = new Set();
            }

            let unusedIndexes = [];
            for (let i = 0; i < allQ.length; i++) {
                if (!usedQuestionIndexesMap[locKey].has(i)) {
                    unusedIndexes.push(i);
                }
            }

            if (unusedIndexes.length === 0) {
                usedQuestionIndexesMap[locKey].clear();
                for (let i = 0; i < allQ.length; i++) unusedIndexes.push(i);
            }

            unusedIndexes.sort(() => Math.random() - 0.5);

            activeQuestionQueue = unusedIndexes.map(idx => {
                return { originalIndex: idx, rawData: allQ[idx] };
            });
        }

        function updateHpUI() {
            const renderHearts = (hp, maxHp, containerId) => {
                const container = document.getElementById(containerId);
                container.innerHTML = '';
                for(let i=0; i<maxHp; i++) {
                    const heart = document.createElement('div');
                    heart.className = `heart ${i < hp ? 'heart-full' : 'heart-empty'}`;
                    container.appendChild(heart);
                }
            };
            renderHearts(playerHp, playerMaxHp, 'player-hp-bar');
            renderHearts(bossHp, bossMaxHp, 'boss-hp-bar');
        }

        function loadQuestion() {
            if (activeQuestionQueue.length === 0) {
                prepareQuestionQueue(currentLocationKey);
            }

            const item = activeQuestionQueue.shift();
            usedQuestionIndexesMap[currentLocationKey].add(item.originalIndex);
            
            const raw = item.rawData;

            const optionsWithCorrect = raw.options.map((opt, idx) => ({
                text: opt,
                isCorrect: idx === raw.answer
            }));
            optionsWithCorrect.sort(() => Math.random() - 0.5);

            const newAnswerIndex = optionsWithCorrect.findIndex(o => o.isCorrect);

            currentQObj = {
                q: raw.q,
                options: optionsWithCorrect.map(o => o.text),
                answer: newAnswerIndex
            };

            document.getElementById('question-text').innerText = currentQObj.q;
            
            const optionsContainer = document.getElementById('options-container');
            const btns = optionsContainer.querySelectorAll('button');
            
            btns.forEach((btn, index) => {
                btn.innerText = currentQObj.options[index];
                btn.className = 'option-btn btn-style w-full py-3 md:py-4 px-4 rounded-lg font-bold text-md md:text-lg text-left shadow relative';
                btn.disabled = false;
                
                const oldBadge = btn.querySelector('.boss-badge');
                if (oldBadge) oldBadge.remove();
            });

            document.getElementById('round-announcement').innerText = "";

            canAnswer = true;
            timeRemaining = 10000;
            updateTimerBar();
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeRemaining -= 50;
                updateTimerBar();
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    handleAnswer(-1); 
                }
            }, 50);
        }

        function updateTimerBar() {
            const bar = document.getElementById('timer-bar');
            const percentage = (timeRemaining / 10000) * 100;
            bar.style.width = percentage + '%';
            if (percentage < 30) { bar.classList.add('bg-red-600'); bar.classList.remove('bg-crimson'); }
            else { bar.classList.remove('bg-red-600'); bar.classList.add('bg-crimson'); }
        }

        function handleAnswer(selectedIndex) {
            if (!canAnswer) return;
            canAnswer = false;
            clearInterval(timerInterval);

            if(selectedIndex !== -1) sfx.click();

            const btns = document.querySelectorAll('.option-btn');
            
            btns[currentQObj.answer].classList.add('option-correct');
            btns.forEach(btn => btn.disabled = true);

            let isPlayerCorrect = selectedIndex === currentQObj.answer;
            let isBossCorrect = false;
            let bossChoiceIndex = -1;

            if (gameMode === 'ai') {
                const rand = Math.random();
                if (rand < currentBoss.aiAccuracy) {
                    bossChoiceIndex = currentQObj.answer;
                    isBossCorrect = true;
                } else {
                    let wrongOptions = [0, 1, 2, 3].filter(i => i !== currentQObj.answer);
                    bossChoiceIndex = wrongOptions[Math.floor(Math.random() * wrongOptions.length)];
                    isBossCorrect = false;
                }

                if (bossChoiceIndex !== -1) {
                    const bossBadge = document.createElement('span');
                    bossBadge.className = 'boss-badge ml-2 text-xs bg-ink text-white px-2 py-1 rounded-full absolute right-2 top-1/2 transform -translate-y-1/2 font-bold shadow-md';
                    bossBadge.innerText = `🗡️ ${currentBoss.name}`;
                    btns[bossChoiceIndex].appendChild(bossBadge);
                    btns[bossChoiceIndex].classList.add('border-4', 'border-ink');
                }
            }

            if (selectedIndex !== -1 && !isPlayerCorrect) {
                btns[selectedIndex].classList.add('option-wrong');
            }

            const announcement = document.getElementById('round-announcement');

            if (gameMode === 'single') {
                if (isPlayerCorrect) {
                    sfx.correct();
                    bossHp--;
                    screenShake(document.getElementById('battle-boss-img'));
                    announcement.innerText = "答對了！給予重擊！";
                    announcement.className = "text-center font-black text-xl md:text-2xl mb-4 min-h-[2rem] text-green-600 drop-shadow-sm";
                } else {
                    sfx.wrong();
                    playerHp--;
                    screenShake(document.getElementById('main-container'));
                    flashDamage();
                    announcement.innerText = selectedIndex === -1 ? "超時！遭到反擊！" : "答錯了！遭到反擊！";
                    announcement.className = "text-center font-black text-xl md:text-2xl mb-4 min-h-[2rem] text-red-600 drop-shadow-sm";
                }
            } else {
                if (isPlayerCorrect && !isBossCorrect) {
                    sfx.correct(); bossHp--; screenShake(document.getElementById('battle-boss-img'));
                    announcement.innerText = `💥 敵方答錯！重創 ${currentBoss.name}！`;
                    announcement.className = "text-center font-black text-lg md:text-2xl mb-4 min-h-[2rem] text-green-600 drop-shadow-sm";
                } else if (!isPlayerCorrect && isBossCorrect) {
                    sfx.wrong(); playerHp--; screenShake(document.getElementById('main-container')); flashDamage();
                    announcement.innerText = `🩸 你答錯了！${currentBoss.name} 乘虛而入！`;
                    announcement.className = "text-center font-black text-lg md:text-2xl mb-4 min-h-[2rem] text-red-600 drop-shadow-sm";
                } else if (isPlayerCorrect && isBossCorrect) {
                    sfx.click();
                    announcement.innerText = "⚔️ 雙方皆答對！內力激盪，不分軒輊！";
                    announcement.className = "text-center font-black text-lg md:text-2xl mb-4 min-h-[2rem] text-blue-700 drop-shadow-sm";
                } else {
                    sfx.wrong();
                    announcement.innerText = "💨 雙方皆答錯！互相錯失良機！";
                    announcement.className = "text-center font-black text-lg md:text-2xl mb-4 min-h-[2rem] text-gray-700 drop-shadow-sm";
                }
            }

            updateHpUI();

            setTimeout(() => {
                if (bossHp <= 0) endBattle(true);
                else if (playerHp <= 0) endBattle(false);
                else {
                    loadQuestion();
                }
            }, gameMode === 'ai' ? 2200 : 1400); 
        }

        function screenShake(element) {
            element.classList.remove('shake-animation');
            void element.offsetWidth; 
            element.classList.add('shake-animation');
        }

        function flashDamage() {
            const overlay = document.getElementById('damage-overlay');
            overlay.style.opacity = '1';
            setTimeout(() => overlay.style.opacity = '0', 200);
        }

        function endBattle(isWin) {
            changeScreen('result');
            const title = document.getElementById('result-title');
            const desc = document.getElementById('result-desc');
            const rewardSection = document.getElementById('reward-section');
            
            if (isWin) {
                sfx.correct();
                setTimeout(sfx.correct, 200);
                title.innerText = '挑戰成功！';
                title.style.color = '#22c55e';
                desc.innerHTML = `你在<span class="font-black">${gameMode === 'ai' ? 'AI對戰' : '單人闖關'}</span>中，成功擊退了 <span class="text-crimson font-black">${currentBoss.name}</span>`;
                
                document.getElementById('result-badge-img').src = currentBoss.badgeImg;
                
                let badgeUrl = new URL(currentBoss.badgeImg);
                let badgeText = badgeUrl.searchParams.get('text') || "專屬榮譽徽章";
                document.getElementById('result-badge-name').innerText = badgeText + " 徽章"; 
                
                rewardSection.classList.remove('hidden');
            } else {
                sfx.wrong();
                setTimeout(sfx.wrong, 300);
                title.innerText = '勝敗乃兵家常事';
                title.style.color = '#ef4444';
                desc.innerHTML = `你敗在了 <span class="text-crimson font-black">${currentBoss.name}</span> 手下，大俠請重新練功！`;
                rewardSection.classList.add('hidden');
            }
        }
    </script>
</body>
</html>

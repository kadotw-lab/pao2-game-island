<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>太空槍戰 Galaxy Defender</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #050510;
            color: #fff;
            font-family: 'Noto Sans TC', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        /* 遊戲主體容器：維持手機比例並置中 */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            height: 100%;
            max-height: 1000px;
            background: linear-gradient(to bottom, #020111 0%, #20124d 100%);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI 層設定 */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.75);
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        .hidden {
            display: none !important;
            opacity: 0;
            pointer-events: none;
        }

        h1 {
            font-size: 24px;
            text-align: center;
            line-height: 1.5;
            margin-bottom: 20px;
            color: #0ff;
            text-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
        }

        p {
            font-size: 12px;
            margin-bottom: 15px;
            color: #aaa;
            text-align: center;
            line-height: 1.8;
        }

        .highlight {
            color: #f0f;
            text-shadow: 0 0 5px #f0f;
        }

        button {
            padding: 15px 30px;
            font-size: 14px;
            font-family: inherit;
            color: #fff;
            background: transparent;
            border: 2px solid #0ff;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5) inset, 0 0 10px rgba(0, 255, 255, 0.5);
            transition: all 0.2s;
            margin-top: 20px;
        }

        button:hover, button:active {
            background: rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.8) inset, 0 0 20px rgba(0, 255, 255, 0.8);
        }

        /* 遊戲進行中的 HUD (Head-Up Display) */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 5;
            pointer-events: none;
        }

        .hud-text {
            font-size: 12px;
            text-shadow: 1px 1px 2px #000;
        }

        #score-display {
            color: #0ff;
        }

        #health-display {
            color: #f00;
            text-align: right;
        }

        #btn-pause {
            pointer-events: auto;
            margin-top: 0;
            padding: 8px 12px;
            font-size: 10px;
            border-color: #ff0;
            color: #ff0;
            box-shadow: 0 0 5px rgba(255, 255, 0, 0.5) inset, 0 0 5px rgba(255, 255, 0, 0.5);
        }
        #btn-pause:hover { background: rgba(255, 255, 0, 0.2); }
    </style>
</head>
<body>

<div id="game-container">
    <!-- 遊戲畫布 -->
    <canvas id="gameCanvas"></canvas>

    <!-- 遊戲抬頭顯示器 (HUD) -->
    <div id="hud" class="hidden">
        <div class="hud-text" id="score-display">分數: 0</div>
        <div style="display: flex; flex-direction: column; align-items: flex-end;">
            <div class="hud-text" id="health-display">血量: ❤️❤️❤️</div>
            <button id="btn-pause">暫停</button>
        </div>
    </div>

    <!-- 開始畫面 -->
    <div id="start-screen" class="ui-layer">
        <h1 style="font-weight: 900; letter-spacing: 2px;">太空槍戰<br>星際防衛者</h1>
        <p>最高分數: <span id="hi-score-display" class="highlight">0</span></p>
        <p>鍵盤：WASD 或方向鍵移動<br>觸控：拖曳移動<br><br><span style="color:#0ff; font-weight:bold;">✨ 戰鬥機會自動連發射擊 ✨</span></p>
        <button id="btn-start">開始遊戲</button>
    </div>

    <!-- 暫停畫面 -->
    <div id="pause-screen" class="ui-layer hidden">
        <h1 style="font-weight: 900; letter-spacing: 2px;">遊戲暫停</h1>
        <button id="btn-resume">繼續遊戲</button>
    </div>

    <!-- 結束畫面 -->
    <div id="game-over-screen" class="ui-layer hidden">
        <h1 style="color: #f00; text-shadow: 0 0 10px #f00, 0 0 20px #f00; font-weight: 900; letter-spacing: 2px;">遊戲結束</h1>
        <p id="new-record-msg" class="highlight hidden" style="font-size: 16px; animation: blink 1s infinite;">打破最高分紀錄！</p>
        <p>本次得分: <span id="final-score">0</span></p>
        <button id="btn-restart">再玩一次</button>
    </div>
</div>

<style>
    @keyframes blink { 50% { opacity: 0; } }
</style>

<script>
    // === DOM 元素 ===
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('game-container');
    
    // UI 元素
    const startScreen = document.getElementById('start-screen');
    const pauseScreen = document.getElementById('pause-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const hud = document.getElementById('hud');
    
    // 數據顯示
    const scoreDisplay = document.getElementById('score-display');
    const healthDisplay = document.getElementById('health-display');
    const hiScoreDisplay = document.getElementById('hi-score-display');
    const finalScore = document.getElementById('final-score');
    const newRecordMsg = document.getElementById('new-record-msg');

    // === 音效引擎 (Web Audio API) ===
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    const SoundBox = {
        init: function() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        },
        shoot: function() {
            if (audioCtx.state === 'suspended') return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            // 高頻下降
            osc.frequency.setValueAtTime(880, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.1);
            
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        },
        explosion: function() {
            if (audioCtx.state === 'suspended') return;
            const bufferSize = audioCtx.sampleRate * 0.5; // 0.5 seconds
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1; // 白噪音
            }
            
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            
            // 加入低通濾波器模擬爆炸低頻
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 1000;
            
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            noise.start();
        },
        gameOver: function() {
            if (audioCtx.state === 'suspended') return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 1);
            
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 1);
        }
    };

    // === 遊戲全局變數 ===
    let animationId;
    let gameState = 'START'; // START, PLAYING, PAUSED, GAMEOVER
    let score = 0;
    let highScore = localStorage.getItem('galaxyDefenderHighScore') || 0;
    hiScoreDisplay.innerText = highScore;
    
    // 自適應畫布尺寸
    function resizeCanvas() {
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // 遊戲物件陣列
    let player;
    let bullets = [];
    let enemies = [];
    let particles = [];
    let stars = [];

    // 控制與輸入
    const keys = {
        ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false,
        w: false, a: false, s: false, d: false, Space: false
    };
    let isDragging = false;
    let lastShootTime = 0;
    let frames = 0;
    let enemySpawnRate = 90; // 越小越快產生
    let gameDifficultyMultiplier = 1;

    // === 類別定義 ===

    // 星星 (視差滾動背景)
    class Star {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 2 + 0.5;
            this.speed = this.size * 0.5;
            this.alpha = Math.random();
        }
        update() {
            this.y += this.speed;
            if (this.y > canvas.height) {
                this.y = 0;
                this.x = Math.random() * canvas.width;
            }
        }
        draw() {
            ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // 粒子系統 (爆炸效果)
    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            const angle = Math.random() * Math.PI * 2;
            const velocity = Math.random() * 3 + 1;
            this.vx = Math.cos(angle) * velocity;
            this.vy = Math.sin(angle) * velocity;
            this.size = Math.random() * 3 + 1;
            this.life = 1.0; // 生命週期 1 到 0
            this.decay = Math.random() * 0.02 + 0.02;
            this.color = color;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.life -= this.decay;
        }
        draw() {
            ctx.save();
            ctx.globalAlpha = Math.max(0, this.life);
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    // 子彈
    class Bullet {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.width = 4;
            this.height = 15;
            this.speed = 10;
            this.color = '#0ff';
            this.markedForDeletion = false;
        }
        update() {
            this.y -= this.speed;
            if (this.y < 0) this.markedForDeletion = true;
        }
        draw() {
            ctx.save();
            ctx.fillStyle = this.color;
            ctx.shadowBlur = 10;
            ctx.shadowColor = this.color;
            ctx.fillRect(this.x - this.width/2, this.y, this.width, this.height);
            ctx.restore();
        }
    }

    // 玩家
    class Player {
        constructor() {
            this.size = 40; // 碰撞判定與表情符號大小
            this.x = canvas.width / 2;
            this.y = canvas.height - 80;
            this.speed = 6;
            this.hp = 3;
            this.emoji = '✈️'; // 將火箭改為戰鬥機
            this.isInvulnerable = false;
            this.invulnerableTimer = 0;
        }
        update() {
            // 鍵盤移動
            if ((keys.ArrowLeft || keys.a) && this.x > this.size/2) this.x -= this.speed;
            if ((keys.ArrowRight || keys.d) && this.x < canvas.width - this.size/2) this.x += this.speed;
            if ((keys.ArrowUp || keys.w) && this.y > this.size/2) this.y -= this.speed;
            if ((keys.ArrowDown || keys.s) && this.y < canvas.height - this.size/2) this.y += this.speed;

            // 無敵時間閃爍
            if (this.isInvulnerable) {
                this.invulnerableTimer--;
                if (this.invulnerableTimer <= 0) this.isInvulnerable = false;
            }
        }
        draw() {
            if (this.isInvulnerable && Math.floor(Date.now() / 100) % 2 === 0) return; // 閃爍效果

            ctx.save();
            ctx.font = `${this.size}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            // 替戰鬥機加上光暈
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#0ff';
            ctx.fillText(this.emoji, this.x, this.y);
            ctx.restore();
        }
        shoot() {
            const now = Date.now();
            if (now - lastShootTime > 80) { // 射速限制：從 200 降低至 80，大幅提升攻速
                bullets.push(new Bullet(this.x, this.y - this.size/2));
                SoundBox.shoot();
                lastShootTime = now;
            }
        }
        hit() {
            if (this.isInvulnerable) return;
            this.hp--;
            updateHUD();
            createExplosion(this.x, this.y, '#f00', 30);
            SoundBox.explosion();
            
            if (this.hp <= 0) {
                endGame();
            } else {
                this.isInvulnerable = true;
                this.invulnerableTimer = 60; // 60幀無敵 (約1秒)
            }
        }
    }

    // 敵人
    class Enemy {
        constructor() {
            this.size = Math.random() * 10 + 30; // 30~40
            this.x = Math.random() * (canvas.width - this.size) + this.size/2;
            this.y = -this.size;
            this.speed = (Math.random() * 2 + 2) * gameDifficultyMultiplier;
            this.emoji = Math.random() > 0.5 ? '🛸' : '👾';
            this.markedForDeletion = false;
            this.hp = Math.random() > 0.8 ? 2 : 1; // 20% 機率是血量2的敵人
        }
        update() {
            this.y += this.speed;
            if (this.y > canvas.height + this.size) this.markedForDeletion = true;
        }
        draw() {
            ctx.save();
            ctx.font = `${this.size}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowBlur = 10;
            ctx.shadowColor = this.emoji === '🛸' ? '#f0f' : '#0f0';
            ctx.fillText(this.emoji, this.x, this.y);
            
            // 如果血量大於1，稍微畫個小血條指示
            if(this.hp > 1) {
                ctx.fillStyle = '#f00';
                ctx.fillRect(this.x - 10, this.y - this.size/2 - 5, 20, 3);
            }
            ctx.restore();
        }
    }

    // 圓形碰撞偵測
    function checkCollision(circle1, circle2, radiusMultiplier = 0.4) {
        // 利用 radiusMultiplier 縮小碰撞框，讓手感更好 (容錯率高)
        const dx = circle1.x - circle2.x;
        const dy = circle1.y - circle2.y;
        const distance = Math.sqrt(dx * dx + dy * dy);
        // Bullet沒有size屬性，用width代替半徑計算
        const r1 = (circle1.size || circle1.width) * radiusMultiplier;
        const r2 = (circle2.size || circle2.width) * radiusMultiplier;
        return distance < r1 + r2;
    }

    // 產生爆炸粒子
    function createExplosion(x, y, color, amount = 15) {
        for (let i = 0; i < amount; i++) {
            particles.push(new Particle(x, y, color));
        }
    }

    // === 遊戲核心邏輯 ===
    function initGame() {
        resizeCanvas();
        player = new Player();
        bullets = [];
        enemies = [];
        particles = [];
        score = 0;
        frames = 0;
        enemySpawnRate = 90;
        gameDifficultyMultiplier = 1;
        updateHUD();
        
        // 初始星星
        stars = [];
        for (let i = 0; i < 100; i++) stars.push(new Star());
    }

    function updateHUD() {
        scoreDisplay.innerText = `分數: ${score}`;
        healthDisplay.innerText = `血量: ${'❤️'.repeat(player.hp)}`;
    }

    function handleEnemies() {
        // 生成敵人
        if (frames % enemySpawnRate === 0) {
            enemies.push(new Enemy());
        }
        
        // 難度遞增：每 600 幀 (約 10 秒) 增加一點難度
        if (frames % 600 === 0 && enemySpawnRate > 20) {
            enemySpawnRate -= 5;
            gameDifficultyMultiplier += 0.1;
        }

        for (let i = enemies.length - 1; i >= 0; i--) {
            let enemy = enemies[i];
            enemy.update();
            enemy.draw();

            // 撞擊玩家
            if (!player.isInvulnerable && checkCollision(player, enemy)) {
                player.hit();
                enemy.markedForDeletion = true;
                continue;
            }

            // 被子彈擊中
            for (let j = bullets.length - 1; j >= 0; j--) {
                let bullet = bullets[j];
                if (checkCollision(bullet, enemy)) {
                    bullet.markedForDeletion = true;
                    enemy.hp--;
                    
                    if (enemy.hp <= 0) {
                        enemy.markedForDeletion = true;
                        score += 10;
                        updateHUD();
                        createExplosion(enemy.x, enemy.y, enemy.emoji === '🛸' ? '#f0f' : '#0f0');
                        SoundBox.explosion();
                    } else {
                        // 擊中但未死的小火花
                        createExplosion(bullet.x, bullet.y, '#fff', 3);
                    }
                    break; // 一顆子彈只打一個敵人
                }
            }

            if (enemy.markedForDeletion) {
                enemies.splice(i, 1);
            }
        }
    }

    function gameLoop(timestamp) {
        if (gameState !== 'PLAYING') return;

        // 清除畫布並畫深色背景
        ctx.fillStyle = 'rgba(5, 5, 16, 0.5)'; // 尾跡效果
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 背景星星
        stars.forEach(star => {
            star.update();
            star.draw();
        });

        // 玩家控制
        player.update();
        player.draw();
        
        // 自動射擊（不再依賴按鍵或拖曳狀態）
        player.shoot();

        // 子彈
        for (let i = bullets.length - 1; i >= 0; i--) {
            bullets[i].update();
            bullets[i].draw();
            if (bullets[i].markedForDeletion) bullets.splice(i, 1);
        }

        // 敵人
        handleEnemies();

        // 粒子
        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update();
            particles[i].draw();
            if (particles[i].life <= 0) particles.splice(i, 1);
        }

        frames++;
        animationId = requestAnimationFrame(gameLoop);
    }

    // === 遊戲狀態管理 ===
    function startGame() {
        SoundBox.init(); // 啟用音效
        gameState = 'PLAYING';
        startScreen.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
        pauseScreen.classList.add('hidden');
        hud.classList.remove('hidden');
        initGame();
        gameLoop();
    }

    function pauseGame() {
        if (gameState === 'PLAYING') {
            gameState = 'PAUSED';
            cancelAnimationFrame(animationId);
            pauseScreen.classList.remove('hidden');
        } else if (gameState === 'PAUSED') {
            gameState = 'PLAYING';
            pauseScreen.classList.add('hidden');
            gameLoop();
        }
    }

    function endGame() {
        gameState = 'GAMEOVER';
        cancelAnimationFrame(animationId);
        SoundBox.gameOver();
        
        hud.classList.add('hidden');
        gameOverScreen.classList.remove('hidden');
        finalScore.innerText = score;
        
        // 紀錄最高分
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('galaxyDefenderHighScore', highScore);
            hiScoreDisplay.innerText = highScore;
            newRecordMsg.classList.remove('hidden');
        } else {
            newRecordMsg.classList.add('hidden');
        }
    }

    // === 事件監聽器 ===

    // 按鈕
    document.getElementById('btn-start').addEventListener('click', startGame);
    document.getElementById('btn-restart').addEventListener('click', startGame);
    document.getElementById('btn-pause').addEventListener('click', pauseGame);
    document.getElementById('btn-resume').addEventListener('click', pauseGame);

    // 鍵盤
    window.addEventListener('keydown', e => {
        if (keys.hasOwnProperty(e.key)) keys[e.key] = true;
        if (e.code === 'Space') { keys.Space = true; e.preventDefault(); } // 防止空白鍵捲動
        // 快速鍵 p 暫停
        if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
            if(gameState === 'PLAYING' || gameState === 'PAUSED') pauseGame();
        }
    });

    window.addEventListener('keyup', e => {
        if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
        if (e.code === 'Space') keys.Space = false;
    });

    // 滑鼠與觸控 (拖曳移動與自動射擊)
    function handleMove(clientX, clientY) {
        if (gameState !== 'PLAYING' || !player) return;
        const rect = canvas.getBoundingClientRect();
        // 將視窗座標轉換為畫布內的相對座標
        const x = clientX - rect.left;
        const y = clientY - rect.top;
        
        // 稍微往上偏移，以免手指擋住飛船
        player.x = x;
        player.y = y - 40; 
        
        // 邊界限制
        player.x = Math.max(player.size/2, Math.min(canvas.width - player.size/2, player.x));
        player.y = Math.max(player.size/2, Math.min(canvas.height - player.size/2, player.y));
    }

    // 滑鼠
    canvas.addEventListener('mousedown', e => { isDragging = true; handleMove(e.clientX, e.clientY); });
    window.addEventListener('mouseup', () => { isDragging = false; });
    canvas.addEventListener('mousemove', e => { if (isDragging) handleMove(e.clientX, e.clientY); });

    // 觸控
    canvas.addEventListener('touchstart', e => {
        isDragging = true;
        SoundBox.init(); // 確保手機觸控能解鎖 AudioContext
        handleMove(e.touches[0].clientX, e.touches[0].clientY);
    }, {passive: true});
    window.addEventListener('touchend', () => { isDragging = false; });
    canvas.addEventListener('touchmove', e => {
        if (isDragging) {
            e.preventDefault(); // 防止滑動螢幕
            handleMove(e.touches[0].clientX, e.touches[0].clientY);
        }
    }, {passive: false});

    // 初始化背景裝飾用星星 (在未開始遊戲前渲染一次背景)
    resizeCanvas();
    for (let i = 0; i < 100; i++) stars.push(new Star());
    ctx.fillStyle = '#050510';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    stars.forEach(s => s.draw());

</script>
</body>
</html>

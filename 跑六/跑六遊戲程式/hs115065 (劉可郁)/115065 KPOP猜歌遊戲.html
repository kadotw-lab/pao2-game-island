    <script src="https://cdn.tailwindcss.com"></script>

                extend: {
                    colors: {

                        neonGreen: '#00FF66',
                        neonRed: '#FF3366',
                        darkBg: '#0d0c1d'

    <style>
        body {
            background-color: #0d0c1d;
            background-image: 
                radial-gradient(circle at 10% 15%, rgba(123, 44, 191, 0.35) 0%, transparent 40%),
                radial-gradient(circle at 90% 85%, rgba(255, 0, 127, 0.3) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(0, 245, 255, 0.12) 0%, transparent 60%);
            background-attachment: fixed;
            color: #ffffff;
            font-family: 'Poppins', 'Noto Sans KR', system-ui, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .glass-card {
            background: rgba(20, 16, 42, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65);
        }

        .glow-pink { box-shadow: 0 0 25px rgba(255, 0, 127, 0.5); }
        .glow-cyan { box-shadow: 0 0 25px rgba(0, 245, 255, 0.5); }
        .text-glow-pink { text-shadow: 0 0 14px rgba(255, 0, 127, 0.85); }
        .text-glow-cyan { text-shadow: 0 0 14px rgba(0, 245, 255, 0.85); }

        .option-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: #00F5FF;
            box-shadow: 0 0 20px rgba(0, 245, 255, 0.35);
        }
        .option-btn:active:not(:disabled) {
            transform: translateY(1px);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
        .animate-shake { animation: shake 0.45s ease-in-out; }

        @keyframes pulseGlowGreen {
            0% { box-shadow: 0 0 5px #00FF66; }
            50% { box-shadow: 0 0 25px #00FF66, 0 0 35px #00FF66; }
            100% { box-shadow: 0 0 5px #00FF66; }
        }
        .correct-glow {
            animation: pulseGlowGreen 0.6s infinite alternate;
            border-color: #00FF66 !important;
            background: rgba(0, 255, 102, 0.2) !important;
        }

        @keyframes pulseGlowRed {
            0% { box-shadow: 0 0 5px #FF3366; }
            50% { box-shadow: 0 0 25px #FF3366, 0 0 35px #FF3366; }
            100% { box-shadow: 0 0 5px #FF3366; }
        }
        .wrong-glow {
            animation: pulseGlowRed 0.6s infinite alternate;
            border-color: #FF3366 !important;
            background: rgba(255, 51, 102, 0.2) !important;
        }

        .screen {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .screen-hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.95);
            display: none !important;
        }

        #confettiCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>

        class AudioSynth {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
            }

            toggleMute() {
                this.muted = !this.muted;
                return this.muted;
            }

            playTap() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(300, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            }

            playCorrect() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0, now + idx * 0.06);
                    gain.gain.linearRampToValueAtTime(0.2, now + idx * 0.06 + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.06 + 0.35);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + idx * 0.06);
                    osc.stop(now + idx * 0.06 + 0.35);
                });
            }

            playWrong() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(160, now);
                osc.frequency.linearRampToValueAtTime(110, now + 0.25);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.25);
            }

            playFanfare() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;
                const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
                const now = this.ctx.currentTime;
                notes.forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0, now + i * 0.1);
                    gain.gain.linearRampToValueAtTime(0.25, now + i * 0.1 + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.5);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + i * 0.1);
                    osc.stop(now + i * 0.1 + 0.5);
                });
            }
        }

        const audioSynth = new AudioSynth();

        class ConfettiManager {
            constructor(canvasId) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.particles = [];
                this.animId = null;
                this.resize();
                window.addEventListener('resize', () => this.resize());
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            burst() {
                const colors = ['#FF007F', '#00F5FF', '#7B2CBF', '#00FF66', '#FFCC00'];
                for (let i = 0; i < 90; i++) {
                    this.particles.push({
                        x: this.canvas.width / 2,
                        y: this.canvas.height / 2,
                        vx: (Math.random() - 0.5) * 20,
                        vy: (Math.random() - 0.7) * 22,
                        size: Math.random() * 8 + 4,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        rotation: Math.random() * 360,
                        vRot: (Math.random() - 0.5) * 12,
                        life: 1,
                        decay: Math.random() * 0.02 + 0.015
                    });
                }
                if (!this.animId) this.animate();
            }

            animate() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this.particles.forEach((p, idx) => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.4;
                    p.rotation += p.vRot;
                    p.life -= p.decay;

                    this.ctx.save();
                    this.ctx.translate(p.x, p.y);
                    this.ctx.rotate((p.rotation * Math.PI) / 180);
                    this.ctx.fillStyle = p.color;
                    this.ctx.globalAlpha = Math.max(0, p.life);
                    this.ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                    this.ctx.restore();

                    if (p.life <= 0) {
                        this.particles.splice(idx, 1);
                    }
                });

                if (this.particles.length > 0) {
                    this.animId = requestAnimationFrame(() => this.animate());
                } else {
                    this.animId = null;
                }
            }
        }

        const confetti = new ConfettiManager('confettiCanvas');

        class GameEngine {
            constructor() {
                this.questions = [];
                this.currentIndex = 0;
                this.score = 0;
                this.highScore = parseInt(localStorage.getItem('kpop_quiz_highscore_v2') || '0', 10);
                this.timer = null;
                this.timeLeft = 10;
                this.isAnswering = false;

                // DOM
                this.startScreen = document.getElementById('startScreen');
                this.gameScreen = document.getElementById('gameScreen');
                this.resultScreen = document.getElementById('resultScreen');

                this.startHighScoreEl = document.getElementById('startHighScore');
                this.gameHighScoreEl = document.getElementById('gameHighScore');
                this.currentScoreEl = document.getElementById('currentScore');
                this.currentQuestionNumEl = document.getElementById('currentQuestionNum');
                this.progressBarEl = document.getElementById('progressBar');

                this.timerBarEl = document.getElementById('timerBar');
                this.timerTextEl = document.getElementById('timerText');

                this.lyricCard = document.getElementById('lyricCard');
                this.koreanLyricEl = document.getElementById('koreanLyric');
                this.romanLyricEl = document.getElementById('romanLyric');
                this.translatedLyricEl = document.getElementById('translatedLyric');
                this.hintTagEl = document.getElementById('hintTag');
                this.optionsContainer = document.getElementById('optionsContainer');

                this.finalScoreEl = document.getElementById('finalScore');
                this.accuracyTextEl = document.getElementById('accuracyText');
                this.resultTitleEl = document.getElementById('resultTitle');
                this.resultIconEl = document.getElementById('resultIcon');
                this.newHighscoreBadge = document.getElementById('newHighscoreBadge');

                this.bindEvents();
                this.updateHighScoreDisplay();
            }

            bindEvents() {
                document.getElementById('startBtn').addEventListener('click', () => {
                    audioSynth.playTap();
                    this.startGame();
                });
                document.getElementById('restartBtn').addEventListener('click', () => {
                    audioSynth.playTap();
                    this.startGame();
                });

                const soundBtn = document.getElementById('soundToggleBtn');
                const soundIcon = document.getElementById('soundIcon');
                soundBtn.addEventListener('click', () => {
                    const isMuted = audioSynth.toggleMute();
                    if (isMuted) {
                        soundBtn.innerHTML = `<i class="fa-solid fa-volume-xmark mr-1 text-neonRed"></i> 音效: 關`;
                    } else {
                        soundBtn.innerHTML = `<i class="fa-solid fa-volume-high mr-1 text-neonCyan"></i> 音效: 開`;
                        audioSynth.playTap();
                    }
                });
            }

            updateHighScoreDisplay() {
                this.startHighScoreEl.textContent = this.highScore;
                this.gameHighScoreEl.textContent = this.highScore;
            }

            // Fisher-Yates Shuffle Algorithm for unbiased randomization
            fisherYatesShuffle(array) {
                const arr = [...array];
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }

            startGame() {
                // Randomly shuffle entire database and take 10 questions
                this.questions = this.fisherYatesShuffle(SONG_DATABASE).slice(0, 10);
                this.currentIndex = 0;
                this.score = 0;
                this.currentScoreEl.textContent = '0';

                this.showScreen(this.gameScreen);
                this.loadQuestion();
            }

            showScreen(targetScreen) {
                [this.startScreen, this.gameScreen, this.resultScreen].forEach(s => {
                    s.classList.add('screen-hidden');
                });
                targetScreen.classList.remove('screen-hidden');
            }

            loadQuestion() {
                this.isAnswering = true;
                const q = this.questions[this.currentIndex];

                this.lyricCard.className = "relative bg-black/40 rounded-2xl p-6 sm:p-8 mb-6 border border-white/10 text-center transition-all duration-300";
                this.currentQuestionNumEl.textContent = this.currentIndex + 1;
                this.progressBarEl.style.width = `${((this.currentIndex) / 10) * 100}%`;

                this.koreanLyricEl.textContent = `"${q.lyric}"`;
                this.romanLyricEl.textContent = `(${q.roman})`;
                this.translatedLyricEl.textContent = `譯：${q.translation}`;
                this.hintTagEl.textContent = `提示：${q.hint}`;

                // Shuffle options for this specific question
                const options = this.fisherYatesShuffle([q.correct, ...q.distractors]);
                this.optionsContainer.innerHTML = '';

                options.forEach((optText, i) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn w-full p-4 rounded-2xl bg-black/40 border border-white/10 text-white font-bold text-left text-sm sm:text-base flex items-center justify-between group';
                    btn.innerHTML = `
                        <div class="flex items-center space-x-3">
                            <span class="w-7 h-7 rounded-lg bg-white/10 flex items-center justify-center text-xs text-neonCyan font-black group-hover:bg-neonCyan group-hover:text-black transition-colors">
                                ${String.fromCharCode(65 + i)}
                            </span>
                            <span>${optText}</span>
                        </div>
                        <i class="fa-solid fa-chevron-right opacity-0 group-hover:opacity-100 transition-opacity text-neonCyan text-xs"></i>
                    `;
                    btn.addEventListener('click', () => this.handleAnswer(optText, btn));
                    this.optionsContainer.appendChild(btn);
                });

                this.resetTimer();
            }

            resetTimer() {
                clearInterval(this.timer);
                this.timeLeft = 10;
                this.updateTimerUI();

                this.timer = setInterval(() => {
                    this.timeLeft--;
                    this.updateTimerUI();

                    if (this.timeLeft <= 0) {
                        clearInterval(this.timer);
                        this.handleTimeOut();
                    }
                }, 1000);
            }

            updateTimerUI() {
                this.timerTextEl.textContent = this.timeLeft;
                const percentage = (this.timeLeft / 10) * 100;
                this.timerBarEl.style.width = `${percentage}%`;

                if (this.timeLeft <= 3) {
                    this.timerBarEl.className = "bg-neonRed h-2.5 rounded-full transition-all duration-100 ease-linear w-full";
                    this.timerTextEl.className = "text-neonRed font-black text-lg w-8 text-right animate-pulse";
                } else {
                    this.timerBarEl.className = "bg-neonPink h-2.5 rounded-full transition-all duration-100 ease-linear w-full";
                    this.timerTextEl.className = "text-neonPink font-black text-lg w-8 text-right";
                }
            }

            handleAnswer(selectedOption, clickedBtn) {
                if (!this.isAnswering) return;
                this.isAnswering = false;
                clearInterval(this.timer);

                const currentQ = this.questions[this.currentIndex];
                const isCorrect = selectedOption === currentQ.correct;

                const allBtns = this.optionsContainer.querySelectorAll('button');
                allBtns.forEach(btn => btn.disabled = true);

                if (isCorrect) {
                    audioSynth.playCorrect();
                    confetti.burst();
                    this.score += 10;
                    this.currentScoreEl.textContent = this.score;

                    clickedBtn.classList.add('correct-glow');
                    this.lyricCard.classList.add('correct-glow');

                    setTimeout(() => this.nextQuestion(), 1100);
                } else {
                    audioSynth.playWrong();
                    clickedBtn.classList.add('wrong-glow');
                    this.lyricCard.classList.add('animate-shake', 'wrong-glow');

                    allBtns.forEach(btn => {
                        if (btn.textContent.includes(currentQ.correct)) {
                            btn.classList.add('correct-glow');
                        }
                    });

                    setTimeout(() => this.nextQuestion(), 1600);
                }
            }

            handleTimeOut() {
                if (!this.isAnswering) return;
                this.isAnswering = false;

                audioSynth.playWrong();
                this.lyricCard.classList.add('animate-shake', 'wrong-glow');

                const currentQ = this.questions[this.currentIndex];
                const allBtns = this.optionsContainer.querySelectorAll('button');
                allBtns.forEach(btn => {
                    btn.disabled = true;
                    if (btn.textContent.includes(currentQ.correct)) {
                        btn.classList.add('correct-glow');
                    }
                });

                setTimeout(() => this.nextQuestion(), 1600);
            }

            nextQuestion() {
                this.currentIndex++;
                if (this.currentIndex < 10) {
                    this.loadQuestion();
                } else {
                    this.endGame();
                }
            }

            endGame() {
                this.progressBarEl.style.width = '100%';
                let isNewHigh = false;

                if (this.score > this.highScore) {
                    this.highScore = this.score;
                    localStorage.setItem('kpop_quiz_highscore_v2', this.highScore.toString());
                    this.updateHighScoreDisplay();
                    isNewHigh = true;
                }

                this.finalScoreEl.textContent = this.score;
                this.accuracyTextEl.textContent = `${(this.score / 100) * 100}%`;

                if (this.score === 100) {
                    this.resultTitleEl.textContent = "K-POP 神級歌迷 👑";
                    this.resultIconEl.className = "fa-solid fa-crown text-yellow-400";
                } else if (this.score >= 80) {
                    this.resultTitleEl.textContent = "資深韓團粉絲 🔥";
                    this.resultIconEl.className = "fa-solid fa-fire text-neonPink";
                } else if (this.score >= 50) {
                    this.resultTitleEl.textContent = "K-POP 愛好者 🎧";
                    this.resultIconEl.className = "fa-solid fa-headphones text-neonCyan";
                } else {
                    this.resultTitleEl.textContent = "新手路人粉 🐣";
                    this.resultIconEl.className = "fa-solid fa-seedling text-neonGreen";
                }

                if (isNewHigh && this.score > 0) {
                    this.newHighscoreBadge.classList.remove('hidden');
                } else {
                    this.newHighscoreBadge.classList.add('hidden');
                }

                audioSynth.playFanfare();
                confetti.burst();
                this.showScreen(this.resultScreen);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            window.game = new GameEngine();
        });
    </script>

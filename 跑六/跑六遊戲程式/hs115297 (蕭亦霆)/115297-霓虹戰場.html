<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>霓虹戰區：生存槍戰 (Neon Zone: Top-Down Shooter)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #090a0f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #game-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background-color: #0a0c14;
        }
        .neon-text {
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.8), 0 0 20px rgba(0, 243, 255, 0.4);
        }
        .neon-border {
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4), inset 0 0 15px rgba(0, 243, 255, 0.2);
        }
        .red-neon-text {
            text-shadow: 0 0 10px rgba(255, 0 85, 0.8), 0 0 20px rgba(255, 0, 85, 0.4);
        }
        /* Touch Control Overlays */
        .touch-joystick {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(0, 243, 255, 0.3);
            pointer-events: auto;
            display: none;
        }
        .touch-stick {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(0, 243, 255, 0.6);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.8);
            transform: translate(-50%, -50%);
        }
        @media (pointer: coarse) {
            .touch-control-ui {
                display: block !important;
            }
        }
    </style>
</head>
<body class="relative flex items-center justify-center">

    <!-- GAME CANVAS -->
    <canvas id="game-canvas"></canvas>

    <!-- HUD OVERLAY (TOP) -->
    <div id="hud" class="absolute top-0 left-0 w-full p-4 pointer-events-none flex justify-between items-start text-white hidden">
        <!-- Left Side: Player Status -->
        <div class="flex flex-col gap-2">
            <!-- HP Bar -->
            <div class="w-48 sm:w-64 bg-gray-900/80 border border-cyan-500/50 rounded-full h-5 p-0.5 relative overflow-hidden backdrop-blur-md">
                <div id="hp-bar" class="bg-gradient-to-r from-red-600 to-emerald-400 h-full rounded-full w-full transition-all duration-150"></div>
                <span id="hp-text" class="absolute inset-0 flex items-center justify-center text-xs font-bold drop-shadow">200 / 200</span>
            </div>
            <!-- Dodge Cooldown Indicator -->
            <div class="flex items-center gap-2">
                <span class="text-xs text-cyan-400 font-mono">DODGE (SPACE):</span>
                <div class="w-24 bg-gray-900/80 border border-cyan-500/30 rounded-full h-3 p-0.5 backdrop-blur-md">
                    <div id="dodge-bar" class="bg-cyan-400 h-full rounded-full w-full"></div>
                </div>
            </div>
        </div>

        <!-- Center: Wave & Score -->
        <div class="text-center flex flex-col items-center">
            <div id="wave-title" class="text-lg sm:text-2xl font-black tracking-widest text-cyan-400 neon-text">WAVE 1</div>
            <div id="score-text" class="text-sm sm:text-base font-mono text-gray-300">SCORE: 00000</div>
        </div>

        <!-- Right Side: Weapon & Ammo Status -->
        <div class="text-right flex flex-col items-end gap-1">
            <div id="weapon-name" class="text-sm sm:text-lg font-bold text-yellow-400 tracking-wider">Pistol</div>
            <div class="flex items-baseline gap-1 font-mono">
                <span id="ammo-clip" class="text-2xl sm:text-3xl font-black text-white">∞</span>
                <span id="ammo-reserve" class="text-sm text-gray-400">/ ∞</span>
            </div>
            <div id="reload-prompt" class="text-xs text-red-400 font-bold tracking-widest animate-pulse hidden">PRESS 'R' TO RELOAD</div>
        </div>
    </div>

    <!-- START SCREEN -->
    <div id="start-screen" class="absolute inset-0 bg-slate-950/90 backdrop-blur-lg flex flex-col items-center justify-center text-white p-6 z-20">
        <div class="max-w-md text-center flex flex-col items-center">
            <h1 class="text-4xl sm:text-6xl font-black tracking-wider text-cyan-400 mb-2 neon-text">霓虹戰區</h1>
            <p class="text-sm sm:text-base text-gray-400 mb-6">2D 俯視角雙搖桿生存槍戰</p>

            <!-- Instructions -->
            <div class="bg-slate-900/80 border border-cyan-500/30 rounded-xl p-4 text-left text-xs sm:text-sm text-gray-300 mb-6 w-full space-y-2">
                <div class="text-cyan-400 font-bold border-b border-cyan-500/20 pb-1">操作說明：</div>
                <div><span class="text-yellow-400 font-bold">WASD / 方向鍵</span> : 控制角色移動</div>
                <div><span class="text-yellow-400 font-bold">滑鼠移動</span> : 瞄準方向</div>
                <div><span class="text-yellow-400 font-bold">滑鼠左鍵</span> : 發射子彈</div>
                <div><span class="text-yellow-400 font-bold">R 鍵</span> : 手動換彈</div>
                <div><span class="text-yellow-400 font-bold">1 / 2 / 3 或 滾輪</span> : 切換武器（手槍 / 步槍 / 霰彈槍）</div>
                <div><span class="text-yellow-400 font-bold">空白鍵 (Space)</span> : 戰術衝刺閃避（無敵幀）</div>
                <div class="text-gray-400 text-xs italic mt-2">* 支援行動裝置虛擬雙搖桿與觸控按鈕</div>
            </div>

            <button id="start-btn" class="w-full py-4 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-black text-xl rounded-xl transition duration-200 transform hover:scale-105 shadow-lg shadow-cyan-500/50 cursor-pointer">
                開始戰鬥
            </button>
        </div>
    </div>

    <!-- PAUSE SCREEN -->
    <div id="pause-screen" class="absolute inset-0 bg-slate-950/80 backdrop-blur-md flex flex-col items-center justify-center text-white p-6 z-20 hidden">
        <h2 class="text-4xl font-black text-cyan-400 mb-6 neon-text">遊戲暫停</h2>
        <button id="resume-btn" class="px-8 py-3 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-lg rounded-xl mb-4 transition transform hover:scale-105 shadow-lg shadow-cyan-500/30">
            繼續遊戲
        </button>
        <button id="restart-from-pause-btn" class="px-8 py-3 bg-slate-800 hover:bg-slate-700 text-gray-200 font-bold text-base rounded-xl transition">
            重新開始
        </button>
    </div>

    <!-- GAME OVER SCREEN -->
    <div id="game-over-screen" class="absolute inset-0 bg-slate-950/95 backdrop-blur-xl flex flex-col items-center justify-center text-white p-6 z-30 hidden">
        <div class="max-w-md text-center flex flex-col items-center">
            <h2 class="text-5xl font-black text-red-500 mb-2 red-neon-text">任務失敗</h2>
            <p class="text-gray-400 text-sm mb-6">你已被特勤敵軍殲滅</p>

            <div class="bg-slate-900/90 border border-red-500/30 rounded-xl p-6 w-full space-y-4 mb-6">
                <div class="flex justify-between items-center text-sm border-b border-gray-800 pb-2">
                    <span class="text-gray-400">生存波次:</span>
                    <span id="go-wave" class="text-xl font-bold text-cyan-400">Wave 1</span>
                </div>
                <div class="flex justify-between items-center text-sm border-b border-gray-800 pb-2">
                    <span class="text-gray-400">最終得分:</span>
                    <span id="go-score" class="text-2xl font-bold text-yellow-400">0</span>
                </div>
                <div class="flex justify-between items-center text-sm">
                    <span class="text-gray-400">歷史最高分:</span>
                    <span id="go-highscore" class="text-lg font-bold text-emerald-400">0</span>
                </div>
            </div>

            <button id="restart-btn" class="w-full py-4 bg-red-600 hover:bg-red-500 text-white font-black text-xl rounded-xl transition duration-200 transform hover:scale-105 shadow-lg shadow-red-600/50 cursor-pointer">
                再次挑戰
            </button>
        </div>
    </div>

    <!-- TOUCH CONTROLS FOR MOBILE -->
    <div id="touch-controls" class="touch-control-ui absolute inset-0 pointer-events-none z-10 hidden">
        <!-- Left Joystick (Move) -->
        <div id="joystick-move" class="touch-joystick w-32 h-32 bottom-10 left-10">
            <div id="stick-move" class="touch-stick top-1/2 left-1/2"></div>
        </div>
        <!-- Right Joystick (Aim/Shoot) -->
        <div id="joystick-aim" class="touch-joystick w-32 h-32 bottom-10 right-10">
            <div id="stick-aim" class="touch-stick top-1/2 left-1/2"></div>
        </div>

        <!-- Action Buttons -->
        <div class="absolute bottom-48 right-8 flex flex-col gap-3 pointer-events-auto">
            <button id="btn-touch-dodge" class="w-14 h-14 bg-cyan-500/30 border border-cyan-400 text-cyan-300 font-bold rounded-full flex items-center justify-center text-xs active:bg-cyan-500/60">閃避</button>
            <button id="btn-touch-reload" class="w-14 h-14 bg-yellow-500/30 border border-yellow-400 text-yellow-300 font-bold rounded-full flex items-center justify-center text-xs active:bg-yellow-500/60">換彈</button>
            <button id="btn-touch-switch" class="w-14 h-14 bg-purple-500/30 border border-purple-400 text-purple-300 font-bold rounded-full flex items-center justify-center text-xs active:bg-purple-500/60">換槍</button>
        </div>
    </div>

    <script>
        // =========================================================================
        // WEB AUDIO SYNTHESIZER ENGINE (Zero external sound files)
        // =========================================================================
        class AudioEngine {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            // Gunshot sound generation
            playGunshot(type) {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                
                // Noise buffer for blast
                const bufferSize = this.ctx.sampleRate * 0.15;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(type === 'shotgun' ? 800 : type === 'rifle' ? 1200 : 1600, now);

                const gain = this.ctx.createGain();
                let vol = type === 'shotgun' ? 0.4 : type === 'rifle' ? 0.25 : 0.3;
                gain.gain.setValueAtTime(vol, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + (type === 'shotgun' ? 0.15 : 0.08));

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);

                noise.start(now);
            }

            // Reload sound
            playReload() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.linearRampToValueAtTime(800, now + 0.1);

                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.15);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.15);
            }

            // Hit / Impact sound
            playHit() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.05);

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.05);
            }

            // Enemy explosion
            playExplosion() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.exponentialRampToValueAtTime(20, now + 0.3);

                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.3);
            }

            // Player hurt
            playHurt() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'square';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.linearRampToValueAtTime(110, now + 0.15);

                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.15);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.15);
            }

            // Item pickup sound
            playPowerup() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(900, now + 0.2);

                gain.gain.setValueAtTime(0.25, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.2);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.2);
            }
        }

        const audio = new AudioEngine();

        // =========================================================================
        // GAME SETUP & CONSTANTS
        // =========================================================================
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Weapon Configurations
        const WEAPONS = {
            pistol: {
                name: '手槍 (Pistol)',
                fireRate: 250, // ms between shots
                magSize: Infinity,
                reserveAmmo: Infinity,
                damage: 25,
                bulletSpeed: 14,
                spread: 0.05,
                pellets: 1,
                reloadTime: 0,
                color: '#00f3ff'
            },
            rifle: {
                name: '突擊步槍 (Assault Rifle)',
                fireRate: 100,
                magSize: 30,
                reserveAmmo: 180,
                damage: 18,
                bulletSpeed: 16,
                spread: 0.1,
                pellets: 1,
                reloadTime: 1500,
                color: '#ffea00'
            },
            shotgun: {
                name: '霰彈槍 (Shotgun)',
                fireRate: 800,
                magSize: 8,
                reserveAmmo: 48,
                damage: 15,
                bulletSpeed: 12,
                spread: 0.25,
                pellets: 6,
                reloadTime: 2000,
                color: '#ff0055'
            }
        };

        // Game States
        const STATE = {
            START: 'start',
            PLAYING: 'playing',
            PAUSED: 'paused',
            GAMEOVER: 'gameover'
        };

        let gameState = STATE.START;
        let score = 0;
        let wave = 1;
        let highscore = parseInt(localStorage.getItem('neon_shooter_highscore') || '0');

        // Camera Screen Shake
        let shakeTime = 0;
        let shakeIntensity = 0;

        function triggerShake(intensity = 5, duration = 10) {
            shakeIntensity = intensity;
            shakeTime = duration;
        }

        // =========================================================================
        // INPUT CONTROLLER
        // =========================================================================
        const keys = {};
        const mouse = { x: canvas.width / 2, y: canvas.height / 2, down: false };

        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'KeyR' && gameState === STATE.PLAYING) {
                player.reload();
            }
            if (e.code === 'Digit1') player.switchWeapon('pistol');
            if (e.code === 'Digit2') player.switchWeapon('rifle');
            if (e.code === 'Digit3') player.switchWeapon('shotgun');
            if (e.code === 'Space' && gameState === STATE.PLAYING) {
                player.dodge();
            }
            if (e.code === 'Escape' && (gameState === STATE.PLAYING || gameState === STATE.PAUSED)) {
                togglePause();
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        canvas.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        canvas.addEventListener('mousedown', (e) => {
            if (e.button === 0) mouse.down = true;
        });

        canvas.addEventListener('mouseup', (e) => {
            if (e.button === 0) mouse.down = false;
        });

        canvas.addEventListener('wheel', (e) => {
            if (gameState !== STATE.PLAYING) return;
            const wKeys = Object.keys(WEAPONS);
            let idx = wKeys.indexOf(player.currentWeaponKey);
            if (e.deltaY > 0) {
                idx = (idx + 1) % wKeys.length;
            } else {
                idx = (idx - 1 + wKeys.length) % wKeys.length;
            }
            player.switchWeapon(wKeys[idx]);
        });

        // Virtual Touch Joystick Implementation
        const joystickMove = { active: false, startX: 0, startY: 0, dx: 0, dy: 0 };
        const joystickAim = { active: false, startX: 0, startY: 0, dx: 0, dy: 0 };

        function setupTouchControls() {
            const elMove = document.getElementById('joystick-move');
            const stickMove = document.getElementById('stick-move');
            const elAim = document.getElementById('joystick-aim');
            const stickAim = document.getElementById('stick-aim');

            if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
                document.getElementById('touch-controls').classList.remove('hidden');
                elMove.style.display = 'block';
                elAim.style.display = 'block';
            }

            // Left Joystick (Movement)
            elMove.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                const rect = elMove.getBoundingClientRect();
                joystickMove.active = true;
                joystickMove.startX = rect.left + rect.width / 2;
                joystickMove.startY = rect.top + rect.height / 2;
            });

            window.addEventListener('touchmove', (e) => {
                for (let touch of e.touches) {
                    if (joystickMove.active && touch.clientX < window.innerWidth / 2) {
                        let dx = touch.clientX - joystickMove.startX;
                        let dy = touch.clientY - joystickMove.startY;
                        let dist = Math.hypot(dx, dy);
                        let maxDist = 40;
                        if (dist > maxDist) {
                            dx = (dx / dist) * maxDist;
                            dy = (dy / dist) * maxDist;
                        }
                        joystickMove.dx = dx / maxDist;
                        joystickMove.dy = dy / maxDist;
                        stickMove.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
                    }
                    if (joystickAim.active && touch.clientX >= window.innerWidth / 2) {
                        let dx = touch.clientX - joystickAim.startX;
                        let dy = touch.clientY - joystickAim.startY;
                        let dist = Math.hypot(dx, dy);
                        let maxDist = 40;
                        if (dist > maxDist) {
                            dx = (dx / dist) * maxDist;
                            dy = (dy / dist) * maxDist;
                        }
                        joystickAim.dx = dx / maxDist;
                        joystickAim.dy = dy / maxDist;
                        stickAim.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
                        mouse.down = dist > 10;
                    }
                }
            }, { passive: false });

            window.addEventListener('touchend', (e) => {
                if (e.touches.length === 0) {
                    joystickMove.active = false;
                    joystickMove.dx = 0;
                    joystickMove.dy = 0;
                    stickMove.style.transform = 'translate(-50%, -50%)';

                    joystickAim.active = false;
                    joystickAim.dx = 0;
                    joystickAim.dy = 0;
                    stickAim.style.transform = 'translate(-50%, -50%)';
                    mouse.down = false;
                }
            });

            // Right Joystick (Aim)
            elAim.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                const rect = elAim.getBoundingClientRect();
                joystickAim.active = true;
                joystickAim.startX = rect.left + rect.width / 2;
                joystickAim.startY = rect.top + rect.height / 2;
            });

            // Touch Action Buttons
            document.getElementById('btn-touch-dodge').addEventListener('click', () => player.dodge());
            document.getElementById('btn-touch-reload').addEventListener('click', () => player.reload());
            document.getElementById('btn-touch-switch').addEventListener('click', () => {
                const wKeys = Object.keys(WEAPONS);
                let idx = (wKeys.indexOf(player.currentWeaponKey) + 1) % wKeys.length;
                player.switchWeapon(wKeys[idx]);
            });
        }

        // =========================================================================
        // ENTITIES: Player, Bullet, Enemy, Particle, Powerup
        // =========================================================================

        class Player {
            constructor() {
                this.x = canvas.width / 2;
                this.y = canvas.height / 2;
                this.radius = 18;
                this.speed = 4.5;
                this.hp = 200;
                this.maxHp = 200;
                this.angle = 0;

                // Weapon state
                this.currentWeaponKey = 'pistol';
                this.weapon = { ...WEAPONS.pistol };
                this.clip = this.weapon.magSize;
                this.reserve = this.weapon.reserveAmmo;
                this.lastShotTime = 0;
                this.isReloading = false;
                this.reloadStartTime = 0;

                // Dodge Roll State
                this.isDodging = false;
                this.dodgeTimer = 0;
                this.dodgeDuration = 15; // frames
                this.dodgeCooldown = 0;
                this.dodgeMaxCooldown = 90; // frames (~1.5s)
                this.dodgeDir = { x: 0, y: 0 };
                this.ghostTrail = [];

                // Shield buff
                this.shield = 0;
            }

            reset() {
                this.x = canvas.width / 2;
                this.y = canvas.height / 2;
                this.hp = 200;
                this.maxHp = 200;
                this.currentWeaponKey = 'pistol';
                this.weapon = { ...WEAPONS.pistol };
                this.clip = this.weapon.magSize;
                this.reserve = this.weapon.reserveAmmo;
                this.isReloading = false;
                this.isDodging = false;
                this.dodgeCooldown = 0;
                this.ghostTrail = [];
                this.shield = 0;
            }

            switchWeapon(key) {
                if (this.currentWeaponKey === key || this.isDodging) return;
                this.currentWeaponKey = key;
                this.weapon = { ...WEAPONS[key] };
                this.clip = this.weapon.magSize;
                this.reserve = this.weapon.reserveAmmo;
                this.isReloading = false;
                audio.playReload();
                updateHUD();
            }

            reload() {
                if (this.isReloading || this.weapon.magSize === Infinity) return;
                if (this.clip >= this.weapon.magSize || this.reserve <= 0) return;

                this.isReloading = true;
                this.reloadStartTime = Date.now();
                audio.playReload();
                updateHUD();
            }

            dodge() {
                if (this.dodgeCooldown > 0 || this.isDodging) return;

                let moveX = 0;
                let moveY = 0;

                if (keys['KeyW'] || keys['ArrowUp']) moveY -= 1;
                if (keys['KeyS'] || keys['ArrowDown']) moveY += 1;
                if (keys['KeyA'] || keys['ArrowLeft']) moveX -= 1;
                if (keys['KeyD'] || keys['ArrowRight']) moveX += 1;

                if (joystickMove.active) {
                    moveX = joystickMove.dx;
                    moveY = joystickMove.dy;
                }

                if (moveX === 0 && moveY === 0) {
                    moveX = Math.cos(this.angle);
                    moveY = Math.sin(this.angle);
                }

                const len = Math.hypot(moveX, moveY);
                this.dodgeDir = { x: moveX / len, y: moveY / len };
                this.isDodging = true;
                this.dodgeTimer = this.dodgeDuration;
                this.dodgeCooldown = this.dodgeMaxCooldown;
            }

            update() {
                // Dodge cooldown ticker
                if (this.dodgeCooldown > 0) this.dodgeCooldown--;

                // Reload finish check
                if (this.isReloading) {
                    if (Date.now() - this.reloadStartTime >= this.weapon.reloadTime) {
                        const needed = this.weapon.magSize - this.clip;
                        const took = Math.min(needed, this.reserve);
                        this.clip += took;
                        if (this.weapon.reserveAmmo !== Infinity) {
                            this.reserve -= took;
                        }
                        this.isReloading = false;
                        updateHUD();
                    }
                }

                // Handle Dodge Movement
                if (this.isDodging) {
                    this.x += this.dodgeDir.x * (this.speed * 2.2);
                    this.y += this.dodgeDir.y * (this.speed * 2.2);

                    // Ghost Trail
                    if (this.dodgeTimer % 3 === 0) {
                        this.ghostTrail.push({ x: this.x, y: this.y, alpha: 0.6, angle: this.angle });
                    }

                    this.dodgeTimer--;
                    if (this.dodgeTimer <= 0) {
                        this.isDodging = false;
                    }
                } else {
                    // Normal Movement
                    let moveX = 0;
                    let moveY = 0;

                    if (keys['KeyW'] || keys['ArrowUp']) moveY -= 1;
                    if (keys['KeyS'] || keys['ArrowDown']) moveY += 1;
                    if (keys['KeyA'] || keys['ArrowLeft']) moveX -= 1;
                    if (keys['KeyD'] || keys['ArrowRight']) moveX += 1;

                    if (joystickMove.active) {
                        moveX = joystickMove.dx;
                        moveY = joystickMove.dy;
                    }

                    if (moveX !== 0 && moveY !== 0 && !joystickMove.active) {
                        moveX *= 0.7071;
                        moveY *= 0.7071;
                    }

                    this.x += moveX * this.speed;
                    this.y += moveY * this.speed;
                }

                // Boundary collision
                this.x = Math.max(this.radius, Math.min(canvas.width - this.radius, this.x));
                this.y = Math.max(this.radius, Math.min(canvas.height - this.radius, this.y));

                // Aim angle update
                if (joystickAim.active && (joystickAim.dx !== 0 || joystickAim.dy !== 0)) {
                    this.angle = Math.atan2(joystickAim.dy, joystickAim.dx);
                } else {
                    this.angle = Math.atan2(mouse.y - this.y, mouse.x - this.x);
                }

                // Update ghost trail alpha
                this.ghostTrail.forEach(g => g.alpha -= 0.04);
                this.ghostTrail = this.ghostTrail.filter(g => g.alpha > 0);

                // Auto/Semi Shooting Logic
                if (mouse.down && !this.isDodging) {
                    this.shoot();
                }
            }

            shoot() {
                const now = Date.now();
                if (now - this.lastShotTime < this.weapon.fireRate) return;
                if (this.isReloading) return;

                if (this.clip <= 0 && this.weapon.magSize !== Infinity) {
                    this.reload();
                    return;
                }

                this.lastShotTime = now;
                if (this.weapon.magSize !== Infinity) {
                    this.clip--;
                }

                // Sound Effect
                audio.playGunshot(this.currentWeaponKey);

                // Screen Shake
                triggerShake(this.currentWeaponKey === 'shotgun' ? 8 : 3, 6);

                // Muzzle position
                const gunLen = 22;
                const muzzleX = this.x + Math.cos(this.angle) * gunLen;
                const muzzleY = this.y + Math.sin(this.angle) * gunLen;

                // Muzzle Flash Particle
                createMuzzleFlash(muzzleX, muzzleY, this.angle);

                // Shell casing ejection
                createShellCasing(this.x, this.y, this.angle + Math.PI / 2);

                // Create Bullets
                for (let i = 0; i < this.weapon.pellets; i++) {
                    const spreadAngle = this.angle + (Math.random() - 0.5) * this.weapon.spread;
                    bullets.push(new Bullet(
                        muzzleX, muzzleY,
                        Math.cos(spreadAngle) * this.weapon.bulletSpeed,
                        Math.sin(spreadAngle) * this.weapon.bulletSpeed,
                        this.weapon.damage,
                        false,
                        this.weapon.color
                    ));
                }

                updateHUD();
            }

            takeDamage(amount) {
                if (this.isDodging) return; // Invulnerability frames

                if (this.shield > 0) {
                    this.shield -= amount;
                    if (this.shield < 0) {
                        this.hp += this.shield;
                        this.shield = 0;
                    }
                } else {
                    this.hp -= amount;
                }

                audio.playHurt();
                triggerShake(10, 10);

                if (this.hp <= 0) {
                    this.hp = 0;
                    gameOver();
                }
                updateHUD();
            }

            draw() {
                // Draw Ghost Trail
                this.ghostTrail.forEach(g => {
                    ctx.save();
                    ctx.translate(g.x, g.y);
                    ctx.rotate(g.angle);
                    ctx.globalAlpha = g.alpha;
                    ctx.fillStyle = '#00f3ff';
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });

                ctx.save();
                ctx.translate(this.x, this.y);

                // Draw Shield Glow if active
                if (this.shield > 0) {
                    ctx.strokeStyle = '#00f3ff';
                    ctx.lineWidth = 3;
                    ctx.shadowColor = '#00f3ff';
                    ctx.shadowBlur = 12;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius + 6, 0, Math.PI * 2);
                    ctx.stroke();
                }

                ctx.rotate(this.angle);

                // Gun Barrel
                ctx.fillStyle = '#475569';
                ctx.fillRect(0, -4, 24, 8);

                // Body
                ctx.fillStyle = this.isDodging ? '#38bdf8' : '#0284c7';
                ctx.shadowColor = '#00f3ff';
                ctx.shadowBlur = this.isDodging ? 20 : 10;
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fill();

                // Direction Indicator (Pointer Dot)
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(8, 0, 4, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        // Bullet Class
        class Bullet {
            constructor(x, y, vx, vy, damage, isEnemy = false, color = '#00f3ff') {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.damage = damage;
                this.isEnemy = isEnemy;
                this.color = color;
                this.radius = isEnemy ? 4 : 3;
                this.life = 120; // lifespan in frames
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;
            }

            draw() {
                ctx.save();
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Enemy Types & Class
        class Enemy {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type; // 'chaser', 'ranged', 'tank'

                if (type === 'chaser') {
                    this.radius = 16;
                    this.speed = 2.8 + Math.random() * 0.5;
                    this.hp = 40;
                    this.maxHp = 40;
                    this.color = '#ff0055';
                    this.scoreValue = 100;
                    this.damage = 15; // 傷害調降為 15
                } else if (type === 'ranged') {
                    this.radius = 18;
                    this.speed = 1.8;
                    this.hp = 60;
                    this.maxHp = 60;
                    this.color = '#a855f7';
                    this.scoreValue = 200;
                    this.damage = 10; // 傷害調降為 10
                    this.lastShot = Date.now();
                    this.fireRate = 2000;
                } else if (type === 'tank') {
                    this.radius = 26;
                    this.speed = 1.0;
                    this.hp = 220;
                    this.maxHp = 220;
                    this.color = '#eab308';
                    this.scoreValue = 350;
                    this.damage = 30; // 重裝兵傷害調降為 30
                }
            }

            update() {
                const angle = Math.atan2(player.y - this.y, player.x - this.x);
                const distToPlayer = Math.hypot(player.x - this.x, player.y - this.y);

                if (this.type === 'ranged') {
                    // Maintain distance
                    if (distToPlayer > 220) {
                        this.x += Math.cos(angle) * this.speed;
                        this.y += Math.sin(angle) * this.speed;
                    } else if (distToPlayer < 150) {
                        this.x -= Math.cos(angle) * this.speed;
                        this.y -= Math.sin(angle) * this.speed;
                    }

                    // Ranged attack
                    if (Date.now() - this.lastShot > this.fireRate) {
                        this.lastShot = Date.now();
                        bullets.push(new Bullet(
                            this.x, this.y,
                            Math.cos(angle) * 7,
                            Math.sin(angle) * 7,
                            this.damage,
                            true,
                            '#a855f7'
                        ));
                    }
                } else {
                    // Chase player directly
                    this.x += Math.cos(angle) * this.speed;
                    this.y += Math.sin(angle) * this.speed;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                // Body
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fill();

                // HP Bar above enemy
                if (this.hp < this.maxHp) {
                    ctx.fillStyle = 'rgba(0,0,0,0.6)';
                    ctx.fillRect(-15, -this.radius - 10, 30, 4);
                    ctx.fillStyle = '#22c55e';
                    ctx.fillRect(-15, -this.radius - 10, (this.hp / this.maxHp) * 30, 4);
                }

                ctx.restore();
            }
        }

        // Particle System
        class Particle {
            constructor(x, y, vx, vy, color, size, life, type = 'spark') {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.color = color;
                this.size = size;
                this.life = life;
                this.maxLife = life;
                this.type = type;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.96;
                this.vy *= 0.96;
                this.life--;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life / this.maxLife);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                if (this.type === 'shell') {
                    ctx.fillRect(this.x, this.y, this.size, this.size * 2);
                } else {
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        // Powerup / Item Drop
        class Powerup {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type; // 'health', 'ammo', 'shield'
                this.radius = 12;
                this.life = 600; // 10s timeout
            }

            update() {
                this.life--;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                let color = '#22c55e';
                let symbol = '+';
                if (this.type === 'ammo') { color = '#eab308'; symbol = 'A'; }
                if (this.type === 'shield') { color = '#00f3ff'; symbol = 'S'; }

                ctx.fillStyle = color;
                ctx.shadowColor = color;
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#000000';
                ctx.font = 'bold 12px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(symbol, 0, 1);

                ctx.restore();
            }
        }

        // Global Entity Collections
        let player = new Player();
        let bullets = [];
        let enemies = [];
        let particles = [];
        let powerups = [];

        function createMuzzleFlash(x, y, angle) {
            for (let i = 0; i < 6; i++) {
                const spread = angle + (Math.random() - 0.5) * 0.5;
                const speed = 3 + Math.random() * 4;
                particles.push(new Particle(
                    x, y,
                    Math.cos(spread) * speed,
                    Math.sin(spread) * speed,
                    '#ffea00',
                    3,
                    8
                ));
            }
        }

        function createShellCasing(x, y, angle) {
            particles.push(new Particle(
                x, y,
                Math.cos(angle) * (1 + Math.random()),
                Math.sin(angle) * (1 + Math.random()),
                '#d97706',
                2,
                40,
                'shell'
            ));
        }

        function createHitSparks(x, y, color) {
            for (let i = 0; i < 8; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 4;
                particles.push(new Particle(
                    x, y,
                    Math.cos(angle) * speed,
                    Math.sin(angle) * speed,
                    color,
                    2 + Math.random() * 2,
                    15
                ));
            }
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 24; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 6;
                particles.push(new Particle(
                    x, y,
                    Math.cos(angle) * speed,
                    Math.sin(angle) * speed,
                    color,
                    3 + Math.random() * 3,
                    30
                ));
            }
        }

        // =========================================================================
        // WAVE SPANWER
        // =========================================================================
        let waveEnemiesToSpawn = 0;
        let waveSpawnTimer = 0;

        function startNextWave() {
            waveEnemiesToSpawn = 8 + wave * 5;
            document.getElementById('wave-title').innerText = `WAVE ${wave}`;
        }

        function updateWaveSpawner() {
            if (waveEnemiesToSpawn > 0) {
                waveSpawnTimer++;
                if (waveSpawnTimer > 60) { // spawn roughly every second
                    waveSpawnTimer = 0;
                    waveEnemiesToSpawn--;

                    // Choose spawn position along boundary
                    let x, y;
                    if (Math.random() < 0.5) {
                        x = Math.random() < 0.5 ? -20 : canvas.width + 20;
                        y = Math.random() * canvas.height;
                    } else {
                        x = Math.random() * canvas.width;
                        y = Math.random() < 0.5 ? -20 : canvas.height + 20;
                    }

                    // Pick enemy type
                    let rand = Math.random();
                    let type = 'chaser';
                    if (wave >= 2 && rand > 0.6) type = 'ranged';
                    if (wave >= 3 && rand > 0.85) type = 'tank';

                    enemies.push(new Enemy(x, y, type));
                }
            } else if (enemies.length === 0) {
                // Wave cleared
                wave++;
                score += 500;
                audio.playPowerup();
                startNextWave();
            }
        }

        // =========================================================================
        // MAIN GAME UPDATE & COLLISION LOGIC
        // =========================================================================
        function updateGame() {
            if (gameState !== STATE.PLAYING) return;

            // Player Update
            player.update();

            // Wave Spawner Update
            updateWaveSpawner();

            // Bullets Update & Collision
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.update();

                // Out of screen or expired
                if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height || b.life <= 0) {
                    bullets.splice(i, 1);
                    continue;
                }

                // Enemy bullet vs Player
                if (b.isEnemy) {
                    const dist = Math.hypot(b.x - player.x, b.y - player.y);
                    if (dist < b.radius + player.radius) {
                        player.takeDamage(b.damage);
                        createHitSparks(b.x, b.y, '#ff0055');
                        bullets.splice(i, 1);
                        continue;
                    }
                } else {
                    // Player bullet vs Enemies
                    for (let j = enemies.length - 1; j >= 0; j--) {
                        const e = enemies[j];
                        const dist = Math.hypot(b.x - e.x, b.y - e.y);
                        if (dist < b.radius + e.radius) {
                            e.hp -= b.damage;
                            createHitSparks(b.x, b.y, e.color);
                            audio.playHit();

                            if (e.hp <= 0) {
                                // Enemy Killed
                                createExplosion(e.x, e.y, e.color);
                                audio.playExplosion();
                                score += e.scoreValue;

                                // Item Drop Chance (20%)
                                if (Math.random() < 0.20) {
                                    let types = ['health', 'ammo', 'shield'];
                                    let dropType = types[Math.floor(Math.random() * types.length)];
                                    powerups.push(new Powerup(e.x, e.y, dropType));
                                }

                                enemies.splice(j, 1);
                            }

                            bullets.splice(i, 1);
                            break;
                        }
                    }
                }
            }

            // Enemies Update & Collision with Player
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                e.update();

                // Melee damage to player
                const dist = Math.hypot(e.x - player.x, e.y - player.y);
                if (dist < e.radius + player.radius) {
                    player.takeDamage(e.damage);
                }
            }

            // Powerups Update & Pickup
            for (let i = powerups.length - 1; i >= 0; i--) {
                const p = powerups[i];
                p.update();

                if (p.life <= 0) {
                    powerups.splice(i, 1);
                    continue;
                }

                const dist = Math.hypot(p.x - player.x, p.y - player.y);
                if (dist < p.radius + player.radius) {
                    // Pickup powerup
                    audio.playPowerup();
                    if (p.type === 'health') {
                        player.hp = Math.min(player.maxHp, player.hp + 50);
                    } else if (p.type === 'ammo') {
                        if (player.weapon.reserveAmmo !== Infinity) {
                            player.reserve += player.weapon.magSize * 2;
                        }
                    } else if (p.type === 'shield') {
                        player.shield = 50;
                    }
                    updateHUD();
                    powerups.splice(i, 1);
                }
            }

            // Particles Update
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                if (particles[i].life <= 0) particles.splice(i, 1);
            }

            // Screen Shake Update
            if (shakeTime > 0) {
                shakeTime--;
            }
        }

        // =========================================================================
        // RENDERING SYSTEM
        // =========================================================================
        function drawBackground() {
            ctx.fillStyle = '#0a0c14';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Cyberpunk Grid
            ctx.strokeStyle = 'rgba(0, 243, 255, 0.04)';
            ctx.lineWidth = 1;

            const gridSize = 50;
            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
        }

        function render() {
            ctx.save();

            // Apply Screen Shake Camera Translation
            if (shakeTime > 0) {
                const dx = (Math.random() - 0.5) * shakeIntensity;
                const dy = (Math.random() - 0.5) * shakeIntensity;
                ctx.translate(dx, dy);
            }

            // Clear & Grid BG
            drawBackground();

            // Draw Powerups
            powerups.forEach(p => p.draw());

            // Draw Particles
            particles.forEach(p => p.draw());

            // Draw Bullets
            bullets.forEach(b => b.draw());

            // Draw Enemies
            enemies.forEach(e => e.draw());

            // Draw Player
            if (gameState === STATE.PLAYING || gameState === STATE.PAUSED) {
                player.draw();
            }

            ctx.restore();
        }

        // Main Game Loop
        function gameLoop() {
            updateGame();
            render();
            requestAnimationFrame(gameLoop);
        }

        // =========================================================================
        // HUD & GAME STATE MANAGERS
        // =========================================================================
        function updateHUD() {
            // HP Bar
            const hpBar = document.getElementById('hp-bar');
            const hpText = document.getElementById('hp-text');
            const hpPercent = Math.max(0, (player.hp / player.maxHp) * 100);
            hpBar.style.width = `${hpPercent}%`;
            hpText.innerText = `${Math.ceil(player.hp)} / ${player.maxHp}`;

            // Dodge Bar
            const dodgeBar = document.getElementById('dodge-bar');
            const dodgePercent = Math.max(0, 100 - (player.dodgeCooldown / player.dodgeMaxCooldown) * 100);
            dodgeBar.style.width = `${dodgePercent}%`;

            // Weapon & Ammo
            document.getElementById('weapon-name').innerText = player.weapon.name;
            const ammoClip = document.getElementById('ammo-clip');
            const ammoReserve = document.getElementById('ammo-reserve');
            const reloadPrompt = document.getElementById('reload-prompt');

            if (player.isReloading) {
                ammoClip.innerText = 'RELOADING...';
                ammoReserve.innerText = '';
                reloadPrompt.classList.add('hidden');
            } else {
                ammoClip.innerText = player.weapon.magSize === Infinity ? '∞' : player.clip;
                ammoReserve.innerText = player.weapon.reserveAmmo === Infinity ? '/ ∞' : `/ ${player.reserve}`;

                if (player.clip === 0 && player.weapon.magSize !== Infinity) {
                    reloadPrompt.classList.remove('hidden');
                } else {
                    reloadPrompt.classList.add('hidden');
                }
            }

            // Score
            document.getElementById('score-text').innerText = `SCORE: ${score.toString().padStart(5, '0')}`;
        }

        function startGame() {
            audio.init();
            score = 0;
            wave = 1;
            bullets = [];
            enemies = [];
            particles = [];
            powerups = [];
            player.reset();

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('pause-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');

            gameState = STATE.PLAYING;
            startNextWave();
            updateHUD();
        }

        function togglePause() {
            if (gameState === STATE.PLAYING) {
                gameState = STATE.PAUSED;
                document.getElementById('pause-screen').classList.remove('hidden');
            } else if (gameState === STATE.PAUSED) {
                gameState = STATE.PLAYING;
                document.getElementById('pause-screen').classList.add('hidden');
            }
        }

        function gameOver() {
            gameState = STATE.GAMEOVER;
            audio.playExplosion();

            if (score > highscore) {
                highscore = score;
                localStorage.setItem('neon_shooter_highscore', highscore.toString());
            }

            document.getElementById('go-wave').innerText = `Wave ${wave}`;
            document.getElementById('go-score').innerText = score;
            document.getElementById('go-highscore').innerText = highscore;

            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
        }

        // UI Event Listeners
        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);
        document.getElementById('resume-btn').addEventListener('click', togglePause);
        document.getElementById('restart-from-pause-btn').addEventListener('click', startGame);

        // Window Load Initialization
        window.onload = function() {
            setupTouchControls();
            gameLoop();
        };
    </script>
</body>

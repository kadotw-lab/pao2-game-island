<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>佩佩豬吃泥巴貪吃蛇多人連線大亂鬥</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Noto+Sans+TC:wght@500;700;900&display=swap');

        body {
            font-family: 'Fredoka One', 'Noto Sans TC', sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            background-color: #72c082;
        }

        canvas#gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background-color: #88d498;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.90);
            backdrop-filter: blur(10px);
            border: 3px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        .btn-peppa {
            background: linear-gradient(180deg, #ff6b8b 0%, #e63956 100%);
            box-shadow: 0 6px 0 #b32038, 0 10px 20px rgba(0,0,0,0.2);
            transition: all 0.1s ease;
        }
        .btn-peppa:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #b32038, 0 4px 10px rgba(0,0,0,0.2);
        }

        .btn-green {
            background: linear-gradient(180deg, #4caf50 0%, #2e7d32 100%);
            box-shadow: 0 6px 0 #1b5e20, 0 10px 20px rgba(0,0,0,0.2);
        }
        .btn-green:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #1b5e20, 0 4px 10px rgba(0,0,0,0.2);
        }

        .btn-blue {
            background: linear-gradient(180deg, #42a5f5 0%, #1565c0 100%);
            box-shadow: 0 6px 0 #0d47a1, 0 10px 20px rgba(0,0,0,0.2);
        }
        .btn-blue:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #0d47a1, 0 4px 10px rgba(0,0,0,0.2);
        }

        @keyframes pulse-light {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }
        .animate-bounce-slow {
            animation: pulse-light 2s infinite ease-in-out;
        }

        .touch-zone {
            touch-action: none;
        }
    </style>
</head>
<body class="w-screen h-screen m-0 p-0 overflow-hidden relative select-none">

    <!-- Firebase SDK Imports -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, updateDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase mandatory app configuration variables
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'peppa-pig-snake-multiplayer';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;

        let db = null;
        let auth = null;
        let currentUser = null;
        let currentUserId = `user_${Math.floor(Math.random()*1000000)}`;
        let isOnlineMode = false;

        // Sync control timers
        let currentRoomId = "PEPPA888";
        let syncInterval = null;
        let remotePlayers = new Map(); // Map<uid, RemoteSnake>
        let roomPlayersUnsubscribe = null;

        const WORLD_SIZE = 3200;
        const INITIAL_SNAKE_LENGTH = 15;
        const BASE_SPEED = 3.6;
        const BOOST_SPEED_MULT = 1.6;
        const SENSITIVITY = 0.13;

        const STATES = { START: 0, PLAYING: 1, PAUSED: 2, GAMEOVER: 3 };
        let gameState = STATES.START;

        let canvas, ctx, minimapCanvas, minimapCtx;
        let camera = { x: WORLD_SIZE / 2, y: WORLD_SIZE / 2 };
        let lastTime = 0;
        let isMobile = false;

        let playerSnake = null;
        let aiSnakes = [];
        let mudPuddles = [];
        let particles = [];
        let selectedSkinIndex = 0;

        let mousePos = { x: 0, y: 0 };
        let joystickActive = false;
        let joystickVector = { x: 0, y: 0 };
        let soundEnabled = true;

        /* PEPPA PIG CHARACTERS CONFIG */
        const CHARACTERS = [
            { name: "佩佩 Peppa", avatar: "🐷", skinColor: "#FFB6C1", shirtColor: "#E53935", snoutColor: "#FF8DA1", earsColor: "#FFB6C1" },
            { name: "喬治 George", avatar: "🐽", skinColor: "#FFB6C1", shirtColor: "#1E88E5", snoutColor: "#FF8DA1", earsColor: "#FFB6C1" },
            { name: "蘇西 Suzy", avatar: "🐑", skinColor: "#FFFFFF", shirtColor: "#F48FB1", snoutColor: "#FFC1CC", earsColor: "#FFFFFF" },
            { name: "佩德羅 Pedro", avatar: "🐴", skinColor: "#D7CCC8", shirtColor: "#FBC02D", snoutColor: "#BCAAA4", earsColor: "#D7CCC8" },
            { name: "蕾貝卡 Rebecca", avatar: "🐰", skinColor: "#FFFFFF", shirtColor: "#FB8C00", snoutColor: "#FFCDD2", earsColor: "#FFFFFF" },
            { name: "丹尼 Danny", avatar: "🐶", skinColor: "#A1887F", shirtColor: "#43A047", snoutColor: "#8D6E63", earsColor: "#A1887F" },
            { name: "柔伊 Zoe", avatar: "🐘", skinColor: "#CFD8DC", shirtColor: "#8E24AA", snoutColor: "#B0BEC5", earsColor: "#CFD8DC" },
            { name: "坎蒂 Candy", avatar: "🐱", skinColor: "#FFE082", shirtColor: "#00ACC1", snoutColor: "#FFD54F", earsColor: "#FFE082" }
        ];

        class SoundSystem {
            constructor() { this.ctx = null; }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playEat() {
                if (!soundEnabled || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(220, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(550, this.ctx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(); osc.stop(this.ctx.currentTime + 0.08);
                } catch(e){}
            }

            playOink() {
                if (!soundEnabled || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    const now = this.ctx.currentTime;
                    osc.frequency.setValueAtTime(280, now);
                    osc.frequency.linearRampToValueAtTime(180, now + 0.12);
                    osc.frequency.linearRampToValueAtTime(230, now + 0.22);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(); osc.stop(now + 0.22);
                } catch(e){}
            }

            playDeath() {
                if (!soundEnabled || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    const now = this.ctx.currentTime;
                    osc.frequency.setValueAtTime(320, now);
                    osc.frequency.exponentialRampToValueAtTime(40, now + 0.35);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(); osc.stop(now + 0.35);
                } catch(e){}
            }
        }
        const audioSys = new SoundSystem();

        class MudPuddle {
            constructor(x, y, radius, isFromDeath = false) {
                this.x = x; this.y = y; this.radius = radius;
                this.scoreValue = Math.floor(radius * 1.5);
                this.isFromDeath = isFromDeath;
                this.points = [];
                const numPoints = 8;
                for (let i = 0; i < numPoints; i++) {
                    const angle = (i / numPoints) * Math.PI * 2;
                    const variation = 0.8 + Math.random() * 0.4;
                    this.points.push({
                        x: Math.cos(angle) * this.radius * variation,
                        y: Math.sin(angle) * this.radius * variation
                    });
                }
                this.color = isFromDeath ? "#5d4037" : "#795548";
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.beginPath();
                ctx.fillStyle = this.color;
                ctx.moveTo(this.points[0].x, this.points[0].y);
                for (let i = 1; i < this.points.length; i++) {
                    const p1 = this.points[i];
                    const p2 = this.points[(i + 1) % this.points.length];
                    const midX = (p1.x + p2.x) / 2;
                    const midY = (p1.y + p2.y) / 2;
                    ctx.quadraticCurveTo(p1.x, p1.y, midX, midY);
                }
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = "rgba(255, 255, 255, 0.25)";
                ctx.beginPath();
                ctx.arc(-this.radius * 0.3, -this.radius * 0.3, this.radius * 0.25, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y;
                this.vx = (Math.random() - 0.5) * 6;
                this.vy = (Math.random() - 0.5) * 6;
                this.radius = Math.random() * 4 + 2;
                this.color = color;
                this.alpha = 1;
                this.decay = Math.random() * 0.03 + 0.02;
            }

            update() {
                this.x += this.vx; this.y += this.vy;
                this.alpha -= this.decay;
            }

            draw(ctx) {
                if (this.alpha <= 0) return;
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class Snake {
            constructor(id, name, x, y, charConfig, isAI = false) {
                this.id = id;
                this.name = name;
                this.charConfig = charConfig;
                this.isAI = isAI;

                this.x = x;
                this.y = y;
                this.angle = Math.random() * Math.PI * 2;
                this.targetAngle = this.angle;
                this.speed = BASE_SPEED;
                this.isBoosting = false;

                this.score = 0;
                this.nodeRadius = 14;
                this.spacing = 10;
                this.dead = false;

                this.body = [];
                for (let i = 0; i < INITIAL_SNAKE_LENGTH; i++) {
                    this.body.push({ x: x - i * this.spacing, y: y });
                }

                this.aiTargetTimer = 0;
            }

            update() {
                if (this.dead) return;

                let currentSpeed = this.isBoosting ? BASE_SPEED * BOOST_SPEED_MULT : BASE_SPEED;

                if (this.isBoosting && this.body.length > 8) {
                    if (Math.random() < 0.15) {
                        const tail = this.body[this.body.length - 1];
                        mudPuddles.push(new MudPuddle(tail.x, tail.y, 6));
                        this.body.pop();
                    }
                }

                let diff = this.targetAngle - this.angle;
                while (diff < -Math.PI) diff += Math.PI * 2;
                while (diff > Math.PI) diff -= Math.PI * 2;
                this.angle += diff * SENSITIVITY;

                this.x += Math.cos(this.angle) * currentSpeed;
                this.y += Math.sin(this.angle) * currentSpeed;

                if (this.x < 30 || this.x > WORLD_SIZE - 30 || this.y < 30 || this.y > WORLD_SIZE - 30) {
                    this.die("撞到了大草原欄桿邊界！");
                    return;
                }

                this.body[0] = { x: this.x, y: this.y };
                for (let i = 1; i < this.body.length; i++) {
                    const prev = this.body[i - 1];
                    const curr = this.body[i];
                    const dx = prev.x - curr.x;
                    const dy = prev.y - curr.y;
                    const dist = Math.hypot(dx, dy);

                    if (dist > this.spacing) {
                        const angle = Math.atan2(dy, dx);
                        curr.x = prev.x - Math.cos(angle) * this.spacing;
                        curr.y = prev.y - Math.sin(angle) * this.spacing;
                    }
                }

                if (this.isAI) this.updateAILogic();
            }

            updateAILogic() {
                this.aiTargetTimer++;
                if (this.aiTargetTimer % 6 === 0) {
                    let nearestFood = null;
                    let minDist = 350;

                    for (let puddle of mudPuddles) {
                        const dist = Math.hypot(puddle.x - this.x, puddle.y - this.y);
                        if (dist < minDist) {
                            minDist = dist; nearestFood = puddle;
                        }
                    }

                    if (nearestFood) {
                        this.targetAngle = Math.atan2(nearestFood.y - this.y, nearestFood.x - this.x);
                    } else if (Math.random() < 0.08) {
                        this.targetAngle += (Math.random() - 0.5) * 1.5;
                    }

                    const avoidDistance = 75;
                    let danger = false;

                    if (this.x < avoidDistance) { this.targetAngle = 0; danger = true; }
                    else if (this.x > WORLD_SIZE - avoidDistance) { this.targetAngle = Math.PI; danger = true; }
                    if (this.y < avoidDistance) { this.targetAngle = Math.PI / 2; danger = true; }
                    else if (this.y > WORLD_SIZE - avoidDistance) { this.targetAngle = -Math.PI / 2; danger = true; }

                    if (!danger) {
                        const allSnakes = [playerSnake, ...Array.from(remotePlayers.values()), ...aiSnakes];
                        for (let other of allSnakes) {
                            if (!other || other.dead || other.id === this.id) continue;
                            for (let seg of other.body) {
                                const d = Math.hypot(seg.x - this.x, seg.y - this.y);
                                if (d < avoidDistance) {
                                    this.targetAngle = Math.atan2(this.y - seg.y, this.x - seg.x);
                                    danger = true;
                                    break;
                                }
                            }
                        }
                    }
                    this.isBoosting = (!danger && nearestFood && minDist < 120 && this.body.length > 10 && Math.random() < 0.2);
                }
            }

            grow(amount) {
                this.score += amount;
                const newSegments = Math.floor(amount / 8);
                const last = this.body[this.body.length - 1];
                for (let i = 0; i < newSegments; i++) {
                    this.body.push({ x: last.x, y: last.y });
                }
            }

            die(reason = "") {
                if (this.dead) return;
                this.dead = true;

                for (let i = 0; i < this.body.length; i += 2) {
                    const seg = this.body[i];
                    mudPuddles.push(new MudPuddle(seg.x + (Math.random() - 0.5) * 10, seg.y + (Math.random() - 0.5) * 10, Math.random() * 6 + 10, true));
                    for (let p = 0; p < 3; p++) {
                        particles.push(new Particle(seg.x, seg.y, "#795548"));
                    }
                }

                if (this.id === "local_player") {
                    audioSys.playDeath();
                    triggerGameOver(reason);
                    if (isOnlineMode) pushPlayerStateToFirebase(true);
                } else {
                    audioSys.playEat();
                }
            }

            draw(ctx) {
                if (this.dead || !this.body || this.body.length === 0) return;

                // Body Segments
                for (let i = this.body.length - 1; i >= 1; i--) {
                    const seg = this.body[i];
                    ctx.save();
                    ctx.translate(seg.x, seg.y);
                    ctx.fillStyle = this.charConfig.shirtColor;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.nodeRadius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = "rgba(0,0,0,0.12)";
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.restore();
                }

                // Head Node
                const head = this.body[0];
                ctx.save();
                ctx.translate(head.x, head.y);
                ctx.rotate(this.angle);

                // Ears
                ctx.fillStyle = this.charConfig.earsColor;
                ctx.beginPath();
                ctx.ellipse(-2, -14, 6, 10, -Math.PI / 6, 0, Math.PI * 2);
                ctx.ellipse(-2, 14, 6, 10, Math.PI / 6, 0, Math.PI * 2);
                ctx.fill();

                // Main Head
                ctx.fillStyle = this.charConfig.skinColor;
                ctx.beginPath();
                ctx.arc(0, 0, this.nodeRadius + 2, 0, Math.PI * 2);
                ctx.fill();

                // Snout
                ctx.fillStyle = this.charConfig.snoutColor;
                ctx.beginPath();
                ctx.ellipse(12, 0, 7, 10, 0, 0, Math.PI * 2);
                ctx.fill();

                // Nostrils
                ctx.fillStyle = "#E53935";
                ctx.beginPath();
                ctx.arc(13, -3, 1.8, 0, Math.PI * 2);
                ctx.arc(13, 3, 1.8, 0, Math.PI * 2);
                ctx.fill();

                // Eyes & Pupils
                ctx.fillStyle = "#FFFFFF";
                ctx.beginPath();
                ctx.arc(4, -7, 4.5, 0, Math.PI * 2);
                ctx.arc(4, 7, 4.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = "#000000";
                ctx.beginPath();
                ctx.arc(5, -7, 2, 0, Math.PI * 2);
                ctx.arc(5, 7, 2, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();

                // Name Plate & Online Indicator
                ctx.save();
                ctx.font = "bold 12px 'Noto Sans TC', sans-serif";
                ctx.fillStyle = "#ffffff";
                ctx.shadowColor = "rgba(0,0,0,0.7)";
                ctx.shadowBlur = 4;
                ctx.textAlign = "center";
                const isLocal = this.id === "local_player";
                const tag = isLocal ? " (你)" : (this.isAI ? " [AI]" : " [線上]");
                ctx.fillText(`${this.charConfig.avatar || "🐷"} ${this.name}${tag}`, head.x, head.y - 22);
                ctx.restore();
            }
        }

        /* Remote Snake Representation for Interpolated Multiplayer Sync */
        class RemoteSnake extends Snake {
            constructor(id, name, x, y, charConfig) {
                super(id, name, x, y, charConfig, false);
                this.targetX = x;
                this.targetY = y;
                this.lastUpdate = Date.now();
            }

            updateFromNetwork(data) {
                if (!data) return;
                this.targetX = data.x;
                this.targetY = data.y;
                this.targetAngle = data.angle;
                this.score = data.score || 0;
                this.isBoosting = data.isBoosting || false;
                this.dead = data.dead || false;

                if (data.body && Array.isArray(data.body)) {
                    this.body = data.body;
                }
                this.lastUpdate = Date.now();
            }

            updateInterpolation() {
                if (this.dead) return;
                // Smooth movement towards latest network state
                this.x += (this.targetX - this.x) * 0.25;
                this.y += (this.targetY - this.y) * 0.25;
                let diff = this.targetAngle - this.angle;
                while (diff < -Math.PI) diff += Math.PI * 2;
                while (diff > Math.PI) diff -= Math.PI * 2;
                this.angle += diff * 0.25;

                if (this.body && this.body.length > 0) {
                    this.body[0] = { x: this.x, y: this.y };
                }
            }
        }

        async function setupFirebaseMultiplayer() {
            if (!firebaseConfig) {
                console.warn("Firebase Config not supplied. Defaulting to local offline room.");
                document.getElementById('displayUserId').innerText = currentUserId + " (離線模式)";
                return false;
            }

            try {
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    const userCred = await signInWithCustomToken(auth, __initial_auth_token);
                    currentUser = userCred.user;
                } else {
                    const userCred = await signInAnonymously(auth);
                    currentUser = userCred.user;
                }
                currentUserId = currentUser.uid;
                document.getElementById('displayUserId').innerText = currentUserId;
                return true;
            } catch (err) {
                console.error("Firebase Auth error:", err);
                document.getElementById('displayUserId').innerText = currentUserId + " (連線失敗)";
                return false;
            }
        }

        function joinMultiplayerRoom(roomId) {
            if (!db || !currentUser) return;
            currentRoomId = roomId.trim().toUpperCase() || "PEPPA888";
            document.getElementById('roomCodeDisplay').innerText = `房間: ${currentRoomId}`;

            if (roomPlayersUnsubscribe) roomPlayersUnsubscribe();

            // Firestore Path format: /artifacts/{appId}/public/data/players
            // Querying all player documents for the current room
            const playersColRef = collection(db, 'artifacts', appId, 'public', 'data', 'players');

            roomPlayersUnsubscribe = onSnapshot(playersColRef, (snapshot) => {
                const now = Date.now();
                const activeInRoom = [];

                snapshot.docs.forEach(docSnap => {
                    const data = docSnap.data();
                    if (!data || data.roomId !== currentRoomId) return;

                    // Filter out stale / inactive network players (>10 sec timeout)
                    if (now - (data.lastSeen || 0) > 10000) return;

                    const uid = data.uid;
                    if (uid === currentUserId) return; // Skip local player

                    activeInRoom.push(uid);

                    let remoteSnake = remotePlayers.get(uid);
                    if (!remoteSnake) {
                        const charConfig = CHARACTERS[data.skinIndex || 0] || CHARACTERS[0];
                        remoteSnake = new RemoteSnake(uid, data.name || "線上玩家", data.x || 500, data.y || 500, charConfig);
                        remotePlayers.set(uid, remoteSnake);
                    }
                    remoteSnake.updateFromNetwork(data);
                });

                // Remove disconnected snakes
                for (let [uid, snake] of remotePlayers.entries()) {
                    if (!activeInRoom.includes(uid)) {
                        remotePlayers.delete(uid);
                    }
                }

                document.getElementById('onlineStatusText').innerText = `👥 在線玩家: ${remotePlayers.size + 1} 人`;
            }, (error) => {
                console.error("Firestore Multiplayer listen error:", error);
            });

            // Start periodic position push to room (~100ms)
            if (syncInterval) clearInterval(syncInterval);
            syncInterval = setInterval(() => {
                if (gameState === STATES.PLAYING && playerSnake) {
                    pushPlayerStateToFirebase(playerSnake.dead);
                }
            }, 100);
        }

        async function pushPlayerStateToFirebase(isDead = false) {
            if (!db || !currentUser || !playerSnake) return;

            // Strict flat public collection path according to Mandatory Rule 1
            const playerDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'players', `${currentRoomId}_${currentUserId}`);

            // Compress body array to save network bandwidth
            const simplifiedBody = playerSnake.body.slice(0, 30).map(p => ({ x: Math.round(p.x), y: Math.round(p.y) }));

            try {
                await setDoc(playerDocRef, {
                    uid: currentUserId,
                    roomId: currentRoomId,
                    name: playerSnake.name,
                    skinIndex: selectedSkinIndex,
                    x: Math.round(playerSnake.x),
                    y: Math.round(playerSnake.y),
                    angle: Number(playerSnake.angle.toFixed(2)),
                    score: playerSnake.score,
                    isBoosting: playerSnake.isBoosting,
                    dead: isDead,
                    body: simplifiedBody,
                    lastSeen: Date.now()
                }, { merge: true });
            } catch(e) {
                console.warn("Push player state error:", e);
            }
        }

        function handleTouchJoystick(touch) {
            const rect = document.getElementById('joystickZone').getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            let dx = touch.clientX - centerX;
            let dy = touch.clientY - centerY;
            const maxRadius = rect.width / 2 - 20;
            const dist = Math.hypot(dx, dy);

            if (dist > maxRadius) {
                dx = (dx / dist) * maxRadius;
                dy = (dy / dist) * maxRadius;
            }

            document.getElementById('joystickKnob').style.transform = `translate(${dx}px, ${dy}px)`;
            if (playerSnake && dist > 5) {
                playerSnake.targetAngle = Math.atan2(dy, dx);
            }
        }

        function checkCollisions() {
            const allLocalSnakes = [playerSnake, ...aiSnakes].filter(s => s && !s.dead);
            const allSnakesForCollision = [...allLocalSnakes, ...Array.from(remotePlayers.values()).filter(s => !s.dead)];

            for (let snake of allLocalSnakes) {
                const head = snake.body[0];

                // Eating Mud Puddles
                for (let i = mudPuddles.length - 1; i >= 0; i--) {
                    const puddle = mudPuddles[i];
                    const dist = Math.hypot(head.x - puddle.x, head.y - puddle.y);

                    if (dist < snake.nodeRadius + puddle.radius) {
                        snake.grow(puddle.scoreValue);
                        for (let p = 0; p < 4; p++) {
                            particles.push(new Particle(puddle.x, puddle.y, puddle.color));
                        }
                        if (snake.id === "local_player") audioSys.playEat();
                        mudPuddles.splice(i, 1);
                        spawnRandomMudPuddle();
                    }
                }

                // Head-to-Body Collision with Other Snakes
                for (let other of allSnakesForCollision) {
                    if (!other.body) continue;
                    for (let j = 0; j < other.body.length; j++) {
                        if (snake.id === other.id && j < 3) continue;

                        const seg = other.body[j];
                        const dist = Math.hypot(head.x - seg.x, head.y - seg.y);

                        if (dist < snake.nodeRadius + 6) {
                            snake.die(`被 ${other.name} 淘汰了！`);
                            break;
                        }
                    }
                    if (snake.dead) break;
                }
            }

            // Respawn AI Snakes
            for (let i = 0; i < aiSnakes.length; i++) {
                if (aiSnakes[i].dead) {
                    const aiSkin = CHARACTERS[(i + 1) % CHARACTERS.length];
                    const spawnX = Math.random() * (WORLD_SIZE - 400) + 200;
                    const spawnY = Math.random() * (WORLD_SIZE - 400) + 200;
                    aiSnakes[i] = new Snake(`ai_${i}`, aiSkin.name, spawnX, spawnY, aiSkin, true);
                }
            }
        }

        function drawBackground() {
            ctx.fillStyle = "#88d498";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = "rgba(0, 0, 0, 0.04)";
            ctx.lineWidth = 2;
            const gridSize = 100;

            const startX = Math.floor((camera.x - canvas.width / 2) / gridSize) * gridSize;
            const startY = Math.floor((camera.y - canvas.height / 2) / gridSize) * gridSize;

            for (let x = startX; x < camera.x + canvas.width; x += gridSize) {
                const screenX = x - camera.x + canvas.width / 2;
                ctx.beginPath(); ctx.moveTo(screenX, 0); ctx.lineTo(screenX, canvas.height); ctx.stroke();
            }

            for (let y = startY; y < camera.y + canvas.height; y += gridSize) {
                const screenY = y - camera.y + canvas.height / 2;
                ctx.beginPath(); ctx.moveTo(0, screenY); ctx.lineTo(canvas.width, screenY); ctx.stroke();
            }

            // Red Map Bounds Fence
            ctx.strokeStyle = "#e53935";
            ctx.lineWidth = 10;
            ctx.strokeRect(-camera.x + canvas.width / 2, -camera.y + canvas.height / 2, WORLD_SIZE, WORLD_SIZE);
        }

        function drawMinimap() {
            minimapCtx.clearRect(0, 0, minimapCanvas.width, minimapCanvas.height);
            const scale = minimapCanvas.width / WORLD_SIZE;

            // Mud Puddles on Minimap
            minimapCtx.fillStyle = "#795548";
            for (let puddle of mudPuddles) {
                minimapCtx.fillRect(puddle.x * scale, puddle.y * scale, 1.5, 1.5);
            }

            // Remote Online Players (Blue)
            minimapCtx.fillStyle = "#29b6f6";
            for (let remote of remotePlayers.values()) {
                if (!remote.dead) {
                    minimapCtx.beginPath();
                    minimapCtx.arc(remote.x * scale, remote.y * scale, 2.5, 0, Math.PI * 2);
                    minimapCtx.fill();
                }
            }

            // Local Player (Red)
            if (playerSnake && !playerSnake.dead) {
                minimapCtx.fillStyle = "#e53935";
                minimapCtx.beginPath();
                minimapCtx.arc(playerSnake.x * scale, playerSnake.y * scale, 3.5, 0, Math.PI * 2);
                minimapCtx.fill();
            }
        }

        function updateHUD() {
            if (!playerSnake) return;

            document.getElementById('hudScore').innerText = `分數: ${playerSnake.score}`;
            document.getElementById('hudLength').innerText = playerSnake.body.length;

            const allActive = [playerSnake, ...Array.from(remotePlayers.values()), ...aiSnakes].filter(s => s && !s.dead);
            allActive.sort((a, b) => b.score - a.score);

            const leaderboardList = document.getElementById('leaderboardList');
            leaderboardList.innerHTML = '';

            allActive.slice(0, 5).forEach((snake, index) => {
                const item = document.createElement('div');
                const isLocal = snake.id === 'local_player';
                const isRemote = snake instanceof RemoteSnake;
                item.className = `flex justify-between items-center ${isLocal ? 'text-rose-600 font-black' : (isRemote ? 'text-blue-700 font-bold' : 'text-gray-700')}`;
                item.innerHTML = `
                    <span class="truncate max-w-[100px]">${index + 1}. ${snake.charConfig.avatar || "🐷"} ${snake.name}</span>
                    <span>${snake.score}</span>
                `;
                leaderboardList.appendChild(item);
            });
        }

        function gameLoop(timestamp) {
            const deltaTime = timestamp - lastTime;
            lastTime = timestamp;

            if (gameState === STATES.PLAYING) {
                if (playerSnake && !playerSnake.dead) {
                    playerSnake.update();
                    camera.x = playerSnake.x;
                    camera.y = playerSnake.y;
                }

                // Update Remote Players Smooth Interpolation
                for (let remote of remotePlayers.values()) {
                    remote.updateInterpolation();
                }

                // Update AI Snakes
                for (let ai of aiSnakes) {
                    ai.update();
                }

                for (let i = particles.length - 1; i >= 0; i--) {
                    particles[i].update();
                    if (particles[i].alpha <= 0) particles.splice(i, 1);
                }

                checkCollisions();
                updateHUD();
            }

            // Render Frame
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();

            drawBackground();
            ctx.translate(-camera.x + canvas.width / 2, -camera.y + canvas.height / 2);

            // Draw Mud Puddles
            for (let puddle of mudPuddles) {
                if (Math.abs(puddle.x - camera.x) < canvas.width / 2 + 100 &&
                    Math.abs(puddle.y - camera.y) < canvas.height / 2 + 100) {
                    puddle.draw(ctx);
                }
            }

            // Draw Remote Players
            for (let remote of remotePlayers.values()) {
                remote.draw(ctx);
            }

            // Draw AI Snakes
            for (let ai of aiSnakes) {
                ai.draw(ctx);
            }

            // Draw Local Player
            if (playerSnake) playerSnake.draw(ctx);

            // Draw Particles
            for (let particle of particles) {
                particle.draw(ctx);
            }

            ctx.restore();

            drawMinimap();
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>

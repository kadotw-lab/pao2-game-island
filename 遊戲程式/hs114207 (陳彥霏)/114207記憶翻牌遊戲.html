<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>數字卡牌記憶遊戲 | Memory Number Matching Game</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 60%, #020617 100%);
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            color: #f8fafc;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            overflow-x: hidden;
        }

        .font-mono-num {
            font-family: 'JetBrains Mono', monospace;
        }

        /* 3D Card Flip Perspective & Transforms */
        .perspective-1000 {
            perspective: 1000px;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .card-container.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }

        /* Card Back (Hidden pattern state) */
        .card-back {
            background: linear-gradient(135deg, #312e81 0%, #1e1b4b 100%);
            border: 2px solid rgba(99, 102, 241, 0.3);
            transition: border-color 0.3s, transform 0.2s, box-shadow 0.3s;
        }

        .card-container:hover .card-back {
            border-color: rgba(129, 140, 248, 0.8);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
        }

        /* Card Front (Revealed number state) */
        .card-front {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 2px solid #6366f1;
            transform: rotateY(180deg);
        }

        /* Card Matched State */
        .card-container.matched .card-front {
            background: linear-gradient(135deg, #065f46 0%, #022c22 100%);
            border-color: #10b981;
            animation: matchPulse 0.6s ease-out;
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.5);
        }

        /* Card Mismatch Shake Animation */
        .card-container.mismatch .card-inner {
            animation: shake 0.5s ease-in-out;
        }

        @keyframes matchPulse {
            0% { transform: rotateY(180deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.08); }
            100% { transform: rotateY(180deg) scale(1); }
        }

        @keyframes shake {
            0%, 100% { transform: rotateY(180deg) translateX(0); }
            20% { transform: rotateY(180deg) translateX(-6px); }
            40% { transform: rotateY(180deg) translateX(6px); }
            60% { transform: rotateY(180deg) translateX(-4px); }
            80% { transform: rotateY(180deg) translateX(4px); }
        }

        /* Glassmorphism Panel */
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Confetti Overlay Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 50;
        }
    </style>
</head>
<body class="flex flex-col justify-between items-center min-h-screen p-4 md:p-6">

    <script>
        /**
         * Native Web Audio API Sound Synthesizer
         * Generates pure audio waves without external audio dependencies.
         */
        class SoundEffects {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                        this.ctx = new AudioContext();
                    }
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playFlip() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(320, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(640, this.ctx.currentTime + 0.08);

                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            }

            playMatch() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;

                // Play a pleasant 3-note harmonic arpeggio (C5, E5, G5)
                const notes = [523.25, 659.25, 783.99];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.08);

                    gain.gain.setValueAtTime(0, this.ctx.currentTime + idx * 0.08);
                    gain.gain.linearRampToValueAtTime(0.2, this.ctx.currentTime + idx * 0.08 + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.08 + 0.35);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(this.ctx.currentTime + idx * 0.08);
                    osc.stop(this.ctx.currentTime + idx * 0.08 + 0.35);
                });
            }

            playMismatch() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(140, this.ctx.currentTime + 0.2);

                gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            }

            playWin() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;

                // Victory Fanfare sequence: C5, E5, G5, C6
                const sequence = [
                    { freq: 523.25, duration: 0.12, delay: 0 },
                    { freq: 659.25, duration: 0.12, delay: 0.12 },
                    { freq: 783.99, duration: 0.12, delay: 0.24 },
                    { freq: 1046.50, duration: 0.5, delay: 0.36 }
                ];

                sequence.forEach(note => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(note.freq, this.ctx.currentTime + note.delay);

                    gain.gain.setValueAtTime(0.25, this.ctx.currentTime + note.delay);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + note.delay + note.duration);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(this.ctx.currentTime + note.delay);
                    osc.stop(this.ctx.currentTime + note.delay + note.duration);
                });
            }
        }

        /**
         * Canvas Confetti Particles Effect
         */
        class ConfettiSystem {
            constructor(canvasId) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.particles = [];
                this.animating = false;

                this.resizeCanvas();
                window.addEventListener('resize', () => this.resizeCanvas());
            }

            resizeCanvas() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            trigger() {
                this.particles = [];
                const colors = ['#6366f1', '#a855f7', '#ec4899', '#10b981', '#f59e0b', '#3b82f6'];
                const particleCount = 120;

                for (let i = 0; i < particleCount; i++) {
                    this.particles.push({
                        x: window.innerWidth / 2,
                        y: window.innerHeight / 2 - 50,
                        vx: (Math.random() - 0.5) * 16,
                        vy: (Math.random() - 0.7) * 16,
                        size: Math.random() * 8 + 4,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        rotation: Math.random() * Math.PI * 2,
                        vRot: (Math.random() - 0.5) * 0.2,
                        opacity: 1,
                        gravity: 0.25
                    });
                }

                if (!this.animating) {
                    this.animating = true;
                    this.loop();
                }
            }

            loop() {
                if (!this.animating) return;

                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += p.gravity;
                    p.rotation += p.vRot;
                    p.opacity -= 0.008;

                    if (p.opacity <= 0) {
                        this.particles.splice(i, 1);
                        continue;
                    }

                    this.ctx.save();
                    this.ctx.translate(p.x, p.y);
                    this.ctx.rotate(p.rotation);
                    this.ctx.globalAlpha = Math.max(0, p.opacity);
                    this.ctx.fillStyle = p.color;
                    this.ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                    this.ctx.restore();
                }

                if (this.particles.length > 0) {
                    requestAnimationFrame(() => this.loop());
                } else {
                    this.animating = false;
                    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                }
            }
        }

        /**
         * Main Memory Card Game Engine
         */
        const soundFx = new SoundEffects();
        const confetti = new ConfettiSystem('confetti-canvas');

        // Game Configuration & State Variables
        const TOTAL_PAIRS = 8;
        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let timerSeconds = 0;
        let timerInterval = null;
        let isGameStarted = false;
        let isPaused = false;
        let isBoardLocked = false;
        let bestScore = localStorage.getItem('memory_game_best_moves') ? parseInt(localStorage.getItem('memory_game_best_moves')) : null;

        // Color theme palette for card front digits
        const numberColors = {
            1: 'text-indigo-400 border-indigo-500/30 shadow-indigo-500/20',
            2: 'text-emerald-400 border-emerald-500/30 shadow-emerald-500/20',
            3: 'text-amber-400 border-amber-500/30 shadow-amber-500/20',
            4: 'text-rose-400 border-rose-500/30 shadow-rose-500/20',
            5: 'text-cyan-400 border-cyan-500/30 shadow-cyan-500/20',
            6: 'text-purple-400 border-purple-500/30 shadow-purple-500/20',
            7: 'text-pink-400 border-pink-500/30 shadow-pink-500/20',
            8: 'text-lime-400 border-lime-500/30 shadow-lime-500/20'
        };

        // DOM Elements
        const gameGridEl = document.getElementById('game-grid');
        const movesCountEl = document.getElementById('moves-count');
        const timerDisplayEl = document.getElementById('timer-display');
        const bestScoreDisplayEl = document.getElementById('best-score-display');
        
        const restartBtn = document.getElementById('restart-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const pauseIcon = document.getElementById('pause-icon');
        const pauseText = document.getElementById('pause-text');
        const soundToggleBtn = document.getElementById('sound-toggle-btn');
        const soundIcon = document.getElementById('sound-icon');
        
        const pauseOverlay = document.getElementById('pause-overlay');
        const resumeBtn = document.getElementById('resume-btn');
        const startOverlay = document.getElementById('start-overlay');
        const startGameBtn = document.getElementById('start-game-btn');
        
        const victoryModal = document.getElementById('victory-modal');
        const victoryModalContent = document.getElementById('victory-modal-content');
        const modalRestartBtn = document.getElementById('modal-restart-btn');
        const finalMovesEl = document.getElementById('final-moves');
        const finalTimeEl = document.getElementById('final-time');
        const newRecordBadge = document.getElementById('new-record-badge');

        /**
         * Fisher-Yates Shuffle Algorithm
         * Ensures true random distribution of number pairs across the grid.
         */
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        /**
         * Initialize Game Board & State
         */
        function initGame() {
            // Stop active timers
            clearInterval(timerInterval);
            timerInterval = null;
            timerSeconds = 0;
            moves = 0;
            matchedPairs = 0;
            flippedCards = [];
            isGameStarted = false;
            isPaused = false;
            isBoardLocked = false;

            // Update UI elements
            movesCountEl.textContent = '0';
            timerDisplayEl.textContent = '00:00';
            updateBestScoreUI();
            updatePauseUI();

            // Hide victory modal & pause overlay
            victoryModal.classList.add('opacity-0', 'pointer-events-none');
            victoryModalContent.classList.add('scale-90');
            startOverlay.classList.remove('opacity-0', 'pointer-events-none');

            // Generate card values array (pairs 1..8)
            const numbers = [];
            for (let i = 1; i <= TOTAL_PAIRS; i++) {
                numbers.push(i, i);
            }
            const shuffledNumbers = shuffle(numbers);

            // Render cards to DOM grid
            gameGridEl.innerHTML = '';
            cards = [];

            shuffledNumbers.forEach((num, index) => {
                const cardContainer = document.createElement('div');
                cardContainer.className = 'card-container perspective-1000 w-full h-full';
                cardContainer.dataset.index = index;
                cardContainer.dataset.number = num;

                const colorClass = numberColors[num] || 'text-white';

                cardContainer.innerHTML = `
                    <div class="card-inner">
                        <div class="card-back">
                            <i class="fa-solid fa-gem text-indigo-400/40 text-lg md:text-2xl"></i>
                        </div>
                        <div class="card-front">
                            <span class="text-3xl md:text-4xl font-extrabold font-mono-num ${colorClass}">${num}</span>
                        </div>
                    </div>
                `;

                cardContainer.addEventListener('click', () => handleCardClick(cardContainer));
                gameGridEl.appendChild(cardContainer);
                cards.push(cardContainer);
            });
        }

        /**
         * Best Score UI Handler
         */
        function updateBestScoreUI() {
            if (bestScore !== null) {
                bestScoreDisplayEl.textContent = `${bestScore} 步`;
            } else {
                bestScoreDisplayEl.textContent = '--';
            }
        }

        /**
         * Timer Logic
         */
        function startTimer() {
            if (timerInterval) return;
            const startTime = Date.now() - (timerSeconds * 1000);
            timerInterval = setInterval(() => {
                if (!isPaused) {
                    timerSeconds = Math.floor((Date.now() - startTime) / 1000);
                    const minutes = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
                    const seconds = (timerSeconds % 60).toString().padStart(2, '0');
                    timerDisplayEl.textContent = `${minutes}:${seconds}`;
                }
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
        }

        /**
         * Card Click Listener & Flip Logic
         */
        function handleCardClick(cardContainer) {
            // Guard conditions: board locked, already flipped/matched, or game paused
            if (isBoardLocked || isPaused) return;
            if (cardContainer.classList.contains('flipped') || cardContainer.classList.contains('matched')) return;

            // Start game & timer on first flip
            if (!isGameStarted) {
                isGameStarted = true;
                startOverlay.classList.add('opacity-0', 'pointer-events-none');
                startTimer();
            }

            // Flip card visually and play sound
            cardContainer.classList.add('flipped');
            soundFx.playFlip();
            flippedCards.push(cardContainer);

            // Check matching when 2 cards are turned
            if (flippedCards.length === 2) {
                moves++;
                movesCountEl.textContent = moves.toString();
                checkMatch();
            }
        }

        /**
         * Card Matching Verification Logic
         */
        function checkMatch() {
            isBoardLocked = true;
            const [card1, card2] = flippedCards;
            const num1 = card1.dataset.number;
            const num2 = card2.dataset.number;

            if (num1 === num2) {
                // MATCH SUCCESS
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    soundFx.playMatch();
                    
                    matchedPairs++;
                    flippedCards = [];
                    isBoardLocked = false;

                    // Check for Game Victory
                    if (matchedPairs === TOTAL_PAIRS) {
                        handleVictory();
                    }
                }, 300);
            } else {
                // MATCH MISMATCH
                card1.classList.add('mismatch');
                card2.classList.add('mismatch');
                soundFx.playMismatch();

                setTimeout(() => {
                    card1.classList.remove('flipped', 'mismatch');
                    card2.classList.remove('flipped', 'mismatch');
                    flippedCards = [];
                    isBoardLocked = false;
                }, 850);
            }
        }

        /**
         * Handle Game Victory
         */
        function handleVictory() {
            stopTimer();
            soundFx.playWin();
            confetti.trigger();

            const isNewRecord = bestScore === null || moves < bestScore;
            if (isNewRecord) {
                bestScore = moves;
                localStorage.setItem('memory_game_best_moves', bestScore.toString());
                updateBestScoreUI();
                newRecordBadge.classList.remove('hidden');
                newRecordBadge.classList.add('flex');
            } else {
                newRecordBadge.classList.add('hidden');
                newRecordBadge.classList.remove('flex');
            }

            // Populate Victory Modal Stats
            finalMovesEl.textContent = moves.toString();
            finalTimeEl.textContent = timerDisplayEl.textContent;

            // Display Modal with animation
            setTimeout(() => {
                victoryModal.classList.remove('opacity-0', 'pointer-events-none');
                victoryModalContent.classList.remove('scale-90');
            }, 400);
        }

        /**
         * Pause & Resume Toggle Handler
         */
        function togglePause() {
            if (!isGameStarted || matchedPairs === TOTAL_PAIRS) return;

            isPaused = !isPaused;
            updatePauseUI();
        }

        function updatePauseUI() {
            if (isPaused) {
                pauseOverlay.classList.remove('opacity-0', 'pointer-events-none');
                pauseIcon.className = 'fa-solid fa-play';
                pauseText.textContent = '繼續';
            } else {
                pauseOverlay.classList.add('opacity-0', 'pointer-events-none');
                pauseIcon.className = 'fa-solid fa-pause';
                pauseText.textContent = '暫停';
            }
        }

        /**
         * Mute / Unmute Sound Toggle Handler
         */
        function toggleSound() {
            soundFx.muted = !soundFx.muted;
            if (soundFx.muted) {
                soundIcon.className = 'fa-solid fa-volume-xmark text-slate-500';
            } else {
                soundIcon.className = 'fa-solid fa-volume-high text-slate-300';
                soundFx.playFlip(); // Subtle click test when unmuted
            }
        }

        // Attach Event Listeners
        restartBtn.addEventListener('click', () => initGame());
        modalRestartBtn.addEventListener('click', () => initGame());
        pauseBtn.addEventListener('click', togglePause);
        resumeBtn.addEventListener('click', togglePause);
        soundToggleBtn.addEventListener('click', toggleSound);

        startGameBtn.addEventListener('click', () => {
            startOverlay.classList.add('opacity-0', 'pointer-events-none');
            isGameStarted = true;
            soundFx.init();
            startTimer();
        });

        // Initialize on page load
        window.onload = function() {
            initGame();
        };
    </script>
</body>
</html>

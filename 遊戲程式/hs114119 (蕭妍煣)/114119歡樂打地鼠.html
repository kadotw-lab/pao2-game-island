<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>歡樂打地鼠 Whack-A-Mole</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    :root {
      --primary-bg: #1e3a1e;
      --grass-green: #4ade80;
      --dirt-brown: #854d0e;
      --hole-dark: #291705;
      --gold-yellow: #facc15;
      --bomb-red: #ef4444;
      --text-color: #ffffff;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at center, #2d5a27 0%, #0d1f0d 100%);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      touch-action: manipulation;
    }

    #game-wrapper {
      position: relative;
      width: 100%;
      max-width: 600px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hud-container {
      width: 100%;
      background: rgba(15, 23, 42, 0.65);
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 12px 16px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      margin-bottom: 12px;
    }

    .hud-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hud-label {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #a7f3d0;
      margin-bottom: 2px;
    }

    .hud-value {
      font-size: 1.35rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
    }

    .hud-value.gold { color: var(--gold-yellow); }
    .hud-value.time { color: #38bdf8; }

    .control-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 8px 16px;
      font-size: 0.9rem;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 0 #1d4ed8, 0 6px 12px rgba(0,0,0,0.3);
      transition: all 0.1s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #1d4ed8;
    }

    .stage-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      background: radial-gradient(circle, #3f7037 0%, #1a3317 100%);
      border: 6px solid #15803d;
      border-radius: 24px;
      padding: 16px;
      box-shadow: inset 0 0 24px rgba(0,0,0,0.8), 0 12px 36px rgba(0,0,0,0.6);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 12px;
      cursor: none;
    }

    .hole-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 50% 50% 45% 45%;
      background: linear-gradient(180deg, var(--hole-dark) 0%, #120a02 100%);
      box-shadow: inset 0 8px 14px rgba(0,0,0,0.9), 0 4px 8px rgba(0,0,0,0.4);
      border-bottom: 4px solid #543109;
    }

    .hole-wrapper::after {
      content: '';
      position: absolute;
      bottom: -10%;
      left: -10%;
      width: 120%;
      height: 45%;
      background: radial-gradient(ellipse at center, #854d0e 0%, #3a2207 80%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 10;
      border-top: 3px solid #a16207;
    }

    .key-badge {
      position: absolute;
      top: 6px;
      left: 6px;
      background: rgba(0, 0, 0, 0.6);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.3);
      font-size: 0.75rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 6px;
      z-index: 12;
      pointer-events: none;
    }

    .mole {
      position: absolute;
      bottom: -100%;
      left: 15%;
      width: 70%;
      height: 85%;
      border-radius: 40% 40% 20% 20%;
      transition: bottom 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 12px;
      box-shadow: inset -4px -4px 10px rgba(0,0,0,0.4);
      cursor: pointer;
    }

    .mole.up {
      bottom: 10%;
    }

    .mole.hit {
      transform: scale(0.9) translateY(10px);
      filter: brightness(1.3) contrast(1.2);
      transition: transform 0.05s ease;
    }

    .mole.normal {
      background: linear-gradient(180deg, #9a3412 0%, #431407 100%);
      border: 2px solid #ea580c;
    }

    .mole.gold {
      background: linear-gradient(180deg, #fef08a 0%, #ca8a04 100%);
      border: 2px solid #facc15;
      box-shadow: 0 0 16px #facc15, inset -4px -4px 10px rgba(0,0,0,0.3);
    }

    .mole.bomb {
      background: linear-gradient(180deg, #475569 0%, #0f172a 100%);
      border: 2px solid #ef4444;
      box-shadow: 0 0 14px rgba(239, 68, 68, 0.7);
    }

    .mole.zombie {
      background: linear-gradient(180deg, #15803d 0%, #052e16 100%);
      border: 2px solid #22c55e;
      box-shadow: 0 0 16px rgba(34, 197, 94, 0.8);
    }

    .mole-eyes {
      display: flex;
      gap: 12px;
      margin-bottom: 4px;
    }

    .eye {
      width: 10px;
      height: 10px;
      background: #fff;
      border-radius: 50%;
      position: relative;
    }

    .eye::after {
      content: '';
      position: absolute;
      width: 5px;
      height: 5px;
      background: #000;
      border-radius: 50%;
      top: 2px;
      left: 2px;
    }

    .mole.bomb .eye {
      background: #ef4444;
      box-shadow: 0 0 4px #ef4444;
    }

    .mole.bomb .eye::after {
      background: #fff;
    }

    .mole.zombie .eye {
      background: #a855f7;
      box-shadow: 0 0 6px #a855f7;
    }

    .mole.zombie .eye::after {
      background: #000;
    }

    .snout {
      width: 28px;
      height: 18px;
      background: #fed7aa;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .mole.gold .snout { background: #fef08a; }
    .mole.bomb .snout { background: #94a3b8; }
    .mole.zombie .snout { background: #4ade80; }

    .nose {
      width: 10px;
      height: 6px;
      background: #451a03;
      border-radius: 5px;
    }

    .crown {
      position: absolute;
      top: -12px;
      font-size: 18px;
      animation: bounce 0.6s infinite alternate;
    }

    .fuse {
      position: absolute;
      top: -10px;
      width: 4px;
      height: 12px;
      background: #78350f;
    }

    .fuse::after {
      content: '';
      position: absolute;
      top: -4px;
      left: -2px;
      width: 8px;
      height: 8px;
      background: #f97316;
      border-radius: 50%;
      box-shadow: 0 0 8px #f97316;
      animation: blink 0.2s infinite alternate;
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-4px); }
    }

    @keyframes blink {
      from { opacity: 0.5; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1.2); }
    }

    #fx-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 20;
    }

    #hammer {
      position: fixed;
      width: 54px;
      height: 54px;
      pointer-events: none;
      z-index: 100;
      transform: translate(-20%, -80%) rotate(-20deg);
      transform-origin: bottom left;
      transition: transform 0.05s ease;
      display: none;
    }

    #hammer.strike {
      transform: translate(-20%, -50%) rotate(-70deg);
    }

    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(8px);
      border-radius: 24px;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-title {
      font-size: 2.2rem;
      font-weight: 900;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #facc15, #f97316);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 4px 12px rgba(250, 204, 21, 0.3);
    }

    .modal-desc {
      font-size: 0.95rem;
      color: #cbd5e1;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .modal-stats {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 12px 16px;
      width: 100%;
      max-width: 280px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
    }

    .stat-val {
      font-weight: 800;
      color: #facc15;
    }

    .start-btn {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      border: none;
      padding: 12px 32px;
      font-size: 1.2rem;
      font-weight: 800;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 6px 0 #15803d, 0 8px 20px rgba(34, 197, 94, 0.4);
      transition: all 0.15s ease;
    }

    .start-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #15803d;
    }

    .shake {
      animation: shake 0.25s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes shake {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(4px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
      40%, 60% { transform: translate3d(6px, 0, 0); }
    }

    @media (max-width: 480px) {
      .hud-container { padding: 8px 10px; gap: 4px; }
      .hud-value { font-size: 1.1rem; }
      .hud-label { font-size: 0.65rem; }
      .stage-container { padding: 10px; gap: 8px; }
      .modal-title { font-size: 1.7rem; }
    }
  </style>
</head>
<body>

  <div id="game-wrapper">
    <div class="hud-container">
      <div class="hud-box">
        <span class="hud-label">得分 Score</span>
        <span class="hud-value gold" id="score-display">0</span>
      </div>
      <div class="hud-box">
        <span class="hud-label">時間 Time</span>
        <span class="hud-value time" id="time-display">60s</span>
      </div>
      <div class="hud-box">
        <span class="hud-label">連擊 Combo</span>
        <span class="hud-value" id="combo-display">x0</span>
      </div>
      <div class="hud-box">
        <span class="hud-label">最高分 High</span>

      </div>
    </div>

    <div class="control-bar">
      <button class="btn" id="pause-btn">
        <span class="btn-icon">⏸</span> 暫停
      </button>
      <button class="btn" id="mute-btn">
        <span class="btn-icon" id="mute-icon">🔊</span> 音效: 開

    <div class="stage-container" id="stage">
      <canvas id="fx-canvas"></canvas>

      <div class="hole-wrapper" data-index="0">
        <span class="key-badge">1</span>
        <div class="mole" id="mole-0">
          <div class="mole-face">
            <div class="mole-eyes"><div class="eye"></div><div class="eye"></div></div>
            <div class="snout"><div class="nose"></div></div>
          </div>
        </div>
      </div>
      <div class="hole-wrapper" data-index="1">
        <span class="key-badge">2</span>
        <div class="mole" id="mole-1">
          <div class="mole-face">
            <div class="mole-eyes"><div class="eye"></div><div class="eye"></div></div>
            <div class="snout"><div class="nose"></div></div>
          </div>
        </div>
      </div>
      <div class="hole-wrapper" data-index="2">
        <span class="key-badge">3</span>
        <div class="mole" id="mole-2">
          <div class="mole-face">
            <div class="mole-eyes"><div class="eye"></div><div class="eye"></div></div>
            <div class="snout"><div class="nose"></div></div>
          </div>
        </div>
      </div>
      <div class="hole-wrapper" data-index="3">
        <span class="key-badge">4</span>
        <div class="mole" id="mole-3">
          <div class="mole-face">
            <div class="mole-eyes"><div class="eye"></div><div class="eye"></div></div>
            <div class="snout"><div class="nose"></div></div>
          </div>
        </div>
      </div>
      <div class="hole-wrapper" data-index="4">
        <span class="key-badge">5</span>
        <div class="mole" id="mole-4">
          <div class="mole-face">
            <div class="mole-eyes"><div class="eye"></div><div class="eye"></div></div>
            <div class="snout"><div class="nose"></div></div>
          </div>
        </div>
      </div>
      <div class="hole-wrapper" data-index="5">
        <span class="key-badge">6</span>
        <div class="mole" id="mole-5">
          <div class="mole-face">
            <div class="mole-eyes"><div class="eye"></div><div class="eye"></div></div>
            <div class="snout"><div class="nose"></div></div>
          </div>
        </div>
      </div>
      <div class="hole-wrapper" data-index="6">
        <span class="key-badge">7</span>
        <div class="mole" id="mole-6">
          <div class="mole-face">
            <div class="mole-eyes"><div class="eye"></div><div class="eye"></div></div>

      <div class="hole-wrapper" data-index="7">
        <span class="key-badge">8</span>
        <div class="mole" id="mole-7">
          <div class="mole-face">
            <div class="mole-eyes"><div class="eye"></div><div class="eye"></div></div>
            <div class="snout"><div class="nose"></div></div>

        </div>

      <div class="hole-wrapper" data-index="8">

      <div class="modal-overlay active" id="start-modal">

        <p class="modal-desc">

          黃金地鼠：<strong>+300分 & +2秒</strong><br>
          💣 炸彈地鼠：<strong style="color:#ef4444;">-200分 & 扣時爆炸</strong><br>
          🧟 喪屍鼠：<strong style="color:#22c55e;">-250分 & 毒氣爆炸</strong><br>
          支援鍵盤 <strong>1~9</strong> 鍵快速擊打！
        </p>
        <button class="start-btn" id="start-game-btn">開始遊戲</button>
      </div>

      <div class="modal-overlay" id="gameover-modal">

        <p class="modal-desc">休息一下，準備好了隨時繼續！</p>

  <div id="hammer">
    <svg viewBox="0 0 100 100" width="54" height="54">
      <rect x="42" y="40" width="16" height="55" rx="5" fill="#854d0e" stroke="#451a03" stroke-width="3"/>
      <rect x="15" y="10" width="70" height="35" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="4"/>
      <rect x="25" y="10" width="8" height="35" fill="#94a3b8"/>
      <rect x="67" y="10" width="8" height="35" fill="#94a3b8"/>
    </svg>
  </div>

  <script>
    class SoundSystem {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playSwing() {
        if (this.muted || !this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(450, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.08);
      }

      playHit() {
        if (this.muted || !this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(260, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(60, this.ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.8, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.12);
      }

      playGold() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.08);
        osc.frequency.setValueAtTime(783.99, now + 0.16);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(now + 0.3);
      }

      playBomb() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.linearRampToValueAtTime(40, now + 0.25);
        gain.gain.setValueAtTime(0.9, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(now + 0.25);
      }

      playBeep() {
        if (this.muted || !this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.08);
      }
    }

    class ParticleFX {
      constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.particles = [];
        this.texts = [];
        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.loop();
      }

      resize() {
        const rect = this.canvas.parentElement.getBoundingClientRect();
        this.canvas.width = rect.width;
        this.canvas.height = rect.height;
      }

      spawnHitParticles(x, y, color = '#facc15', count = 12) {
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 2 + Math.random() * 6;
          this.particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            size: 3 + Math.random() * 5,
            color,
            alpha: 1,
            life: 0.03 + Math.random() * 0.03
          });
        }
      }

      spawnFloatingText(text, x, y, color = '#ffffff') {
        this.texts.push({
          text, x, y,
          vy: -2,
          alpha: 1,
          color,
          life: 0.02
        });
      }

      loop() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.alpha -= p.life;
          if (p.alpha <= 0) {
            this.particles.splice(i, 1);
            continue;
          }
          this.ctx.globalAlpha = p.alpha;
          this.ctx.fillStyle = p.color;
          this.ctx.beginPath();
          this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          this.ctx.fill();
        }

        for (let i = this.texts.length - 1; i >= 0; i--) {
          const t = this.texts[i];
          t.y += t.vy;
          t.alpha -= t.life;
          if (t.alpha <= 0) {
            this.texts.splice(i, 1);
            continue;
          }
          this.ctx.globalAlpha = t.alpha;
          this.ctx.font = '900 22px system-ui, sans-serif';
          this.ctx.fillStyle = t.color;
          this.ctx.strokeStyle = '#000000';
          this.ctx.lineWidth = 4;
          this.ctx.strokeText(t.text, t.x - 20, t.y);
          this.ctx.fillText(t.text, t.x - 20, t.y);
        }

        this.ctx.globalAlpha = 1;
        requestAnimationFrame(() => this.loop());
      }
    }

    class Game {
      constructor() {
        this.score = 0;
        this.timeLeft = 60;
        this.combo = 0;
        this.maxCombo = 0;
        this.hits = 0;
        this.highScore = parseInt(localStorage.getItem('whack_a_mole_high_score') || '0', 10);

        this.state = 'START';
        this.spawnTimer = null;
        this.clockTimer = null;

        this.holes = [];
        this.sound = new SoundSystem();
        
        this.initDOM();
        this.fx = new ParticleFX(document.getElementById('fx-canvas'));
        this.initEvents();
      }

      initDOM() {
        this.scoreEl = document.getElementById('score-display');
        this.timeEl = document.getElementById('time-display');
        this.comboEl = document.getElementById('combo-display');
        this.highScoreEl = document.getElementById('high-score-display');
        this.highScoreEl.textContent = this.highScore;

        this.stageEl = document.getElementById('stage');
        this.hammerEl = document.getElementById('hammer');

        this.startModal = document.getElementById('start-modal');
        this.gameoverModal = document.getElementById('gameover-modal');
        this.pauseModal = document.getElementById('pause-modal');

        for (let i = 0; i < 9; i++) {
          const moleEl = document.getElementById(`mole-${i}`);
          this.holes.push({
            id: i,
            moleEl: moleEl,
            type: null,
            active: false,
            timer: null
          });
        }
      }

      initEvents() {
        document.getElementById('start-game-btn').addEventListener('click', () => {
          this.sound.init();
          this.startGame();
        });

        document.getElementById('restart-game-btn').addEventListener('click', () => {
          this.sound.init();
          this.startGame();
        });

        document.getElementById('pause-btn').addEventListener('click', () => this.togglePause());
        document.getElementById('resume-btn').addEventListener('click', () => this.togglePause());

        const muteBtn = document.getElementById('mute-btn');
        const muteIcon = document.getElementById('mute-icon');
        muteBtn.addEventListener('click', () => {
          this.sound.muted = !this.sound.muted;
          muteIcon.textContent = this.sound.muted ? '🔇' : '🔊';
          muteBtn.childNodes[2].textContent = this.sound.muted ? ' 音效: 關' : ' 音效: 開';
        });

        this.stageEl.addEventListener('mousemove', (e) => {
          this.hammerEl.style.display = 'block';
          this.hammerEl.style.left = `${e.clientX}px`;
          this.hammerEl.style.top = `${e.clientY}px`;
        });

        this.stageEl.addEventListener('mouseleave', () => {
          this.hammerEl.style.display = 'none';
        });

        this.stageEl.addEventListener('mousedown', () => {
          this.sound.playSwing();
          this.hammerEl.classList.add('strike');
          setTimeout(() => this.hammerEl.classList.remove('strike'), 80);
        });

        this.holes.forEach((hole) => {
          const handleHit = (e) => {
            e.preventDefault();
            this.hitMole(hole, e);
          };
          hole.moleEl.addEventListener('mousedown', handleHit);
          hole.moleEl.addEventListener('touchstart', handleHit, { passive: false });
        });

        window.addEventListener('keydown', (e) => {
          if (this.state === 'PLAYING') {
            const key = parseInt(e.key, 10);
            if (key >= 1 && key <= 9) {
              const index = key - 1;
              const hole = this.holes[index];
              this.triggerKeyHit(hole);
            }
            if (e.key === 'Escape' || e.key.toLowerCase() === 'p') {
              this.togglePause();
            }
          }
        });
      }

      startGame() {
        this.score = 0;
        this.timeLeft = 60;
        this.combo = 0;
        this.maxCombo = 0;
        this.hits = 0;
        this.state = 'PLAYING';

        this.updateHUD();

        this.startModal.classList.remove('active');
        this.gameoverModal.classList.remove('active');
        this.pauseModal.classList.remove('active');

        this.holes.forEach(hole => this.clearMole(hole));

        clearInterval(this.clockTimer);
        clearTimeout(this.spawnTimer);

        this.clockTimer = setInterval(() => this.tick(), 1000);
        this.scheduleNextSpawn();
      }

      tick() {
        if (this.state !== 'PLAYING') return;

        this.timeLeft--;
        this.timeEl.textContent = `${this.timeLeft}s`;

        if (this.timeLeft <= 5 && this.timeLeft > 0) {
          this.sound.playBeep();
        }

        if (this.timeLeft <= 0) {
          this.endGame();
        }
      }

      scheduleNextSpawn() {
        if (this.state !== 'PLAYING') return;

        const progress = (60 - this.timeLeft) / 60;
        const minDelay = 400 - progress * 200;
        const maxDelay = 1100 - progress * 400;
        const delay = Math.random() * (maxDelay - minDelay) + minDelay;

        this.spawnTimer = setTimeout(() => {
          this.spawnMole();
          this.scheduleNextSpawn();
        }, delay);
      }

      spawnMole() {
        const availableHoles = this.holes.filter(h => !h.active);
        if (availableHoles.length === 0) return;

        const hole = availableHoles[Math.floor(Math.random() * availableHoles.length)];
        hole.active = true;

        const rand = Math.random();
        if (rand < 0.60) {
          hole.type = 'normal';
        } else if (rand < 0.75) {
          hole.type = 'gold';
        } else if (rand < 0.88) {
          hole.type = 'bomb';
        } else {
          hole.type = 'zombie';
        }

        this.renderMoleType(hole);
        hole.moleEl.classList.add('up');

        const stayDuration = Math.max(700, 1400 - (60 - this.timeLeft) * 12);
        hole.timer = setTimeout(() => {
          if (hole.active) {
            this.clearMole(hole);
            if (hole.type !== 'bomb' && this.state === 'PLAYING') {
              this.combo = 0;
              this.updateHUD();
            }
          }
        }, stayDuration);
      }

      renderMoleType(hole) {
        const moleEl = hole.moleEl;
        moleEl.className = `mole ${hole.type} up`;
        
        const crown = moleEl.querySelector('.crown');
        const fuse = moleEl.querySelector('.fuse');
        if (crown) crown.remove();
        if (fuse) fuse.remove();

        if (hole.type === 'gold') {
          const c = document.createElement('div');
          c.className = 'crown';
          c.textContent = '👑';
          moleEl.appendChild(c);
        } else if (hole.type === 'bomb') {
          const f = document.createElement('div');
          f.className = 'fuse';
          moleEl.appendChild(f);
        } else if (hole.type === 'zombie') {
          const z = document.createElement('div');
          z.className = 'crown';
          z.textContent = '🧟';
          moleEl.appendChild(z);
        }
      }

      clearMole(hole) {
        clearTimeout(hole.timer);
        hole.moleEl.classList.remove('up', 'hit');
        hole.active = false;
        hole.type = null;
      }

      triggerKeyHit(hole) {
        if (!hole) return;
        const rect = hole.moleEl.getBoundingClientRect();
        const stageRect = this.stageEl.getBoundingClientRect();

        const x = rect.left + rect.width / 2 - stageRect.left;
        const y = rect.top + rect.height / 2 - stageRect.top;

        this.fx.spawnHitParticles(x, y, '#cbd5e1', 5);
        this.sound.playSwing();

        if (hole.active) {
          this.hitMole(hole, { clientX: rect.left + rect.width / 2, clientY: rect.top + rect.height / 2 });
        }
      }

      hitMole(hole, event) {
        if (!hole.active || this.state !== 'PLAYING') return;

        clearTimeout(hole.timer);
        hole.active = false;
        hole.moleEl.classList.add('hit');

        const stageRect = this.stageEl.getBoundingClientRect();
        const px = event.clientX - stageRect.left;
        const py = event.clientY - stageRect.top;

        this.hits++;

        if (hole.type === 'normal') {
          this.combo++;
          const comboBonus = Math.min(this.combo, 5);
          const pts = 100 * comboBonus;
          this.score += pts;
          this.sound.playHit();
          this.fx.spawnHitParticles(px, py, '#f97316', 15);
          this.fx.spawnFloatingText(`+${pts}!`, px, py, '#facc15');
        } else if (hole.type === 'gold') {
          this.combo++;
          const pts = 300;
          this.score += pts;
          this.timeLeft += 2;
          this.sound.playGold();
          this.fx.spawnHitParticles(px, py, '#facc15', 25);
          this.fx.spawnFloatingText(`+300 & +2s!`, px, py, '#38bdf8');
        } else if (hole.type === 'bomb') {
          this.combo = 0;
          this.score = Math.max(0, this.score - 200);
          this.timeLeft = Math.max(0, this.timeLeft - 3);
          this.sound.playBomb();
          this.stageEl.classList.add('shake');
          setTimeout(() => this.stageEl.classList.remove('shake'), 300);
          this.fx.spawnHitParticles(px, py, '#ef4444', 30);
          this.fx.spawnFloatingText(`-200! 💥`, px, py, '#ef4444');
        } else if (hole.type === 'zombie') {
          this.combo = 0;
          this.score = Math.max(0, this.score - 250);
          this.sound.playBomb();
          this.stageEl.classList.add('shake');
          setTimeout(() => this.stageEl.classList.remove('shake'), 300);
          this.fx.spawnHitParticles(px, py, '#22c55e', 35);
          this.fx.spawnFloatingText(`-250! ☣️`, px, py, '#22c55e');
        }

        if (this.combo > this.maxCombo) {
          this.maxCombo = this.combo;
        }

        this.updateHUD();

        setTimeout(() => this.clearMole(hole), 150);
      }

      updateHUD() {
        this.scoreEl.textContent = this.score;
        this.timeEl.textContent = `${this.timeLeft}s`;
        this.comboEl.textContent = `x${this.combo}`;

        if (this.score > this.highScore) {
          this.highScore = this.score;
          this.highScoreEl.textContent = this.highScore;
          localStorage.setItem('whack_a_mole_high_score', this.highScore.toString());
        }
      }

      togglePause() {
        if (this.state === 'PLAYING') {
          this.state = 'PAUSED';
          this.pauseModal.classList.add('active');
        } else if (this.state === 'PAUSED') {
          this.state = 'PLAYING';
          this.pauseModal.classList.remove('active');
        }
      }

      endGame() {
        this.state = 'GAMEOVER';
        clearInterval(this.clockTimer);
        clearTimeout(this.spawnTimer);

        document.getElementById('final-score').textContent = this.score;
        document.getElementById('final-combo').textContent = `x${this.maxCombo}`;
        document.getElementById('final-hits').textContent = this.hits;

        const titleEl = document.getElementById('gameover-title');
        if (this.score >= this.highScore && this.score > 0) {
          titleEl.textContent = '🎉 破紀錄！';
        } else {
          titleEl.textContent = '遊戲結束';
        }

        this.gameoverModal.classList.add('active');
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      new Game();
    });
  </script>
</body>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>垃圾桶</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Serif TC', serif;
            background-color: #080808;
            color: #e5e5e5;
            overflow: hidden;
        }

        /* 簡約呼吸光暈 */
        .breath-glow {
            box-shadow: 0 0 40px rgba(230, 81, 0, 0.15);
        }

        .breath-glow:focus-within {
            box-shadow: 0 0 50px rgba(245, 124, 0, 0.3);
        }

        /* 大火燃燒時的狂暴光暈與震動 */
        .fire-blaze {
            box-shadow: 0 0 80px rgba(255, 68, 0, 0.8), 0 0 120px rgba(255, 140, 0, 0.5) !important;
            border-color: rgba(255, 100, 0, 0.6) !important;
            animation: shake 0.15s infinite alternate, glowPulse 0.5s infinite alternate;
        }

        @keyframes shake {
            0% { transform: translate(1.5px, 1.5px) rotate(0deg); }
            100% { transform: translate(-1.5px, -1.5px) rotate(-0.5deg); }
        }

        @keyframes glowPulse {
            0% { filter: drop-shadow(0 0 15px rgba(255, 80, 0, 0.6)); }
            100% { filter: drop-shadow(0 0 35px rgba(255, 160, 0, 0.9)); }
        }

        /* 靜音切換按鈕視覺 */
        .glass-btn {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center relative select-none p-4">

    <!-- 動態火焰與灰燼 Canvas 背景 -->
    <canvas id="fireCanvas" class="fixed inset-0 w-full h-full pointer-events-none z-0"></canvas>

    <!-- 右上角極簡音效切換 -->
    <button id="audioToggle" onclick="toggleAudio()" class="fixed top-6 right-6 z-20 glass-btn p-3 rounded-full text-stone-400 hover:text-amber-400 transition-all duration-300 flex items-center justify-center">
        <svg id="audioIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
        </svg>
    </button>

    <!-- 主內容極簡卡片 -->
    <main class="relative z-10 w-full max-w-xl flex flex-col items-center">
        
        <!-- 標題 -->
        <h1 class="text-2xl md:text-3xl font-light tracking-widest text-stone-300 mb-8 opacity-90 text-center">
            垃圾桶
        </h1>

        <!-- 簡約輸入框 -->
        <div id="cardBox" class="w-full glass-btn rounded-2xl p-6 breath-glow transition-all duration-700 relative">
            <textarea 
                id="trashInput" 
                rows="6" 
                placeholder="寫下讓你煩心、焦慮或疲憊的事物..."
                class="w-full bg-transparent text-stone-200 placeholder-stone-600 focus:outline-none transition duration-300 resize-none text-base md:text-lg leading-relaxed no-scrollbar"
            ></textarea>

            <!-- 點燃按鈕 -->
            <div class="mt-6 flex justify-end">
                <button 
                    id="burnBtn" 
                    onclick="igniteTrash()" 
                    class="px-6 py-2.5 rounded-xl bg-gradient-to-r from-orange-600 to-amber-600 hover:from-orange-500 hover:to-amber-500 text-white font-medium text-sm tracking-wider transition-all duration-300 shadow-lg shadow-orange-950/50 flex items-center gap-2 cursor-pointer disabled:opacity-30 disabled:cursor-not-allowed"
                >
                    <span>點燃銷毀</span>
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M12.395 2.553a1 1 0 00-1.45-.385c-.345.23-.614.558-.822.88-.316.492-.63 1.055-.928 1.67-.297.617-.585 1.259-.81 1.884a15.354 15.354 0 01-.73 1.719 1 1 0 01-.527.422c-.22.08-.468.083-.715.023-.274-.067-.537-.184-.798-.313a7.19 7.19 0 00-1.002-.41 1 1 0 00-1.22.872c-.186 1.393.203 2.812.87 3.992.666 1.179 1.637 2.11 2.808 2.628 1.171.518 2.505.617 3.73.28 1.224-.336 2.308-1.075 3.064-2.103.757-1.028 1.127-2.298 1.05-3.57a8.558 8.558 0 00-.73-2.923c-.348-.827-.818-1.597-1.393-2.288a1 1 0 00-1.316-.18z" clip-rule="evenodd"/>
                    </svg>
                </button>
            </div>
        </div>
    </main>

    <script>
        /* ==========================================================================
         * 1. 音效引擎 (Web Audio API)
         * ========================================================================== */
        let audioCtx = null;
        let isMuted = false;
        let fireRumbleGain = null;

        function initAudio() {
            if (audioCtx) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();

            // 柴火底躁
            const bufferSize = audioCtx.sampleRate * 2;
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;

            const noise = audioCtx.createBufferSource();
            noise.buffer = noiseBuffer;
            noise.loop = true;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(120, audioCtx.currentTime);

            fireRumbleGain = audioCtx.createGain();
            fireRumbleGain.gain.setValueAtTime(0.04, audioCtx.currentTime);

            noise.connect(filter);
            filter.connect(fireRumbleGain);
            fireRumbleGain.connect(audioCtx.destination);
            noise.start();

            scheduleCrackle();
        }

        // 大火轟鳴音效增強
        function boostFireAudio(isBurning) {
            if (!audioCtx || isMuted) return;
            if (fireRumbleGain) {
                const targetGain = isBurning ? 0.22 : 0.04;
                fireRumbleGain.gain.setTargetAtTime(targetGain, audioCtx.currentTime, 0.2);
            }
        }

        function scheduleCrackle() {
            if (!isMuted && audioCtx && audioCtx.state === 'running') {
                createCrackle();
            }
            setTimeout(scheduleCrackle, Math.random() * 250 + 80);
        }

        function createCrackle() {
            if (!audioCtx || isMuted) return;
            const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.01, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < data.length; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (data.length * 0.2));
            }

            const source = audioCtx.createBufferSource();
            source.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'highpass';
            filter.frequency.setValueAtTime(1000 + Math.random() * 1000, audioCtx.currentTime);

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(Math.random() * 0.08 + 0.02, audioCtx.currentTime);

            source.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            source.start();
        }

        function toggleAudio() {
            if (!audioCtx) initAudio();
            isMuted = !isMuted;
            const icon = document.getElementById('audioIcon');
            if (isMuted) {
                icon.classList.add('opacity-30');
                if (fireRumbleGain) fireRumbleGain.gain.setValueAtTime(0, audioCtx.currentTime);
            } else {
                icon.classList.remove('opacity-30');
                if (fireRumbleGain) fireRumbleGain.gain.setValueAtTime(0.04, audioCtx.currentTime);
            }
        }

        /* ==========================================================================
         * 2. 極簡 Canvas 動態背景與燃燒粒子
         * ========================================================================== */
        const canvas = document.getElementById('fireCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let ashParticles = [];
        let intenseMode = false; // 大火爆發狀態

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 大火狂暴火花粒子
        class SparkParticle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * (intenseMode ? 16 : 9);
                this.vy = -Math.random() * (intenseMode ? 14 : 9) - 3;
                this.size = Math.random() * (intenseMode ? 6 : 4) + 2;
                this.life = 1;
                this.decay = Math.random() * 0.03 + 0.015;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.06;
                this.life -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalCompositeOperation = 'screen';
                ctx.fillStyle = `rgba(255, ${Math.floor(Math.random()*150 + 100)}, 50, ${this.life})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class AshParticle {
            constructor(x, y, char) {
                this.x = x;
                this.y = y;
                this.char = char;
                this.vx = (Math.random() - 0.5) * 6;
                this.vy = -Math.random() * 6 - 3;
                this.size = Math.random() * 18 + 14;
                this.life = 1;
                this.decay = Math.random() * 0.01 + 0.005;
                this.rotation = Math.random() * Math.PI * 2;
            }
            update() {
                this.x += this.vx + Math.sin(this.y * 0.03) * 2;
                this.y += this.vy;
                this.rotation += 0.04;
                this.life -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.fillStyle = this.life > 0.4 ? '#ff5500' : '#888888';
                ctx.font = `bold ${this.size}px "Noto Serif TC", serif`;
                ctx.fillText(this.char, 0, 0);
                ctx.restore();
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);

            // 僅繪製與更新文字銷毀時產生之灰燼與火星粒子
            for (let i = ashParticles.length - 1; i >= 0; i--) {
                const a = ashParticles[i];
                a.update();
                a.draw();
                if (a.life <= 0) ashParticles.splice(i, 1);
            }
            requestAnimationFrame(animate);
        }
        animate();

        /* ==========================================================================
         * 3. 點燃與大火焚燒邏輯
         * ========================================================================== */
        const textarea = document.getElementById('trashInput');

        function igniteTrash() {
            const text = textarea.value.trim();
            if (!text) return;

            if (!audioCtx) initAudio();
            else if (audioCtx.state === 'suspended') audioCtx.resume();

            const burnBtn = document.getElementById('burnBtn');
            const cardBox = document.getElementById('cardBox');
            burnBtn.disabled = true;

            // 開啟大火模式與音效增強
            intenseMode = true;
            boostFireAudio(true);
            cardBox.classList.add('fire-blaze');

            const rect = textarea.getBoundingClientRect();
            const chars = text.split('');

            // 全螢幕滿屏火花爆發 (150 個全螢幕隨機火花)
            for (let i = 0; i < 150; i++) {
                const sx = Math.random() * width;
                const sy = Math.random() * height;
                ashParticles.push(new SparkParticle(sx, sy));
            }

            chars.forEach((char, index) => {
                setTimeout(() => {
                    const x = rect.left + Math.random() * rect.width;
                    const y = rect.top + Math.random() * rect.height;
                    ashParticles.push(new AshParticle(x, y, char));
                    ashParticles.push(new SparkParticle(x, y));
                    if (Math.random() < 0.7) createCrackle();
                }, index * (1600 / chars.length));
            });

            // 漸隱文字
            let opacity = 1;
            const timer = setInterval(() => {
                opacity -= 0.05;
                textarea.style.opacity = opacity;
                if (opacity <= 0) {
                    clearInterval(timer);
                    textarea.value = '';
                    textarea.style.opacity = 1;
                    burnBtn.disabled = false;
                    
                    // 恢復常規火焰與聲效
                    intenseMode = false;
                    boostFireAudio(false);
                    cardBox.classList.remove('fire-blaze');
                }
            }, 70);
        }
    </script>
</body>
</html>

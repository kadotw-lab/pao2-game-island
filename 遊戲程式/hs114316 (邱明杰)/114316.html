<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>銀河戰將：火力全開 - 經典太空射擊遊戲</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #030308;
            color: #ffffff;
            font-family: 'Segoe UI', Microsoft JhengHei, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.3), 0 0 15px rgba(255, 0, 128, 0.25);
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #1e293b;
        }

        canvas {
            display: block;
            background: #020205;
        }

        /* 抬頭顯示器 (HUD) */
        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            z-index: 5;
            font-family: 'Courier New', Courier, monospace;
        }

        .hud-left, .hud-right {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .hud-item {
            display: flex;
            flex-direction: column;
        }

        .hud-label {
            font-size: 11px;
            color: #00f0ff;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 5px rgba(0, 240, 255, 0.8);
        }

        .hud-value {
            font-size: 22px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
        }

        /* 生命值與裝甲條 */
        .health-bar-container {
            width: 140px;
            height: 12px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #334155;
            border-radius: 6px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.2);
            margin-top: 2px;
        }

        .health-bar-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #00ff88, #00f0ff);
            transition: width 0.2s ease-out;
        }

        /* 道具倒數計時欄 */
        .buff-container {
            position: absolute;
            bottom: 15px;
            left: 15px;
            display: flex;
            gap: 10px;
            pointer-events: none;
            z-index: 5;
        }

        .buff-icon {
            width: 42px;
            height: 42px;
            border-radius: 8px;
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid #334155;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
            position: relative;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .buff-timer {
            font-size: 10px;
            color: #ffffff;
            margin-top: 1px;
        }

        /* 全螢幕覆蓋面板 */
        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 3, 12, 0.9);
            backdrop-filter: blur(6px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        .title-text {
            font-size: 34px;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #ff007f, #00f0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            text-shadow: 0 0 25px rgba(0, 240, 255, 0.4);
            text-transform: uppercase;
        }

        .score-display {
            font-size: 18px;
            color: #94a3b8;
            margin-bottom: 20px;
            text-align: center;
        }

        .score-display span {
            color: #00f0ff;
            font-weight: bold;
            font-size: 24px;
        }

        .btn {
            padding: 12px 36px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #030308;
            background: linear-gradient(90deg, #00f0ff, #7000ff);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
            transition: all 0.2s ease;
            outline: none;
        }

        .btn:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.8);
            background: linear-gradient(90deg, #33f3ff, #8a2be2);
        }

        .btn:active {
            transform: translateY(1px) scale(0.98);
        }

        .controls-hint {
            margin-top: 20px;
            color: #64748b;
            font-size: 13px;
            text-align: center;
            line-height: 1.7;
        }

        .controls-hint span {
            color: #f8fafc;
            background: #1e293b;
            padding: 2px 7px;
            border-radius: 4px;
            border: 1px solid #334155;
            font-weight: bold;
        }

        .legend-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px 16px;
            margin-top: 14px;
            font-size: 12px;
            color: #cbd5e1;
            text-align: left;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge {
            display: inline-block;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            text-align: center;
            line-height: 18px;
            font-weight: bold;
            font-size: 10px;
            color: #000;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="500" height="700"></canvas>
    
    <!-- 抬頭顯示器 (HUD) -->
    <div class="hud">
        <div class="hud-left">
            <div class="hud-item">
                <span class="hud-label">戰艦防禦裝甲</span>
                <div class="health-bar-container">
                    <div id="health-bar" class="health-bar-fill"></div>
                </div>
            </div>
            <div class="hud-item" style="margin-top: 4px;">
                <span class="hud-label">全螢幕炸彈 (B)</span>
                <span id="bomb-count" class="hud-value" style="color: #ff3366;">x 2</span>
            </div>
        </div>
        <div class="hud-right" style="text-align: right;">
            <div class="hud-item">
                <span class="hud-label">當前得分</span>
                <span class="hud-value" id="score">0</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">最高紀錄</span>
                <span class="hud-value" id="high-score" style="font-size: 16px; color: #94a3b8;">0</span>
            </div>
        </div>
    </div>

    <!-- 狀態強化指示列 -->
    <div id="buff-container" class="buff-container"></div>

    <!-- 遊戲開始 / 結束 遮罩層 -->
    <div id="game-overlay" class="overlay-screen">
        <h1 class="title-text" id="overlay-title">銀河戰將：火力全開</h1>
        <p class="score-display" id="overlay-score-container" style="display: none;">
            最終得分：<span id="final-score">0</span>
        </p>

        <button id="start-btn" class="btn" onclick="startGame()">開始遊戲</button>

        <div class="controls-hint">
            移動：<span>W A S D</span> 或 <span>← ↑ ↓ →</span><br>
            射擊：<span>Space (長按自動發射)</span> | 炸彈：<span>B</span> / <span>Shift</span>
            
            <div class="legend-grid">
                <div class="legend-item"><span class="badge" style="background: #ffd700;">3</span> 3向擴散子彈</div>
                <div class="legend-item"><span class="badge" style="background: #00f0ff;">S</span> 能量護盾</div>
                <div class="legend-item"><span class="badge" style="background: #e040fb;">L</span> 雷射重砲</div>
                <div class="legend-item"><span class="badge" style="background: #00ff88;">+</span> 機體裝甲修復</div>
                <div class="legend-item"><span class="badge" style="background: #ff3366;">B</span> 全螢幕毀滅炸彈</div>
            </div>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const scoreEl = document.getElementById('score');
const highScoreEl = document.getElementById('high-score');
const finalScoreEl = document.getElementById('final-score');
const healthBar = document.getElementById('health-bar');
const bombCountEl = document.getElementById('bomb-count');
const buffContainer = document.getElementById('buff-container');

const gameOverlay = document.getElementById('game-overlay');
const overlayTitle = document.getElementById('overlay-title');
const overlayScoreContainer = document.getElementById('overlay-score-container');
const startBtn = document.getElementById('start-btn');

let score = 0;
let highScore = localStorage.getItem('gs_highscore_v2') || 0;
highScoreEl.textContent = highScore;

let isGameOver = false;
let animationId;
let screenShakeTimer = 0;

// 按鍵監聽
const keys = {};
window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code.startsWith('Arrow') || e.code === 'ShiftLeft') e.preventDefault();
    
    // 釋放全螢幕炸彈 (按鍵 B 或 Shift)
    if ((e.code === 'KeyB' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') && !keys[e.code]) {
        triggerScreenBomb();
    }
    keys[e.code] = true;
});

window.addEventListener('keyup', e => {
    keys[e.code] = false;
});

class Starfield {
    constructor(width, height) {
        this.width = width;
        this.height = height;
        this.layers = [
            { count: 45, speed: 0.6, size: 1, stars: [], color: '#4b5563' },
            { count: 35, speed: 1.8, size: 1.5, stars: [], color: '#94a3b8' },
            { count: 18, speed: 4.0, size: 2.2, stars: [], color: '#00f0ff' }
        ];

        this.layers.forEach(layer => {
            for (let i = 0; i < layer.count; i++) {
                layer.stars.push({
                    x: Math.random() * this.width,
                    y: Math.random() * this.height,
                    alpha: 0.3 + Math.random() * 0.7
                });
            }
        });
    }

    update() {
        this.layers.forEach(layer => {
            layer.stars.forEach(star => {
                star.y += layer.speed;
                if (star.y > this.height) {
                    star.y = 0;
                    star.x = Math.random() * this.width;
                }
            });
        });
    }

    draw() {
        this.layers.forEach(layer => {
            ctx.fillStyle = layer.color;
            layer.stars.forEach(star => {
                ctx.globalAlpha = star.alpha;
                ctx.fillRect(star.x, star.y, layer.size, layer.size);
            });
        });
        ctx.globalAlpha = 1.0;
    }
}

class Particle {
    constructor(x, y, color, speedScale = 1) {
        this.x = x;
        this.y = y;
        this.color = color;
        const angle = Math.random() * Math.PI * 2;
        const speed = (1 + Math.random() * 6) * speedScale;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.radius = 1.5 + Math.random() * 2.5;
        this.alpha = 1;
        this.decay = 0.015 + Math.random() * 0.025;
        this.friction = 0.95;
    }

    update() {
        this.vx *= this.friction;
        this.vy *= this.friction;
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= this.decay;
    }

    draw() {
        if (this.alpha <= 0) return;
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

class FloatingText {
    constructor(x, y, text, color) {
        this.x = x;
        this.y = y;
        this.text = text;
        this.color = color;
        this.alpha = 1.0;
        this.vy = -1.2;
    }

    update() {
        this.y += this.vy;
        this.alpha -= 0.02;
    }

    draw() {
        if (this.alpha <= 0) return;
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.font = 'bold 14px "Segoe UI", sans-serif';
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 6;
        ctx.shadowColor = this.color;
        ctx.textAlign = 'center';
        ctx.fillText(this.text, this.x, this.y);
        ctx.restore();
    }
}

const POWERUP_TYPES = {
    SPREAD: { type: 'SPREAD', symbol: '3', name: '三向子彈', color: '#ffd700' },
    SHIELD: { type: 'SHIELD', symbol: 'S', name: '能量護盾', color: '#00f0ff' },
    LASER:  { type: 'LASER',  symbol: 'L', name: '重型雷射', color: '#e040fb' },
    REPAIR: { type: 'REPAIR', symbol: '+', name: '裝甲修復', color: '#00ff88' },
    BOMB:   { type: 'BOMB',   symbol: 'B', name: '毀滅炸彈', color: '#ff3366' }
};

class PowerUp {
    constructor(x, y, config) {
        this.x = x;
        this.y = y;
        this.config = config;
        this.radius = 15;
        this.speed = 1.8;
        this.angle = Math.random() * Math.PI * 2;
        this.pulse = 0;
    }

    update() {
        this.y += this.speed;
        this.x += Math.sin(this.angle) * 0.8;
        this.angle += 0.05;
        this.pulse += 0.08;
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        const pulseScale = 1 + Math.sin(this.pulse) * 0.15;
        ctx.scale(pulseScale, pulseScale);

        // 外層霓虹光暈
        ctx.shadowBlur = 12;
        ctx.shadowColor = this.config.color;
        
        // 圓形背景球體
        ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
        ctx.strokeStyle = this.config.color;
        ctx.lineWidth = 2.5;

        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // 內部文字標籤
        ctx.fillStyle = this.config.color;
        ctx.font = 'bold 13px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.config.symbol, 0, 1);

        ctx.restore();
    }
}

class Player {
    constructor() {
        this.width = 38;
        this.height = 44;
        this.x = canvas.width / 2 - this.width / 2;
        this.y = canvas.height - 90;
        this.speed = 6.5;

        this.maxHp = 100;
        this.hp = 100;
        this.bombs = 2;

        this.lastShootTime = 0;
        this.shootInterval = 140; // 發射冷卻

        // Buff 狀態
        this.spreadTimer = 0;
        this.laserTimer = 0;
        this.shieldActive = false;
        this.shieldHp = 0;

        this.engineFlameFrame = 0;
    }

    draw() {
        ctx.save();

        // 能量護盾視覺效果
        if (this.shieldActive) {
            ctx.save();
            ctx.shadowBlur = 18;
            ctx.shadowColor = '#00f0ff';
            ctx.strokeStyle = 'rgba(0, 240, 255, 0.8)';
            ctx.fillStyle = 'rgba(0, 240, 255, 0.12)';
            ctx.lineWidth = 2.5;

            ctx.beginPath();
            ctx.arc(this.x + this.width / 2, this.y + this.height / 2, 36, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.restore();
        }

        // 噴射火焰動畫
        this.engineFlameFrame++;
        const flameHeight = 12 + Math.sin(this.engineFlameFrame * 0.4) * 5;
        const flameGradient = ctx.createLinearGradient(0, this.y + this.height, 0, this.y + this.height + flameHeight);
        flameGradient.addColorStop(0, '#00f0ff');
        flameGradient.addColorStop(1, 'transparent');

        ctx.fillStyle = flameGradient;
        ctx.beginPath();
        ctx.moveTo(this.x + this.width * 0.3, this.y + this.height - 4);
        ctx.lineTo(this.x + this.width * 0.7, this.y + this.height - 4);
        ctx.lineTo(this.x + this.width * 0.5, this.y + this.height + flameHeight);
        ctx.closePath();
        ctx.fill();

        // 戰艦發光本體
        ctx.shadowBlur = 14;
        ctx.shadowColor = this.laserTimer > 0 ? '#e040fb' : (this.spreadTimer > 0 ? '#ffd700' : '#00f0ff');

        ctx.fillStyle = this.laserTimer > 0 ? '#e040fb' : (this.spreadTimer > 0 ? '#ffd700' : '#00f0ff');
        ctx.beginPath();
        ctx.moveTo(this.x + this.width / 2, this.y);
        ctx.lineTo(this.x + this.width, this.y + this.height);
        ctx.lineTo(this.x + this.width * 0.72, this.y + this.height * 0.8);
        ctx.lineTo(this.x + this.width * 0.28, this.y + this.height * 0.8);
        ctx.lineTo(this.x, this.y + this.height);
        ctx.closePath();
        ctx.fill();

        // 駕駛艙
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(this.x + this.width / 2, this.y + 8);
        ctx.lineTo(this.x + this.width * 0.65, this.y + 22);
        ctx.lineTo(this.x + this.width * 0.35, this.y + 22);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
    }

    update() {
        // 移動邏輯
        if ((keys['ArrowLeft'] || keys['KeyA']) && this.x > 0) this.x -= this.speed;
        if ((keys['ArrowRight'] || keys['KeyD']) && this.x < canvas.width - this.width) this.x += this.speed;
        if ((keys['ArrowUp'] || keys['KeyW']) && this.y > 0) this.y -= this.speed;
        if ((keys['ArrowDown'] || keys['KeyS']) && this.y < canvas.height - this.height) this.y += this.speed;

        // Buff 倒數時間
        if (this.spreadTimer > 0) this.spreadTimer--;
        if (this.laserTimer > 0) this.laserTimer--;

        // 自動連續射擊
        if (keys['Space']) {
            const now = Date.now();
            const currentInterval = this.laserTimer > 0 ? 80 : this.shootInterval;
            
            if (now - this.lastShootTime > currentInterval) {
                this.shoot();
                this.lastShootTime = now;
            }
        }
    }

    shoot() {
        const cx = this.x + this.width / 2;
        const cy = this.y;

        if (this.laserTimer > 0) {
            // 重型雷射模式
            bullets.push(new Bullet(cx, cy, 0, -14, '#e040fb', 6, 24, 2));
        } else if (this.spreadTimer > 0) {
            // 3向擴散子彈
            bullets.push(new Bullet(cx, cy, 0, -11, '#ffd700', 4, 16, 1));
            bullets.push(new Bullet(cx - 8, cy + 4, -3, -10, '#ffd700', 4, 16, 1));
            bullets.push(new Bullet(cx + 8, cy + 4, 3, -10, '#ffd700', 4, 16, 1));
        } else {
            // 標準雙發子彈
            bullets.push(new Bullet(this.x + 6, cy + 10, 0, -10, '#00f0ff', 3, 16, 1));
            bullets.push(new Bullet(this.x + this.width - 6, cy + 10, 0, -10, '#00f0ff', 3, 16, 1));
        }
    }

    takeDamage(damage) {
        if (this.shieldActive) {
            this.shieldHp -= damage;
            floatingTexts.push(new FloatingText(this.x + this.width / 2, this.y, "護盾抵擋!", "#00f0ff"));
            createExplosion(this.x + this.width / 2, this.y + this.height / 2, '#00f0ff', 12);
            if (this.shieldHp <= 0) {
                this.shieldActive = false;
                floatingTexts.push(new FloatingText(this.x + this.width / 2, this.y - 15, "護盾破裂!", "#ff3366"));
            }
            return;
        }

        this.hp = Math.max(0, this.hp - damage);
        healthBar.style.width = `${(this.hp / this.maxHp) * 100}%`;
        triggerScreenShake(8);

        createExplosion(this.x + this.width / 2, this.y + this.height / 2, '#ff3366', 15);

        if (this.hp <= 0) {
            endGame();
        }
    }
}

class Bullet {
    constructor(x, y, vx, vy, color, width = 3, height = 16, damage = 1) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.color = color;
        this.width = width;
        this.height = height;
        this.damage = damage;
    }

    draw() {
        ctx.save();
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x - this.width / 2, this.y, this.width, this.height);
        ctx.restore();
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
    }
}

class Enemy {
    constructor() {
        this.width = 34;
        this.height = 34;
        this.x = Math.random() * (canvas.width - this.width);
        this.y = -this.height;
        this.speed = 2 + Math.random() * 2.5;
        this.color = '#ff007f';
        this.hp = 1;
    }

    draw() {
        ctx.save();
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.fillStyle = this.color;

        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(this.x + this.width, this.y);
        ctx.lineTo(this.x + this.width / 2, this.y + this.height);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(this.x + this.width / 2, this.y + this.height / 3, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

    update() {
        this.y += this.speed;
    }
}

const starfield = new Starfield(canvas.width, canvas.height);
let player = new Player();
let bullets = [];
let enemies = [];
let powerUps = [];
let particles = [];
let floatingTexts = [];
let enemyTimer = 0;

function createExplosion(x, y, color, count = 25, speedScale = 1) {
    for (let i = 0; i < count; i++) {
        particles.push(new Particle(x, y, color, speedScale));
    }
}

function triggerScreenShake(magnitude) {
    screenShakeTimer = magnitude;
}

function triggerScreenBomb() {
    if (!isGameRunning || player.bombs <= 0) return;

    player.bombs--;
    bombCountEl.textContent = `x ${player.bombs}`;

    // 強烈螢幕震動與震撼粒子
    triggerScreenShake(20);
    createExplosion(canvas.width / 2, canvas.height / 2, '#ff3366', 120, 2.5);
    createExplosion(canvas.width / 2, canvas.height / 2, '#ffd700', 80, 2);

    floatingTexts.push(new FloatingText(canvas.width / 2, canvas.height / 2, "全螢幕毀滅打擊！", "#ff3366"));

    // 清空畫面上所有敵機並加分
    enemies.forEach(enemy => {
        score += 100;
        createExplosion(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, '#ff007f', 15);
    });
    enemies = [];
    scoreEl.textContent = score;
}

function spawnEnemies() {
    enemyTimer++;
    const spawnRate = Math.max(18, 45 - Math.floor(score / 600));
    if (enemyTimer % spawnRate === 0) {
        enemies.push(new Enemy());
    }
}

function spawnPowerUpDrop(x, y) {
    // 28% 機率掉落道具
    if (Math.random() < 0.28) {
        const types = Object.values(POWERUP_TYPES);
        const selectedType = types[Math.floor(Math.random() * types.length)];
        powerUps.push(new PowerUp(x, y, selectedType));
    }
}

function checkCollisions() {
    // 子彈 <-> 敵機碰撞
    bullets.forEach((bullet, bIndex) => {
        enemies.forEach((enemy, eIndex) => {
            if (
                bullet.x > enemy.x &&
                bullet.x < enemy.x + enemy.width &&
                bullet.y > enemy.y &&
                bullet.y < enemy.y + enemy.height
            ) {
                enemy.hp -= bullet.damage;
                bullets.splice(bIndex, 1);

                if (enemy.hp <= 0) {
                    createExplosion(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, '#ff007f', 20);
                    createExplosion(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, '#ffd700', 8);

                    spawnPowerUpDrop(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2);

                    enemies.splice(eIndex, 1);
                    score += 100;
                    scoreEl.textContent = score;

                    if (score > highScore) {
                        highScore = score;
                        highScoreEl.textContent = highScore;
                        localStorage.setItem('gs_highscore_v2', highScore);
                    }
                }
            }
        });
    });

    // 玩家 <-> 道具撿取碰撞
    powerUps.forEach((powerUp, pIndex) => {
        const dist = Math.hypot(
            (player.x + player.width / 2) - powerUp.x,
            (player.y + player.height / 2) - powerUp.y
        );

        if (dist < player.width / 2 + powerUp.radius) {
            // 套用道具效果
            applyPowerUp(powerUp.config);
            createExplosion(powerUp.x, powerUp.y, powerUp.config.color, 18);
            powerUps.splice(pIndex, 1);
        }
    });

    // 玩家 <-> 敵機碰撞
    enemies.forEach((enemy, eIndex) => {
        if (
            player.x < enemy.x + enemy.width &&
            player.x + player.width > enemy.x &&
            player.y < enemy.y + enemy.height &&
            player.y + player.height > enemy.y
        ) {
            createExplosion(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, '#ff007f', 20);
            enemies.splice(eIndex, 1);
            player.takeDamage(25);
        }
    });
}

function applyPowerUp(config) {
    floatingTexts.push(new FloatingText(player.x + player.width / 2, player.y - 10, `${config.name}!`, config.color));

    switch (config.type) {
        case 'SPREAD':
            player.spreadTimer = 450; // 約 7.5 秒
            break;
        case 'SHIELD':
            player.shieldActive = true;
            player.shieldHp = 50;
            break;
        case 'LASER':
            player.laserTimer = 350; // 約 6 秒
            break;
        case 'REPAIR':
            player.hp = Math.min(player.maxHp, player.hp + 35);
            healthBar.style.width = `${(player.hp / player.maxHp) * 100}%`;
            break;
        case 'BOMB':
            player.bombs++;
            bombCountEl.textContent = `x ${player.bombs}`;
            break;
    }
}

function updateBuffUI() {
    buffContainer.innerHTML = '';

    if (player.spreadTimer > 0) {
        buffContainer.appendChild(createBuffBadge(POWERUP_TYPES.SPREAD, Math.ceil(player.spreadTimer / 60)));
    }
    if (player.laserTimer > 0) {
        buffContainer.appendChild(createBuffBadge(POWERUP_TYPES.LASER, Math.ceil(player.laserTimer / 60)));
    }
    if (player.shieldActive) {
        buffContainer.appendChild(createBuffBadge(POWERUP_TYPES.SHIELD, 'ON'));
    }
}

function createBuffBadge(config, timerText) {
    const el = document.createElement('div');
    el.className = 'buff-icon';
    el.style.borderColor = config.color;
    el.style.color = config.color;
    el.innerHTML = `${config.symbol}<span class="buff-timer">${timerText}s</span>`;
    return el;
}

function endGame() {
    isGameOver = true;
    isGameRunning = false;
    finalScoreEl.textContent = score;
    overlayTitle.textContent = "戰艦毀滅 - GAME OVER";
    overlayScoreContainer.style.display = "block";
    startBtn.textContent = "重新開始";

    setTimeout(() => {
        gameOverlay.style.opacity = '1';
        gameOverlay.style.pointerEvents = 'auto';
    }, 400);

    cancelAnimationFrame(animationId);
}

function startGame() {
    score = 0;
    scoreEl.textContent = score;
    bullets = [];
    enemies = [];
    powerUps = [];
    particles = [];
    floatingTexts = [];
    enemyTimer = 0;

    isGameOver = false;
    isGameRunning = true;
    
    player = new Player();
    healthBar.style.width = '100%';
    bombCountEl.textContent = `x ${player.bombs}`;

    gameOverlay.style.opacity = '0';
    gameOverlay.style.pointerEvents = 'none';

    animate();
}

function animate() {
    if (isGameOver) return;

    // 畫面震動偏移
    ctx.save();
    if (screenShakeTimer > 0) {
        const dx = (Math.random() - 0.5) * screenShakeTimer;
        const dy = (Math.random() - 0.5) * screenShakeTimer;
        ctx.translate(dx, dy);
        screenShakeTimer--;
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. 背景星空
    starfield.update();
    starfield.draw();

    // 2. 玩家更新與繪製
    player.update();
    player.draw();

    // 3. 道具更新與繪製
    powerUps.forEach((powerUp, index) => {
        powerUp.update();
        powerUp.draw();
        if (powerUp.y > canvas.height + 30) powerUps.splice(index, 1);
    });

    // 4. 子彈更新與繪製
    bullets.forEach((bullet, index) => {
        bullet.update();
        bullet.draw();
        if (bullet.y < -20 || bullet.y > canvas.height + 20) bullets.splice(index, 1);
    });

    // 5. 敵機生成與繪製
    spawnEnemies();
    enemies.forEach((enemy, index) => {
        enemy.update();
        enemy.draw();
        if (enemy.y > canvas.height + 40) enemies.splice(index, 1);
    });

    // 6. 爆炸粒子特效
    particles.forEach((particle, index) => {
        particle.update();
        particle.draw();
        if (particle.alpha <= 0) particles.splice(index, 1);
    });

    // 7. 飄浮提示文字
    floatingTexts.forEach((ft, index) => {
        ft.update();
        ft.draw();
        if (ft.alpha <= 0) floatingTexts.splice(index, 1);
    });

    // 8. 碰撞檢測與 UI 狀態更新
    checkCollisions();
    updateBuffUI();

    ctx.restore();

    animationId = requestAnimationFrame(animate);
}

// 預先繪製星空背景
starfield.draw();
</script>
</body>
